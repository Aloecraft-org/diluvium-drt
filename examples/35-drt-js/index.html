<!doctype html>
<meta charset="utf-8">
<title>drt.js: a terminal and a kernel inspector</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>

<main>
  <section id="terminal"></section>

  <aside x-data="inspector">
    <h2>Variables <small x-text="vars.length ? '' : 'nothing defined; drt repl, then x = 1'"></small></h2>
    <table>
      <template x-for="v in vars" :key="v.name">
        <tr>
          <td x-text="v.name"></td>
          <td x-text="v.type"></td>
          <td x-text="v.type === 'function' ? `(${v.params}${v.vararg ? ', ...' : ''})` : v.value"></td>
        </tr>
      </template>
    </table>

    <h2>Instances <small x-text="note"></small></h2>
    <table>
      <tr><th>id</th><th>parent</th><th>state</th><th>instructions</th><th>caps</th><th></th></tr>
      <template x-for="row in rows" :key="row.id">
        <tr>
          <td x-text="row.id"></td>
          <td x-text="row.parent ?? '-'"></td>
          <td x-text="row.resident ? 'resident' : 'parked'"></td>
          <td x-text="row.instructions"></td>
          <td x-text="row.caps"></td>
          <td>
            <button @click="act('hibernate', row.id)" x-show="row.resident">park</button>
            <button @click="act('wake', row.id)" x-show="!row.resident">wake</button>
            <button @click="act('kill', row.id)">kill</button>
          </td>
        </tr>
      </template>
    </table>

    <h2>Files</h2>
    <section id="files"></section>
  </aside>
</main>
