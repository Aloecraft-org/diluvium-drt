<!doctype html>
<meta charset="utf-8">
<title>drt in the browser</title>
<link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css">
<script src="./node_modules/@xterm/xterm/lib/xterm.js"></script>
<style>
  body { margin: 0; padding: 1rem 1.25rem; background: #101418; color: #d8dee4;
         font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  h1 { font-size: 1rem; margin: 0 0 .25rem; }
  #about { margin: 0 0 1rem; white-space: pre-wrap; color: #8b97a3; }
  #screen { height: 60vh; }
  /* Where replTranscript's terminal lives: on the page, because xterm.js
     renders nothing until it is opened into something laid out. */
  #offscreen { position: absolute; left: -10000px; width: 80ch; height: 24em; }
</style>
<h1>drt</h1>
<p id="about">loading pkg/drt_web.js…</p>
<div id="screen"></div>
<div id="offscreen"></div>
<script type="module">
  // The page has two readers. A person gets a terminal: a real xterm.js
  // above, with a hello.dlua seeded so `drt run hello.dlua` has something
  // to run. The suite (run.mjs) gets window.drtBrowserTest: a fresh
  // DrtTerm per example, files to seed, a cmd line to run through shell.js
  // with stdout and stderr merged, and the REPL typed at drt-term.js for
  // the parity check. Same module, same shell, same adapter, either way.
  //
  // Both terminals here are xterm.js and neither is hand-written. They
  // were, when the page's editor was a printable-and-backspace loop that
  // emitted nothing a terminal had to interpret. `ego_cli` renders -- it
  // moves the cursor, redraws a line, clears to the end -- so a <pre> that
  // appends characters would now be a third terminal emulator to get
  // wrong, which is the thing D8 exists to avoid.
  import init, { DrtTerm, DrtEditor, DrtSwarm, DrtSocket, DrtSshServer, buildInfo, abiVersion, setPanicHook } from './pkg/drt_web.js';
  import { makeShell } from './shell.js';
  import { attach } from './drt-term.js';
  import { terminalFor } from './ssh-terminal.js';
  import { park } from './relay-leg.js';

  const decode = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  // The other direction, for the SSH bridge: Playwright's exposed
  // functions carry JSON, so bytes travel as base64 either way.
  const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
  const sshSockets = new Map();
  const sshShells = new Map();
  const sshParked = new Map();

  let term = null;
  let shell = null;
  let chunks = [];
  let decoders = [];

  function fresh() {
    if (term) term.free();
    chunks = [];
    decoders = [null, new TextDecoder(), new TextDecoder()];
    term = new DrtTerm((fd, bytes) => chunks.push(decoders[fd].decode(bytes, { stream: true })));
    shell = makeShell({ term, write: (fd, text) => chunks.push(text) });
  }

  const harness = {
    ready: init().then(() => {
      setPanicHook();
      return true;
    }),
    buildInfo: (json) => buildInfo(json),
    abiVersion: () => abiVersion(),
    // The swarm table, driven the way the Lab's Instances panel drives
    // it: root a program, step until it settles, and read the roster and
    // its capability answers back. What this proves is that the exports
    // are a swarm and not a shape -- the instance runs, is asked what it
    // holds, and is killed.
    swarmRoundTrip(source) {
      const sw = new DrtSwarm(0, 0);
      const out = {};
      try {
        const root = sw.root(new TextEncoder().encode(source));
        out.root = root;
        out.parent = sw.parent(root) ?? null;
        out.holdsTime = sw.holds(root, 'host:time');
        out.holdsLifecycle = sw.holds(root, 'lifecycle');
        out.parentOfNobody = sw.parent(9999) ?? null;
        out.caps = sw.caps(root);
        out.resident = sw.resident(root);
        out.slots = sw.slotsAllocated();
        let steps = 0;
        while (sw.step() > 0 && steps < 100) steps += 1;
        out.steps = steps;
        out.aliveAfter = sw.alive();
        out.idsAfter = sw.ids();
      } finally {
        sw.free();
      }
      return out;
    },
    // The transport (doc/SshInBrowser.md): a byte stream whose socket
    // stays in the page. This is the page's whole side of it -- deliver
    // what arrives, pump what Rust wants written, close when the wire
    // does -- and the loop below is the one from `ws.rs`'s header with a
    // WebSocket swapped for the caller's strings. `startEcho` stands in
    // for the SSH session: what is under test is the stream, not what
    // reads it.
    async socketEcho(messages) {
      const socket = new DrtSocket();
      socket.startEcho();
      const back = [];
      const pump = (async () => {
        for (;;) {
          const out = await socket.nextOutgoing();
          if (out === undefined) break;
          back.push(out);
        }
      })();

      const encoder = new TextEncoder();
      const want = messages.join('').length;
      const size = () => back.reduce((n, b) => n + b.length, 0);
      const sent = messages.every((m) => socket.deliver(encoder.encode(m)));
      const deadline = Date.now() + 5000;
      while (size() < want && Date.now() < deadline) {
        await new Promise((r) => setTimeout(r, 0));
      }

      // Closing must end both halves: Rust reads end of input, the task
      // above it stops and drops the stream, and that is what the page's
      // pump loop sees.
      socket.close();
      const afterClose = socket.deliver(encoder.encode('too late'));
      const ended = await Promise.race([
        pump.then(() => true),
        new Promise((r) => setTimeout(() => r(false), 5000)),
      ]);
      socket.free();

      const joined = new Uint8Array(size());
      let at = 0;
      for (const chunk of back) {
        joined.set(chunk, at);
        at += chunk.length;
      }
      return { sent, afterClose, ended, chunks: back.length, echoed: new TextDecoder().decode(joined) };
    },
    // SSH into the page (doc/SshInBrowser.md). The suite drives this
    // with a real `ssh` client: run.mjs listens on a TCP port, shuttles
    // bytes between that socket and the one below, and points `ssh` at
    // it. So what is under test is the product's claim -- a standard
    // client gets a terminal into a page -- rather than two things we
    // wrote agreeing with each other.
    //
    // The shell behind the session is the page's own: `terminalFor` makes
    // the SSH channel into the object `attach` takes, and everything
    // after that is M8's editor and shell.js, unchanged.
    sshHostKey: () => DrtSshServer.generateHostKey(),
    sshServe(id, hostKey, authorizedKeys) {
      const server = new DrtSshServer(hostKey, authorizedKeys);
      const socket = server.serve((shell) => {
        const terminal = terminalFor(shell);
        const bound = attach(DrtTerm, terminal, { DrtEditor, banner: 'drt in a page' });
        bound.term.putFile('/hello.dlua', new TextEncoder().encode(
          'print("hello over ssh")\n'));
        bound.term.setCwd('/');
        sshShells.set(id, { terminal, bound });
      });
      sshSockets.set(id, socket);
      (async () => {
        for (;;) {
          const out = await socket.nextOutgoing();
          if (out === undefined) break;
          await window.sshOutgoing(id, b64(out));
        }
        await window.sshClosed(id);
      })();
      return { fingerprint: server.fingerprint, authorized: server.authorized };
    },
    // The whole chain (doc/SshInBrowser.md): the page parks a leg on a
    // real `drt relay`, and `ssh -o ProxyCommand="drt tunnel ..."` claims
    // it. Nothing is bridged by the suite here -- the bytes go over the
    // relay the way they will in production, and the only thing this adds
    // is the label and the keys.
    sshPark(url, hostKey, authorizedKeys) {
      const server = new DrtSshServer(hostKey, authorizedKeys);
      const events = [];
      const leg = park(
        url,
        () =>
          server.serve((shell) => {
            const terminal = terminalFor(shell);
            const bound = attach(DrtTerm, terminal, { DrtEditor, banner: 'drt over a relay' });
            bound.term.putFile('/hello.dlua', new TextEncoder().encode(
              'print("hello through a tunnel")\n'));
            bound.term.setCwd('/');
          }),
        { onEvent: (name) => events.push(name) },
      );
      sshParked.set(1, { leg, events });
      return true;
    },
    sshParkEvents: () => (sshParked.get(1) ? sshParked.get(1).events : []),
    sshUnpark() {
      const held = sshParked.get(1);
      if (held) held.leg.close();
      sshParked.delete(1);
    },
    sshDeliver(id, data) {
      const socket = sshSockets.get(id);
      return socket ? socket.deliver(decode(data)) : false;
    },
    sshClose(id) {
      const held = sshShells.get(id);
      if (held) held.bound.dispose();
      const socket = sshSockets.get(id);
      if (socket) socket.close();
      sshShells.delete(id);
      sshSockets.delete(id);
    },
    seed({ cwd, files, dirs = [] }) {
      fresh();
      for (const d of dirs) term.putDir(d);
      for (const { path, data } of files) term.putFile(path, decode(data));
      term.setCwd(cwd);
    },
    async run(line) {
      if (!term) fresh();
      chunks = [];
      const status = await shell.run(line);
      return { status, output: chunks.join('') };
    },
    // The REPL, typed at a real terminal and read back from what it
    // renders. Raw writes would do for a printable-and-backspace loop and
    // will not for an editor: the bytes now carry cursor moves and
    // redraws, and the question the check asks -- does the page's repl say
    // what the native one says -- is about the screen, not the stream.
    // `terminal.input` is xterm.js's own "as if typed", so `attach`'s
    // `onData` path is the one under test.
    async replTranscript(lines) {
      const terminal = new Terminal({ cols: 80, rows: 40, convertEol: false });
      terminal.open(document.getElementById('offscreen'));
      const bound = attach(DrtTerm, terminal, { DrtEditor });
      const type = async (text) => {
        await bound.whenIdle();
        terminal.input(text, true);
      };
      await type('drt repl\r');
      for (const line of lines) await type(line + '\r');
      await type('\x04');
      await bound.whenIdle();
      // One turn for the last write to reach the buffer: xterm.js parses
      // what it is given asynchronously.
      await new Promise((r) => setTimeout(r, 50));
      const buf = terminal.buffer.active;
      const rendered = [];
      for (let i = 0; i < buf.length; i++) {
        rendered.push(buf.getLine(i).translateToString(true));
      }
      bound.dispose();
      bound.term.free();
      terminal.dispose();
      term = null;
      return rendered.join('\n').replace(/\n+$/, '') + '\n';
    },
  };
  window.drtBrowserTest = harness;

  // depth: the person's terminal, a <pre> with a keyboard.
  const screen = document.getElementById('screen');
  const about = document.getElementById('about');
  try {
    await harness.ready;
    about.textContent = buildInfo(false).trimEnd() + `\nabi: ${abiVersion()}\n\n` +
      'a terminal: type `drt run hello.dlua`, `drt repl`, `drt --help`. click to focus.';
    const terminal = new Terminal({
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      fontSize: 13,
      cursorBlink: true,
      theme: { background: '#101418', foreground: '#d8dee4' },
    });
    if (!location.search.includes('nodemo')) terminal.open(screen);
    const bound = attach(DrtTerm, terminal, { DrtEditor });
    bound.term.putFile('/hello.dlua', new TextEncoder().encode(
      'print("hello from a page")\nprint("the time is", host.time())\n'));
    bound.term.setCwd('/');
    term = null;
  } catch (e) {
    about.textContent = `drt_web did not load: ${(e && e.stack) || e}`;
    throw e;
  }
</script>
