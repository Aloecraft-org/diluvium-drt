<!doctype html>
<meta charset="utf-8">
<title>drt in the browser</title>
<link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css">
<script src="./node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="./node_modules/sql.js/dist/sql-wasm.js"></script>
<style>
  body { margin: 0; padding: 1rem 1.25rem; background: #101418; color: #d8dee4;
         font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  h1 { font-size: 1rem; margin: 0 0 .25rem; }
  #about { margin: 0 0 1rem; white-space: pre-wrap; color: #8b97a3; }
  #screen { height: 60vh; }
  /* Where replTranscript's terminal lives: on the page, because xterm.js
     renders nothing until it is opened into something laid out. */
  #offscreen { position: absolute; left: -10000px; width: 80ch; height: 24em; }
</style>
<h1>drt</h1>
<p id="about">loading pkg/drt_web.js…</p>
<div id="screen"></div>
<div id="offscreen"></div>
<script type="module">
  // The page has two readers. A person gets a terminal: a real xterm.js
  // above, with a hello.dlua seeded so `drt run hello.dlua` has something
  // to run. The suite (run.mjs) gets window.drtBrowserTest: a fresh
  // DrtTerm per example, files to seed, a cmd line to run through shell.js
  // with stdout and stderr merged, and the REPL typed at drt-term.js for
  // the parity check. Same module, same shell, same adapter, either way.
  //
  // Both terminals here are xterm.js and neither is hand-written. They
  // were, when the page's editor was a printable-and-backspace loop that
  // emitted nothing a terminal had to interpret. `ego_cli` renders -- it
  // moves the cursor, redraws a line, clears to the end -- so a <pre> that
  // appends characters would now be a third terminal emulator to get
  // wrong, which is the thing D8 exists to avoid.
  import init, { DrtTerm, DrtEditor, DrtSwarm, DrtSocket, DrtSshServer, buildInfo, abiVersion, setPanicHook } from './pkg/drt_web.js';
  import { makeShell } from './shell.js';
  import { attach } from './drt-term.js';
  import { terminalFor } from './ssh-terminal.js';
  import { park } from './relay-leg.js';
  import { splice } from './stream-leg.js';
  import { bus } from './net-bus.js';
  import * as pageFs from './page-fs.js';

  const decode = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  // The other direction, for the SSH bridge: Playwright's exposed
  // functions carry JSON, so bytes travel as base64 either way.
  const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
  const sshSockets = new Map();
  const sshShells = new Map();
  const sshParked = new Map();
  const sshAnswered = [];
  const sshListening = [];

  let term = null;
  let shell = null;
  // sql.js, handed to every example's terminal as its `sql` (issue #81):
  // what lets examples/07-sql run here unchanged against expected.txt.
  let SQL = null;
  let chunks = [];
  let decoders = [];

  function fresh(backings) {
    if (term) term.free();
    chunks = [];
    decoders = [null, new TextDecoder(), new TextDecoder()];
    term = new DrtTerm((fd, bytes) => chunks.push(decoders[fd].decode(bytes, { stream: true })), { sql: SQL, ...backings });
    shell = makeShell({ term, write: (fd, text) => chunks.push(text) });
  }


  // A page filesystem in a map: the seven calls of crates/drt-web
  // src/pagefs.rs over plain objects, for the `page-fs` check. Errors carry
  // the codes pagefs.rs reads.
  function memoryFs() {
    const files = new Map();
    const dirs = new Set(['/']);
    const parent = (p) => p.slice(0, p.lastIndexOf('/')) || '/';
    const refuse = (code, message) => { throw Object.assign(new Error(message), { code }); };
    const under = (dir, p) => dir === '/' ? p !== '/' : p.startsWith(`${dir}/`);
    return {
      stat: (p) => dirs.has(p) ? { dir: true, size: 0 } : files.has(p) ? { dir: false, size: files.get(p).length } : null,
      read: (p) => files.get(p) ?? refuse(dirs.has(p) ? 'not_an_entry' : 'not_found', `nothing at ${p}`),
      write(p, bytes, append) {
        if (dirs.has(p)) refuse('not_an_entry', `Is a directory: ${p}`);
        if (!dirs.has(parent(p))) refuse('not_found', `no directory ${parent(p)}`);
        const old = append ? files.get(p) ?? new Uint8Array() : new Uint8Array();
        const next = new Uint8Array(old.length + bytes.length);
        next.set(old);
        next.set(bytes, old.length);
        files.set(p, next);
      },
      list(p) {
        if (!dirs.has(p)) refuse(files.has(p) ? 'not_a_container' : 'not_found', `not a directory: ${p}`);
        const names = [...dirs, ...files.keys()].filter((q) => q !== p && parent(q) === p);
        return names.map((q) => q.slice(q.lastIndexOf('/') + 1)).sort();
      },
      remove(p) {
        if (dirs.has(p)) refuse('not_an_entry', `Is a directory: ${p}`);
        if (!files.delete(p)) refuse('not_found', `nothing at ${p}`);
      },
      mkdirs(p) {
        let here = '';
        for (const part of p.split('/').filter(Boolean)) {
          here += `/${part}`;
          if (files.has(here)) refuse('not_a_container', `Not a directory: ${here}`);
          dirs.add(here);
        }
      },
      removeAll(p) {
        for (const q of [...files.keys()]) if (q === p || under(p, q)) files.delete(q);
        for (const q of [...dirs]) if (q !== '/' && (q === p || under(p, q))) dirs.delete(q);
      },
    };
  }

  const harness = {
    ready: init().then(async () => {
      setPanicHook();
      SQL = await initSqlJs({ locateFile: (f) => `./node_modules/sql.js/dist/${f}` });
      return true;
    }),
    buildInfo: (json) => buildInfo(json),
    abiVersion: () => abiVersion(),
    // The REPL as bytes (doc/P2P.md §5.2): a DrtTerm's `repl`, driven the
    // way a launcher drives a root's attach stream -- keystrokes in,
    // bytes out, a resize, then ^D. Answers what came out, in order, and
    // the status `closed` was called with.
    async replBytes(lines) {
      const term = new DrtTerm(() => {});
      const decoder = new TextDecoder();
      let out = '';
      let status = null;
      const repl = term.repl(80, 24, (bytes) => { out += decoder.decode(bytes, { stream: true }); }, (s) => { status = s; });
      const until = async (pred) => {
        const deadline = Date.now() + 10000;
        while (!pred() && Date.now() < deadline) await new Promise((r) => setTimeout(r, 10));
        return pred();
      };
      const encoder = new TextEncoder();
      const prompts = [];
      for (const line of lines) {
        if (!(await until(() => /dv> $/.test(out)))) break;
        prompts.push(out.length);
        repl.input(encoder.encode(`${line}\r`));
        await until(() => out.length > prompts[prompts.length - 1] && /(dv> |>> )$/.test(out));
      }
      repl.resize(100, 30);
      repl.input(encoder.encode('\x04'));
      const closed = await until(() => status !== null);
      // A second session on the same terminal once the first ended.
      let again = null;
      if (closed) {
        try {
          const r2 = term.repl(80, 24, () => {}, () => {});
          again = true;
          r2.close();
        } catch (e) {
          again = String(e);
        }
      }
      return { out, status, closed, again, prompts: prompts.length };
    },
    // Two kernels in one page (doc/Browser.md): two DrtTerms from one
    // module, each with its own sink and filesystem, their commands ticked
    // alternately, then a raw REPL on each, both open at once. Answers
    // what each sink and stream got and what each filesystem holds, for
    // run.mjs to say whether either saw the other.
    async twoKernels() {
      const kernel = (name, other) => {
        const k = { out: '', decoder: new TextDecoder() };
        k.term = new DrtTerm((fd, bytes) => { k.out += k.decoder.decode(bytes, { stream: true }); });
        const put = (path, text) => k.term.putFile(path, new TextEncoder().encode(text));
        k.term.putDir('/k/data');
        put('/k/app.dlua',
          `print('print from ${name}')\n` +
          `host.fs.write('${name}.txt', '${name}')\n` +
          `local _, seen = host.fs.try_read('${other}.txt')\n` +
          `host.fs.write('saw-other.txt', tostring(seen))\n`);
        put('/k/bad.dlua', `error('boom from ${name}')`);
        put('/k/deploy.json', JSON.stringify({
          program: { path: 'app.dlua' },
          caps: [{ capability: 'host:fs/*' }],
          connectors: { fs: { scope: { scope: './data', access: 'readwrite' } } },
        }));
        k.term.setCwd('/k');
        return k;
      };
      const a = kernel('a', 'b');
      // Made second, so its filesystem and sink are the ones installed last.
      const b = kernel('b', 'a');
      const sessions = [
        a.term.exec(['drt', 'run', '--config', 'deploy.json']),
        b.term.exec(['drt', 'run', '--config', 'deploy.json']),
        a.term.exec(['drt', 'run', 'bad.dlua']),
        b.term.exec(['drt', 'run', 'bad.dlua']),
      ];
      const status = sessions.map(() => null);
      const deadline = Date.now() + 10000;
      while (status.some((s) => s === null) && Date.now() < deadline) {
        sessions.forEach((s, i) => {
          if (status[i] !== null) return;
          const step = s.tick();
          if (step.done) status[i] = step.status;
        });
        await new Promise((r) => setTimeout(r, 1));
      }
      const files = (k) => Object.fromEntries(k.term.listFiles()
        .filter((p) => p.startsWith('/k/data/'))
        .map((p) => [p, new TextDecoder().decode(k.term.getFile(p))]));
      // Two raw REPLs, open together, each typed a line naming its kernel.
      const repl = (k, name) => {
        const r = { out: '', status: null, decoder: new TextDecoder() };
        r.repl = k.term.repl(80, 24, (bytes) => { r.out += r.decoder.decode(bytes, { stream: true }); }, (s) => { r.status = s; });
        r.name = name;
        return r;
      };
      const until = async (pred) => {
        const end = Date.now() + 10000;
        while (!pred() && Date.now() < end) await new Promise((r) => setTimeout(r, 10));
        return pred();
      };
      let replError = null;
      const repls = [];
      try {
        repls.push(repl(a, 'a'), repl(b, 'b'));
        await until(() => repls.every((r) => /dv> $/.test(r.out)));
        for (const r of repls) r.repl.input(new TextEncoder().encode(`print('repl ' .. '${r.name}')\r`));
        await until(() => repls.every((r) => r.out.includes(`repl ${r.name}\r\n`)));
        for (const r of repls) r.repl.input(new TextEncoder().encode('\x04'));
        await until(() => repls.every((r) => r.status !== null));
      } catch (e) {
        replError = String(e);
      }
      const out = {
        status,
        outA: a.out, outB: b.out,
        filesA: files(a), filesB: files(b),
        replA: repls[0]?.out ?? '', replB: repls[1]?.out ?? '',
        replStatus: repls.map((r) => r.status),
        replError,
      };
      sessions.forEach((s) => s.free());
      a.term.free();
      b.term.free();
      return out;
    },
    // it: root a program, step until it settles, and read the roster and
    // its capability answers back. What this proves is that the exports
    // are a swarm and not a shape -- the instance runs, is asked what it
    // holds, and is killed.
    swarmRoundTrip(source) {
      const sw = new DrtSwarm(0, 0);
      const out = {};
      try {
        const root = sw.root(new TextEncoder().encode(source));
        out.root = root;
        out.parent = sw.parent(root) ?? null;
        out.holdsTime = sw.holds(root, 'host:time');
        out.holdsLifecycle = sw.holds(root, 'lifecycle');
        out.parentOfNobody = sw.parent(9999) ?? null;
        out.caps = sw.caps(root);
        out.resident = sw.resident(root);
        out.slots = sw.slotsAllocated();
        let steps = 0;
        while (sw.step() > 0 && steps < 100) steps += 1;
        out.steps = steps;
        out.aliveAfter = sw.alive();
        out.idsAfter = sw.ids();
      } finally {
        sw.free();
      }
      return out;
    },
    // The transport (doc/SshInBrowser.md): a byte stream whose socket
    // stays in the page. This is the page's whole side of it -- deliver
    // what arrives, pump what Rust wants written, close when the wire
    // does -- and the loop below is the one from `ws.rs`'s header with a
    // WebSocket swapped for the caller's strings. `startEcho` stands in
    // for the SSH session: what is under test is the stream, not what
    // reads it.
    async socketEcho(messages) {
      const socket = new DrtSocket();
      socket.startEcho();
      const back = [];
      const pump = (async () => {
        for (;;) {
          const out = await socket.nextOutgoing();
          if (out === undefined) break;
          back.push(out);
        }
      })();

      const encoder = new TextEncoder();
      const want = messages.join('').length;
      const size = () => back.reduce((n, b) => n + b.length, 0);
      const sent = messages.every((m) => socket.deliver(encoder.encode(m)));
      const deadline = Date.now() + 5000;
      while (size() < want && Date.now() < deadline) {
        await new Promise((r) => setTimeout(r, 0));
      }

      // Closing must end both halves: Rust reads end of input, the task
      // above it stops and drops the stream, and that is what the page's
      // pump loop sees.
      socket.close();
      const afterClose = socket.deliver(encoder.encode('too late'));
      const ended = await Promise.race([
        pump.then(() => true),
        new Promise((r) => setTimeout(() => r(false), 5000)),
      ]);
      socket.free();

      const joined = new Uint8Array(size());
      let at = 0;
      for (const chunk of back) {
        joined.set(chunk, at);
        at += chunk.length;
      }
      return { sent, afterClose, ended, chunks: back.length, echoed: new TextDecoder().decode(joined) };
    },
    // SSH into the page (doc/SshInBrowser.md). The suite drives this
    // with a real `ssh` client: run.mjs listens on a TCP port, shuttles
    // bytes between that socket and the one below, and points `ssh` at
    // it. So what is under test is the product's claim -- a standard
    // client gets a terminal into a page -- rather than two things we
    // wrote agreeing with each other.
    //
    // The shell behind the session is the page's own: `terminalFor` makes
    // the SSH channel into the object `attach` takes, and everything
    // after that is M8's editor and shell.js, unchanged.
    sshHostKey: () => DrtSshServer.generateHostKey(),
    sshServe(id, hostKey, authorizedKeys) {
      const server = new DrtSshServer(hostKey, authorizedKeys);
      const socket = server.serve((shell) => {
        const terminal = terminalFor(shell);
        const bound = attach(DrtTerm, terminal, { DrtEditor, banner: 'drt in a page' });
        bound.term.putFile('/hello.dlua', new TextEncoder().encode(
          'print("hello over ssh")\n'));
        bound.term.setCwd('/');
        sshShells.set(id, { terminal, bound });
      });
      sshSockets.set(id, socket);
      (async () => {
        for (;;) {
          const out = await socket.nextOutgoing();
          if (out === undefined) break;
          await window.sshOutgoing(id, b64(out));
        }
        await window.sshClosed(id);
      })();
      return { fingerprint: server.fingerprint, authorized: server.authorized };
    },
    // The whole chain (doc/SshInBrowser.md): the page parks a leg on a
    // real `drt relay`, and `ssh -o ProxyCommand="drt tunnel ..."` claims
    // it. Nothing is bridged by the suite here -- the bytes go over the
    // relay the way they will in production, and the only thing this adds
    // is the label and the keys.
    sshPark(url, hostKey, authorizedKeys) {
      const server = new DrtSshServer(hostKey, authorizedKeys);
      const events = [];
      const leg = park(
        url,
        () =>
          server.serve((shell) => {
            const terminal = terminalFor(shell);
            const bound = attach(DrtTerm, terminal, { DrtEditor, banner: 'drt over a relay' });
            bound.term.putFile('/hello.dlua', new TextEncoder().encode(
              'print("hello through a tunnel")\n'));
            bound.term.setCwd('/');
          }),
        { onEvent: (name) => events.push(name) },
      );
      sshParked.set(1, { leg, events });
      return true;
    },
    // Row 8 of doc/ssh-transport-matrix.md: this page answers a session
    // from another browser (doc/BrowserAccess.md §10.4) and serves `ssh`
    // on it. The suite carries the two records; that is all signaling is.
    async sshAnswer(hostKey, authorizedKeys, callerRecord) {
      const { answer } = await import('/drt_browser_access.js');
      const server = new DrtSshServer(hostKey, authorizedKeys);
      const ssh = (stream) =>
        splice(stream, server.serve((shell) => {
          const terminal = terminalFor(shell);
          const bound = attach(DrtTerm, terminal, { DrtEditor, banner: 'drt in a page, over WebRTC' });
          bound.term.putFile('/hello.dlua', new TextEncoder().encode('print("hello over webrtc")\n'));
          bound.term.setCwd('/');
        }));
      const answering = await answer(callerRecord, { services: { ssh }, label: 'drt in a page' });
      sshAnswered.push(answering);
      return { record: answering.recordText, fingerprint: server.fingerprint };
    },
    // Row 6: the same, for callers that arrive through a signalling server
    // (doc/DRT-Signalling.md; examples/30-signaling-room) rather than
    // through the suite. The client library's `listen` holds the call
    // notification stream, polls, and answers each call;
    // `drt tunnel rtc:<server>/v1/<name>/calls` is the caller.
    async sshListen(hostKey, authorizedKeys, base, token) {
      const { listen } = await import('/drt_browser_access.js');
      const server = new DrtSshServer(hostKey, authorizedKeys);
      const ssh = (stream) =>
        splice(stream, server.serve((shell) => {
          const terminal = terminalFor(shell);
          const bound = attach(DrtTerm, terminal, { DrtEditor, banner: 'drt in a page, called natively' });
          bound.term.putFile('/hello.dlua', new TextEncoder().encode('print("hello from a page, over webrtc")\n'));
          bound.term.setCwd('/');
        }));
      const listening = listen(base, { token, services: { ssh }, label: 'drt in a page' });
      // Present (§4.2) before the suite starts a caller.
      await new Promise((resolve) => {
        const start = Date.now();
        const check = () => (listening.streaming || Date.now() - start > 5000 ? resolve() : setTimeout(check, 20));
        check();
      });
      sshListening.push(listening);
      return { fingerprint: server.fingerprint };
    },
    sshStopListening() {
      for (const l of sshListening) l.close();
    },
    sshParkEvents: () => (sshParked.get(1) ? sshParked.get(1).events : []),
    sshUnpark() {
      const held = sshParked.get(1);
      if (held) held.leg.close();
      sshParked.delete(1);
    },
    sshDeliver(id, data) {
      const socket = sshSockets.get(id);
      return socket ? socket.deliver(decode(data)) : false;
    },
    sshClose(id) {
      const held = sshShells.get(id);
      if (held) held.bound.dispose();
      const socket = sshSockets.get(id);
      if (socket) socket.close();
      sshShells.delete(id);
      sshSockets.delete(id);
    },
    // A filesystem the page hands in (`{ fs }`): a and b get one object,
    // c its own, over `backing` -- 'object', a page object answering the
    // seven calls (memoryFs below), or 'aloelite', cdn/fs.mjs over
    // aloelite volumes in memory (ALOELITE_PKG in run.mjs). Every kernel
    // writes, then every kernel reads, then a sql.js database a makes is
    // read by b. Answers what each said and what each lists.
    async pageFs(backing) {
      let make = memoryFs;
      if (backing === 'aloelite') {
        const { default: initAloelite, Fs } = await import('./aloelite/aloelite_wasm.js');
        await initAloelite();
        make = (volume) => pageFs.attach(Fs.openMemory(), { volume });
      }
      const shared = make('shared');
      const own = make('own');
      const kernel = (name, fs) => {
        const k = { name, out: '', decoder: new TextDecoder() };
        k.term = new DrtTerm((f, bytes) => { k.out += k.decoder.decode(bytes, { stream: true }); }, { fs, sql: SQL });
        const put = (path, text) => k.term.putFile(path, new TextEncoder().encode(text));
        k.term.putDir('/k/data');
        // Named by kernel: a and b put their programs into one filesystem.
        put(`/k/write_${name}.dlua`, `host.fs.write('${name}.txt', '${name}')\n`);
        put(`/k/read_${name}.dlua`,
          "local function peek(n) return tostring((host.fs.try_read(n .. '.txt'))) end\n" +
          `print('${name}: a=' .. peek('a') .. ' b=' .. peek('b') .. ' c=' .. peek('c'))\n`);
        put('/k/sql_write.dlua',
          "local db = host.sql.open('notes.db')\n" +
          "db.exec('create table t (x text)')\n" +
          "db.exec(\"insert into t values ('shared through the volume')\")\n");
        put('/k/sql_read.dlua',
          "local db = host.sql.open('notes.db')\n" +
          "for _, r in ipairs(db.query('select x from t').rows) do print('row: ' .. r[1]) end\n");
        put('/k/deploy.json', JSON.stringify({
          caps: [{ capability: 'host:fs/*' }, { capability: 'host:sql/*' }],
          connectors: {
            fs: { scope: { scope: './data', access: 'readwrite' } },
            sql: { scope: { scope: './data', access: 'readwrite' } },
          },
        }));
        k.term.setCwd('/k');
        return k;
      };
      const a = kernel('a', shared);
      const b = kernel('b', shared);
      const c = kernel('c', own);
      const run = async (k, program) => {
        const s = k.term.exec(['drt', 'run', '--config', 'deploy.json', program]);
        const deadline = Date.now() + 10000;
        try {
          while (Date.now() < deadline) {
            const step = s.tick();
            if (step.done) return step.status;
            await new Promise((r) => setTimeout(r, 1));
          }
          return null;
        } finally {
          s.free();
        }
      };
      const status = [];
      for (const k of [a, b, c]) status.push(await run(k, `write_${k.name}.dlua`));
      for (const k of [a, b, c]) status.push(await run(k, `read_${k.name}.dlua`));
      const before = b.out.length;
      status.push(await run(a, 'sql_write.dlua'));
      status.push(await run(b, 'sql_read.dlua'));
      let refused = null;
      try { new DrtTerm(() => {}, { fs: { read() {} } }).free(); } catch (e) { refused = String(e); }
      let swarm = null;
      try { new DrtSwarm(0, 0, undefined, { fs: shared }).free(); } catch (e) { swarm = String(e); }
      const out = {
        status,
        out: { a: a.out, b: b.out.slice(0, before), c: c.out, sql: a.out + b.out.slice(before) },
        filesAB: a.term.listFiles(),
        filesB: b.term.listFiles(),
        filesC: c.term.listFiles(),
        cwd: a.term.cwd(),
        refused,
        swarm,
      };
      for (const k of [a, b, c]) k.term.free();
      return out;
    },
    // The OPFS store (cdn/fs.mjs `open`): opfs-worker.js runs drt and
    // aloelite in a Dedicated Worker, the only place OPFS is synchronous,
    // and answers what each of its steps saw.
    opfs() {
      return new Promise((resolve) => {
        const worker = new Worker('./opfs-worker.js', { type: 'module' });
        worker.onmessage = ({ data }) => { worker.terminate(); resolve(data); };
        worker.onerror = (e) => { worker.terminate(); resolve({ threw: e.message }); };
        worker.postMessage('go');
      });
    },
    // Connectors the page hands in (issue #80): a fresh terminal with an
    // in-page bus as its `net` transport and a `store` answered by a
    // JavaScript object -- at once, through a promise, by a throw and by a
    // rejection -- and one command run through it.
    async backings({ files, line }) {
      const decoder = new TextDecoder();
      let out = '';
      const store = {
        call(name, args, node) {
          switch (name) {
            case 'store/echo': return { args, node, bytes: new Uint8Array([104, 105]) };
            case 'store/later': return new Promise((r) => setTimeout(() => r(args.n + 1), 10));
            case 'store/fail': throw new Error('no such key');
            case 'store/reject': return Promise.reject(new Error('refused later'));
            default: throw new Error(`no ${name}`);
          }
        },
      };
      const t = new DrtTerm((fd, bytes) => { out += decoder.decode(bytes, { stream: true }); }, { net: bus(), store });
      try {
        for (const [p, text] of Object.entries(files)) t.putFile(p, new TextEncoder().encode(text));
        t.setCwd('/app');
        const sh = makeShell({ term: t, write: (fd, text) => { out += text; } });
        const status = await sh.run(line);
        let refused = null;
        try { new DrtTerm(() => {}, { net: { open() {} } }).free(); } catch (e) { refused = String(e); }
        return { status, out, refused };
      } finally {
        t.free();
      }
    },
    // `backings`: a module URL whose exports are the families this
    // example's page hands in (meta.json "backings").
    async seed({ cwd, files, dirs = [], backings = null }) {
      fresh(backings ? { ...(await import(backings)) } : undefined);
      for (const d of dirs) term.putDir(d);
      for (const { path, data } of files) term.putFile(path, decode(data));
      term.setCwd(cwd);
    },
    async run(line) {
      if (!term) fresh();
      chunks = [];
      const status = await shell.run(line);
      return { status, output: chunks.join('') };
    },
    // The REPL, typed at a real terminal and read back from what it
    // renders. Raw writes would do for a printable-and-backspace loop and
    // will not for an editor: the bytes now carry cursor moves and
    // redraws, and the question the check asks -- does the page's repl say
    // what the native one says -- is about the screen, not the stream.
    // `terminal.input` is xterm.js's own "as if typed", so `attach`'s
    // `onData` path is the one under test.
    async replTranscript(lines) {
      const terminal = new Terminal({ cols: 80, rows: 40, convertEol: false });
      terminal.open(document.getElementById('offscreen'));
      const bound = attach(DrtTerm, terminal, { DrtEditor });
      const type = async (text) => {
        await bound.whenIdle();
        terminal.input(text, true);
      };
      await type('drt repl\r');
      for (const line of lines) await type(line + '\r');
      await type('\x04');
      await bound.whenIdle();
      // One turn for the last write to reach the buffer: xterm.js parses
      // what it is given asynchronously.
      await new Promise((r) => setTimeout(r, 50));
      const buf = terminal.buffer.active;
      const rendered = [];
      for (let i = 0; i < buf.length; i++) {
        rendered.push(buf.getLine(i).translateToString(true));
      }
      bound.dispose();
      bound.term.free();
      terminal.dispose();
      term = null;
      return rendered.join('\n').replace(/\n+$/, '') + '\n';
    },
    // `drt ssh` and `:ssh` at a real terminal: ssh.html's client
    // (drt-ssh-web, a classic script defining `wasm_bindgen`) handed to
    // `attach`, the page's key in its store. One terminal per call; the
    // suite types with `sshType` and reads with `sshScreen`.
    async sshTerminal(privateOpenssh) {
      // A top-level `let` in a classic script: a global binding, and not a
      // property of `window`, so it is named, not looked up.
      if (typeof wasm_bindgen === 'undefined') {
        await new Promise((ok, fail) => {
          const tag = document.createElement('script');
          tag.src = '/drt_ssh_web.js';
          tag.onload = ok;
          tag.onerror = () => fail(new Error('/drt_ssh_web.js did not load'));
          document.head.append(tag);
        });
        // eslint-disable-next-line no-undef
        await wasm_bindgen({ module_or_path: '/drt_ssh_web_bg.wasm' });
      }
      const access = await import('/drt_browser_access.js');
      const store = new Map([['key', { privateOpenssh }]]);
      const terminal = new Terminal({ cols: 100, rows: 30, convertEol: false, scrollback: 2000 });
      terminal.open(document.getElementById('offscreen'));
      const bound = attach(DrtTerm, terminal, {
        DrtEditor,
        ssh: {
          // eslint-disable-next-line no-undef
          Ssh: wasm_bindgen.Ssh,
          access,
          store: { get: async (k) => store.get(k), set: async (k, v) => void store.set(k, v) },
        },
      });
      bound.term.setCwd('/');
      sshTerminals.push({ terminal, bound });
      return sshTerminals.length - 1;
    },
    sshType(i, text) {
      sshTerminals[i].terminal.input(text, true);
    },
    sshResize(i, cols, rows) {
      sshTerminals[i].terminal.resize(cols, rows);
    },
    sshScreen(i) {
      const buf = sshTerminals[i].terminal.buffer.active;
      const lines = [];
      for (let n = 0; n < buf.length; n++) lines.push(buf.getLine(n).translateToString(true));
      return lines.join('\n');
    },
    sshIdle: (i) => sshTerminals[i].bound.whenIdle(),
    sshDispose(i) {
      const t = sshTerminals[i];
      if (!t) return;
      t.bound.dispose();
      t.terminal.dispose();
      sshTerminals[i] = null;
    },
  };
  const sshTerminals = [];
  window.drtBrowserTest = harness;

  // depth: the person's terminal, a <pre> with a keyboard.
  const screen = document.getElementById('screen');
  const about = document.getElementById('about');
  try {
    await harness.ready;
    about.textContent = buildInfo(false).trimEnd() + `\nabi: ${abiVersion()}\n\n` +
      'a terminal: type `drt run hello.dlua`, `drt repl`, `drt --help`. click to focus.';
    const terminal = new Terminal({
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      fontSize: 13,
      cursorBlink: true,
      theme: { background: '#101418', foreground: '#d8dee4' },
    });
    if (!location.search.includes('nodemo')) terminal.open(screen);
    const bound = attach(DrtTerm, terminal, { DrtEditor });
    bound.term.putFile('/hello.dlua', new TextEncoder().encode(
      'print("hello from a page")\nprint("the time is", host.time())\n'));
    bound.term.setCwd('/');
    term = null;
  } catch (e) {
    about.textContent = `drt_web did not load: ${(e && e.stack) || e}`;
    throw e;
  }
</script>
