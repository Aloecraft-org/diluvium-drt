[package]
name = "drt-web"
description = "The browser tier: the same drt, with the C core linked in, behind a terminal contract for xterm.js"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is the browser artifact; rlib keeps it testable natively, which is
# how the terminal contract gets real coverage without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The runtime itself -- the CLI, the drivers, and the `web` profile: the
# connectors that cross a page (doc/Wasm.md D3). Declared by path with
# `default-features = false` rather than `workspace = true`, because a
# workspace dependency's default features cannot be turned off from here,
# and the default `slim` carries `listen`, which is threads and sockets a
# page does not have.
drt = { path = "../drt", version = "0.5.0", default-features = false, features = ["web"] }
drt-platform = { workspace = true }
drt-config = { workspace = true }
drt-connector = { workspace = true }
# With its default feature: the engine. Building this crate for a wasm
# target therefore needs a wasi-sdk named by WASI_SDK_PATH, for the C core
# and (in build.rs) for wasi-libc.
drt-swarm = { workspace = true }
drt-caps = { workspace = true }
# The byte stream in a page (src/ws.rs) is `AsyncRead + AsyncWrite`, which
# are tokio's traits, and its two halves are tokio channels. No runtime:
# `sync` and `io-util` are the traits and the channels, and the executor in
# a page is `wasm_bindgen_futures`.
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }
# The SSH server in the page (doc/SshInBrowser.md). `ring` rather than the
# default `aws-lc-rs`, which is C and assembly with no wasm path; no
# `flate2` and no `rsa`, because neither is worth its bytes for a server
# whose clients are modern and whose posture is pubkey-only. The workspace
# patches this to the fork carrying the server's wasm build.
#
# Not target-gated, so `src/ssh.rs` compiles natively and the rule the
# posture rests on -- only a named key gets in -- is tested by the
# workspace gate rather than only in a browser.
russh = { version = "0.63", default-features = false, features = ["ring"] }
# What russh generates keys with, so the RNG here is the one the crate's
# own key generation takes. On the browser target it seeds from
# `crypto.getRandomValues` through getrandom's `wasm_js` backend, which
# `.cargo/config.toml` selects.
rand = { version = "0.10", features = ["thread_rng"] }
clap = { workspace = true }
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# PINNED, and it must stay pinned: the wasm-bindgen ABI is unstable across
# patch releases and has to match the wasm-bindgen-cli that generates the
# glue. Nothing hard-codes the number twice -- `script/drt-web.sh` and the
# `browser` job in ci.yml both read it off this line -- so moving the pin
# is this edit and no other.
#
# 0.2.127 because the ego crates pin it and a workspace holds one version;
# they moved here from 0.2.114 (each tagged `pre-wasm-bindgen-0.2.127` at
# the commit before), and this followed. What the old pin cost was a
# workaround: 0.2.114 refused a module carrying the C core's `try_table`
# unless it also exported `__instance_terminated`, so `bindings.rs`
# defined it (doc/Wasm.md §2.3). 0.2.127 defines it itself, and that
# definition is gone.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# The one editor, in the page (doc/Wasm.md D8, M8). `XtermTerminal` takes
# the terminal object this crate is already handed, so nothing imports
# xterm.js and the page keeps its own theme, addons and font.
ego_cli = { workspace = true }
# Not used here: named to turn on one feature of russh's crypto backend.
# `ring` on this target refuses to guess where entropy comes from, and
# this is its own opt-in for "the page's `crypto.getRandomValues`" --
# `getrandom/js`, reached through ring's switch rather than around it. The
# same question `.cargo/config.toml` answers for getrandom 0.3, which is
# the one drt-platform uses; ring is on 0.2 and asks separately.
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util", "time"] }
