[package]
name = "drt-web"
description = "The browser tier: DRT's swarm over a JS-hosted diluvium instance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is the browser artifact; rlib keeps it testable natively, which is
# how the bridge gets real coverage without a browser (see `bridge`).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Deliberately WITHOUT default features: the traits, no C core. The browser
# engine bridges to a JS-hosted diluvium instance rather than linking one,
# so no wasi-sdk is involved (doc/Browser.md).
# Declared by path rather than `workspace = true`: `default-features =
# false` is SILENTLY IGNORED when inheriting a workspace dependency that
# does not itself disable them, and the failure is remote — the C core gets
# pulled in and the wasm build dies in diluvium-sys's build script asking
# for a wasi-sdk this crate never needed.
drt-swarm = { path = "../drt-swarm", version = "0.4.0", default-features = false }
drt-caps = { workspace = true }
drt-config = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# PINNED, and it must stay pinned. The wasm-bindgen ABI is unstable across
# patch releases and has to match the `wasm-bindgen-cli` that generates the
# glue -- and ego-transport pins this exact version for the same reason, so
# a browser build carrying both agrees only if these agree.
wasm-bindgen = "=0.2.114"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
