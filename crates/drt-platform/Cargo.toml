[package]
name = "drt-platform"
description = "The leaf adapters: clock, entropy, the fs backend and stdio, cfg-gated per target so nothing above them is"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Entropy, every target. wasip2 and native need nothing said; the browser
# needs the `wasm_js` feature BELOW and the matching
# `--cfg getrandom_backend="wasm_js"`, which the workspace's
# .cargo/config.toml carries -- getrandom 0.3 refuses to guess a backend
# for wasm32-unknown-unknown, and a build without the cfg fails to compile
# with a sentence naming it (doc/Wasm.md §2.1).
getrandom = "0.3"

# A kill aimed at a process GROUP, which std does not spell: the unix half
# of `process::Tree`, so a deadline sweeps everything a child started and
# not just the child.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows half of the same idea, and strictly stronger: a Job Object
# with kill-on-close, which a child cannot leave. `Win32_Security` is not
# optional decoration -- `CreateJobObjectW` takes a `SECURITY_ATTRIBUTES`
# pointer and is gated behind that feature. Verified to cross-build for
# `x86_64-pc-windows-gnu` with mingw-w64 alone, which every Windows
# artifact this repo ships is built by.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# `Instant` and `SystemTime` over `performance.now()` and `Date.now()`.
# std's versions compile on this target and panic when called.
web-time = "1.1"

# An aloelite volume as an fs backend (src/aloelite.rs). The engine only:
# aloelite-core takes a Connection this crate opens, a clock and an entropy
# source, so neither ego-platform nor aloelite's wasm-bindgen pin comes
# along. Pinned to a commit of aloelite's main (0.5.0); rusqlite matches
# the sql connector's, since a build holds one SQLite.
[dependencies.aloelite-core]
git = "https://github.com/Aloecraft-org/aloelite"
rev = "b4ea3be35b9456fc24352db1b0f4b6f39cfd73bc"
optional = true

[dependencies.rusqlite]
version = "0.40"
features = ["bundled"]
optional = true

[dependencies.rand_core]
version = "0.10"
optional = true

[features]
aloelite = ["dep:aloelite-core", "dep:rusqlite", "dep:rand_core"]

[dev-dependencies]
tempfile = "3"
rusqlite = "0.40"
