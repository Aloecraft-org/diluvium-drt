[package]
name = "drt"
description = "The Diluvium RunTime: run | serve | repl | ps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "drt"
path = "src/lib.rs"

[[bin]]
name = "drt"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# The listener's HTTP/1.1 parser: the same job picohttpparser does for the
# C host, and the same posture — parse strictly, refuse the rest.
httparse = { version = "1", optional = true }
# msgpack values on the host side: the listener's request/response bridge
# and `.host.lua` config evaluation both speak them, and config loading is
# not optional, so neither is this.
rmpv = { workspace = true }
# The tunnel: SSH over WSS as a dumb pipe (see src/tunnel.rs). tokio and
# ego-transport ride the `tunnel` feature, which `full` carries.
ego_transport = { workspace = true, optional = true }
# The relay's WebSocket stack. Host-side machinery takes the right Rust
# primitive: tokio-tungstenite splits for a full-duplex splice, delivers
# whole messages (ego-transport's recv truncates past the caller's buffer),
# and exposes the handshake request the relay routes on. Pinned to the
# version already in the tree behind ego-transport, so one stack is built.
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "io-std", "io-util", "net", "sync", "time", "macros"], optional = true }
serde_json = "1"
# The reflect fetch's TLS. Pinned to what `connectors/rest` already builds,
# so `full` links one stack rather than two and `netcheck` costs it nothing.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
drt-config = { workspace = true }
# The program and config loader read through the platform filesystem, so
# a page can seed what `drt run app.dlua` opens (doc/Wasm.md D5).
drt-platform = { workspace = true }
drt-caps = { workspace = true }
drt-hostcall = { workspace = true }
drt-connector = { workspace = true }
drt-swarm = { workspace = true }
drt-connector-time = { workspace = true, optional = true }
drt-connector-ssh = { workspace = true, optional = true }
drt-connector-fs = { workspace = true, optional = true }
drt-connector-sql = { workspace = true, optional = true }
drt-connector-crypto = { workspace = true, optional = true }
drt-connector-rest = { workspace = true, optional = true }
drt-connector-ssmtp = { workspace = true, optional = true }
drt-connector-exec = { workspace = true, optional = true }
# The line editor behind `drt repl` on a tty (doc/Wasm.md D8). Optional
# and not in `slim`: its native backend wants crossterm's event-stream and
# `ego_platform` wants tokio `full`, and `slim` has deliberately carried
# neither -- so `cli` rides `full`, which has tokio already, until
# ego-cli#3 lands a backend that needs no runtime.
ego_cli = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# The driver test's connector that answers on its second poll.
async-trait = { workspace = true }
# The tunnel test drives a real SSH session through both bridge halves.
ego_transport = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
drt-connector-fs = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false }

[features]
# One codebase, feature profiles (SPEC.md §3): `slim` runs a script with
# fs/time/stdio only; `full` is everything this build can carry. Each
# connector is its own gate so a profile is a feature list, not a fork.
default = ["slim"]
slim = ["connector-time", "connector-fs", "connector-crypto", "listen"]
full = ["slim", "connector-ssh", "connector-sql", "connector-rest", "connector-ssmtp", "connector-exec", "tunnel", "relay", "stun", "netcheck", "cli"]
# The portable build (doc/Wasm.md D2): what `drt` carries on
# wasm32-wasip2, under wasmtime. Every connector here compiles for that
# target with no source change and is exercised by the examples gate
# through `script/drt-wasip2.sh`. `listen` is served there by the polled
# acceptor (doc/Wasm.md M6): wasip2 has sockets and no threads, and the
# wrapper grants the sockets. The tokio-backed verbs and connectors --
# `tunnel`, `relay`, `stun`, `netcheck`, `ssh`, `rest`, `ssmtp` -- cannot
# cross at all (tokio refuses its `net` feature on wasm), so `full` is not
# a wasm build and this is.
wasi = ["connector-time", "connector-fs", "connector-crypto", "connector-sql", "listen"]
# The browser build (doc/Wasm.md D3): what `drt-web` links into a page.
# `wasi` without `sql`, and without `listen`, because a page has neither
# threads nor sockets to serve on; the fs connector reaches the page's
# memory filesystem through `drt-platform`. Named here so `buildinfo`
# reports `web` from inside the page and the examples gate can skip by
# profile there as it does everywhere else.
web = ["connector-time", "connector-fs", "connector-crypto"]
# Line editing for `drt repl` on a tty: history, word motions, undo, and
# Tab over names the running instance answers with (doc/Wasm.md D8, M8,
# §5). One editor for every target rather than one per host, which is
# what the three hand-written ones in this project were before it.
#
# In `full` and not in `slim`, for now: `ego_cli`'s native backend is
# built on crossterm's `EventStream`, and `ego_platform` under it takes
# tokio with `full`. `full` carries tokio already (the relay, STUN);
# `slim` never has. ego-cli#3 asks upstream for a backend over blocking
# `crossterm::event::poll`, which needs no runtime and suits this
# tick-shaped driver better; when it lands, this moves to `slim` and the
# piped path below is the only one left without an editor.
#
# A pipe is never edited either way -- `drt repl < script.dlua` keeps the
# plain reader, whose prompts go to stderr so that redirect stays clean.
cli = ["dep:ego_cli", "dep:tokio"]
connector-time = ["dep:drt-connector-time"]
connector-ssh = ["dep:drt-connector-ssh"]
connector-fs = ["dep:drt-connector-fs"]
connector-sql = ["dep:drt-connector-sql"]
connector-crypto = ["dep:drt-connector-crypto"]
# Outbound HTTP for guests: `host:rest/get` / `host:rest/post`, the same two
# calls diluvium's rest plugin answers. `full` only -- it links a TLS stack,
# and a notebook profile that cannot reach the network is a smaller
# artifact and a smaller thing to trust.
connector-rest = ["dep:drt-connector-rest"]
# Outbound mail: `host:ssmtp/send`. `full` only, on rest's argument and for
# rest's reason -- it links the same TLS stack. The scope holds the relay
# credential and the envelope sender, so a program sends mail without ever
# holding the password and cannot forge its From line; that is the whole
# reason this is a connector and not something a guest reaches via `rest`.
connector-ssmtp = ["dep:drt-connector-ssmtp"]
# Local exec: `host:exec/run`, the honest escape hatch, the contract
# `dhost_exec.c` fixes. `full` only, and not for a dependency -- it links
# nothing -- but because SPEC.md §3's slim profile is "run a script,
# fs/time/stdio only", and a binary that cannot shell out is a smaller
# thing to trust. Off until a config names `connectors.exec`, and announced
# on stderr when one does: granting it is leaving the sandbox
# (GUARANTEES.md), and that is the loud flag the guarantee promises.
connector-exec = ["dep:drt-connector-exec"]
# The http listener (dhost_http.c's contract). In slim because the C host
# always carries its listener, and a runtime that cannot serve a fetchpoint
# is not the runtime discofetch is waiting for.
listen = ["dep:httparse"]
# `drt tunnel`: the stdio<->WSS bridge (ProxyCommand shape) and the
# WS->TCP listener half. In `full` beside `ssh` — the NAT-traversal story
# is a server-and-CLI concern, not a notebook's.
tunnel = ["dep:ego_transport", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# `drt relay`: the rendezvous relay — parked WSS legs paired by label and
# spliced. In `full` beside tunnel; a relay is server machinery.
# Depends on `listen` because the relay's control plane rides the same
# queue bridge, and `drt start` only runs that loop when listeners exist.
# Without this a relay+no-listen build would start and silently not serve.
relay = ["listen", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# `drt stun`: the STUN binding server. The protocol is ego-transport's
# (`ego_transport::stun`); this is the wiring. UDP and stateless, so
# unlike the relay it needs no listener and no WebSocket stack — just a
# runtime to own the socket.
stun = ["dep:tokio", "dep:ego_transport"]
# `drt netcheck`, the verb. Its own feature rather than riding `stun`,
# because asking a reflect edge means an HTTP client and a TLS stack and the
# STUN *server* has no business carrying either -- the server is the thing a
# small deployment runs. `full` only, on `rest`'s argument.
#
# It implies `stun`: the decisive measurement is the UDP mapping, so a
# netcheck that could not take it would be a verdict built on the
# informational half. The crates below are already in `full` behind `rest`,
# so this adds none.
#
# Priced and accepted: a `--features stun` build has the STUN server and no
# longer has the verb.
netcheck = ["stun", "dep:tokio-rustls", "dep:webpki-roots"]
