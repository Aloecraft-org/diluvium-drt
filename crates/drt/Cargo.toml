[package]
name = "drt"
description = "The Diluvium RunTime: run | serve | repl | ps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "drt"
path = "src/lib.rs"

[[bin]]
name = "drt"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
pollster = "0.4"
# The listener's HTTP/1.1 parser: the same job picohttpparser does for the
# C host, and the same posture — parse strictly, refuse the rest.
httparse = { version = "1", optional = true }
rmpv = { workspace = true, optional = true }
serde_json = "1"
drt-config = { workspace = true }
drt-caps = { workspace = true }
drt-hostcall = { workspace = true }
drt-connector = { workspace = true }
drt-swarm = { workspace = true }
drt-connector-time = { workspace = true, optional = true }
drt-connector-ssh = { workspace = true, optional = true }
drt-connector-fs = { workspace = true, optional = true }
drt-connector-sql = { workspace = true, optional = true }
drt-connector-crypto = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# One codebase, feature profiles (SPEC.md §3): `slim` runs a script with
# fs/time/stdio only; `full` is everything this build can carry. Each
# connector is its own gate so a profile is a feature list, not a fork.
default = ["slim"]
slim = ["connector-time", "connector-fs", "connector-crypto", "listen"]
full = ["slim", "connector-ssh", "connector-sql"]
connector-time = ["dep:drt-connector-time"]
connector-ssh = ["dep:drt-connector-ssh"]
connector-fs = ["dep:drt-connector-fs"]
connector-sql = ["dep:drt-connector-sql"]
connector-crypto = ["dep:drt-connector-crypto"]
# The http listener (dhost_http.c's contract). In slim because the C host
# always carries its listener, and a runtime that cannot serve a fetchpoint
# is not the runtime discofetch is waiting for.
listen = ["dep:httparse", "dep:rmpv"]
