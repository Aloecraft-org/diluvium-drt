# DRT changelog -- the source of truth for release notes.
#
# This file, not the GitHub release body, is what a release page and the
# release mirror are generated from. Edit it here; everything downstream is
# derived. `script/changelog.py generate` writes CHANGELOG.md and
# changelog.json, and CI fails if they drift.
#
# Ported from diluvium's CHANGELOG.yaml on purpose -- same shape, same tool,
# same CLI -- so the two repositories' release machinery reads the same and a
# fix to one carries to the other. What differs is only which compatibility
# facts each records.
#
# Shape follows keepachangelog.com 1.1.0, with the six standard sections kept
# under their own names so the mapping to Markdown is mechanical. Bullets are
# ordinary strings; any may be a `|` block when the detail earns it, in which
# case the first line is the headline.
#
#   version       DRT version, without the leading `v`.
#   tag           Git tag. Explicit rather than derived, even though DRT --
#                 unlike diluvium, which also carries upstream Lua's tags --
#                 could derive it safely. A derived tag is one fewer place
#                 this file can be caught lying.
#   date          ISO date published; null when unreleased.
#   status        released | unreleased | tagged
#                 `tagged` means the tag exists but no GitHub release was
#                 published for it.
#   stable        A real release rather than a candidate. This field is the
#                 truth; GitHub's `prerelease` flag is derived from it.
#   latest        Optional. Exactly one entry carries `latest: true`; that is
#                 what a `latest/` path resolves to.
#   mirror        Whether the release mirror should carry it.
#
# The compatibility facts, which are DRT's version of diluvium's `lua_base`
# and `bytecode_format`. doc/Release.md's rule is that the compatibility fact
# travels with the bytes, so these are the same facts BUILDINFO.txt carries:
#
#   dv_abi        The dv ABI this build speaks. What a package's
#                 `requires.dv_abi` is checked against.
#   diluvium      The embedded diluvium git revision. DRT versions
#                 INDEPENDENTLY of diluvium and records the coupling rather
#                 than encoding it -- "which diluvium is inside" is read off
#                 the artifact, never inferred from a tag-naming convention.
#   diluvium_build  The N in 5.5.1_buildN, beside the revision. The revision
#                 is exact but unordered -- two of them cannot be asked which
#                 is newer -- and a `requires.diluvium_build` range needs a
#                 number. Both, because neither alone is the whole fact.
#   connectors    profile -> the connectors that profile carries. This is the
#                 field that keeps a version number honest: a release whose
#                 connector set changed is not a patch release whatever the
#                 digits say, because `requires.connectors` is checked
#                 against it by name. v0.4.0 is numbered the way it is
#                 because of this line.
#   features      profile -> the features the embedded core carries (`regex`,
#                 later `numeric`). The same argument one level down:
#                 `dv_abi` says which ABI the core speaks, this says what is
#                 reachable through it, and a package needing `numeric` is
#                 admitted or refused by name against this list.
#
#   summary       Prose block heading the release.
#   upgrading     Optional. Anything a user must do to move to it.
#   known_issues  Optional. Problems present in this version, recorded
#                 against the version they affect rather than only against
#                 the one that fixes them.
#   added / changed / deprecated / removed / fixed / security
#                 The keepachangelog sections. Omit what is empty.

schema: 1
repo: Aloecraft-org/diluvium-drt

releases:
  - version: 0.5.0rc9
    tag: v0.5.0rc9
    date: 2026-09-10
    status: released
    stable: false
    mirror: false
    dv_abi: 1
    diluvium: 850e00d73220427be68ae8f909f83b06cb2095bd
    diluvium_build: 13
    connectors:
      full: [time, fs, crypto, sql, ssh, rest, ssmtp, exec, data, listen]
      slim: [time, fs, crypto, listen]
      wasi: [time, fs, crypto, sql, listen]
      web: [time, fs, crypto]
    features:
      full: [regex]
      slim: [regex]
      wasi: [regex]
      web: [regex]
    summary: |
      The candidate after rc8, cut from the same `main` plus issue #27, so
      it carries everything rc8 carries: the no-root mode, and the tunnel
      verb from a file.

      Everything in the punch path was unprivileged all along -- STUN, the
      rendezvous, the punch, the WireGuard protocol -- and `CAP_NET_ADMIN`
      bought exactly one thing: an adapter in the kernel's stack. A tool
      that demonstrably moves bytes *before* it asks for a privilege is a
      different trust proposition from one that asks first, and on macOS
      and Windows "asks first" means most users say no. So the device's
      IP side, which was always a trait, is handed a TCP/IP stack inside
      the process instead of an interface, and "ssh through the hole"
      becomes a port on localhost: no interface, no `sudo`, no
      `wintun.dll`. Two such peers cross a real tunnel on one machine,
      which two kernel interfaces cannot, and the gate runs that example
      without `--privileged`.

      A consumer sitting on rc8 who does nothing keeps working byte for
      byte; the mode is reached only by a config that asks for it, which
      is the gap-release criterion as `doc/Gap-Release.md` §7 now states
      it. The compatibility facts are rc8's: no connector moved, no
      feature moved, the same core inside.
    added:
      - |
        **`mode = "userspace"` on the `wireguard` block**, with `forward`
        and `expose`. A forward is a port on localhost that reaches an
        address inside the tunnel -- `ssh -p 2222 127.0.0.1` with nothing
        configured on the client -- and an expose is an address inside
        the tunnel that reaches a local port, which is the device half
        without which the mode would be half a product: in kernel mode
        the kernel delivers `10.9.0.2:22` to the box's own sshd, but
        nothing listens inside a userspace stack unless the config says
        what does. Same pump, opposite ends; the local address is `bind`,
        as every other block spells it.

        The stack is smoltcp, pure Rust, inside the `wireguard` feature
        and not a sub-feature of it: a mode nobody enables is the mode
        nobody has, and the user who needs it is the one holding the
        release binary. It owns one interface with the block's address
        and a default route, a socket per connection, and one driver
        task. The device does not know -- `drive`, `remap`, `apply`, the
        reports and the relay fallback are generic over exactly the seam
        this uses -- so a rendezvous program cannot tell the modes apart
        from the queue. `mode` is explicit and defaults to `kernel`: a
        config that did not ask is not steered into the other mode by a
        missing privilege.

        Refused at startup, by name: userspace with neither list, or no
        `address`; a forward in kernel mode; two forwards on one port; a
        `to` that is the prefix's network address, or a name (there is no
        resolver inside a tunnel); an `expose.tunnel` off the block's own
        address; a `bind` already held. A forward to an address no peer
        is allowed is a warning naming it and the fifteen seconds it will
        take to time out. `drt wg check` says `userspace`, lists what the
        mode reaches from the config alone, binds nothing, and prints no
        `here:` lines about a node and a capability the mode never
        touches.

        Proven without privilege: two userspace devices in one process, a
        forward on one reaching an expose on the other through a real
        handshake and a real smoltcp connection at each end -- the first
        wireguard test that moves TCP in CI at all -- plus half-close in
        both directions, the re-armed one-shot listener, a refused dial
        closing the local socket at once, an unexposed port answered with
        a RST rather than black-holed, and the dead tunnel timing out at
        its stated value. `examples/24-wireguard-userspace` carries a
        request end to end in the gate. TCP only: ssh needs nothing else,
        and UDP forwards arrive as their own ask.

        What it costs, measured the way `doc/WireGuard.md` §3 measured
        gotatun: `release-small` of `full` grows by 225,312 bytes, +2.8%,
        for four pure-Rust crates (`smoltcp`, `heapless`, `hash32`,
        `managed`). No new C toolchain, so every cross-build that carries
        `wireguard` carries the mode.
      - |
        **`wireguard_forward`**, one per `forward` and `expose` at startup,
        with the address actually bound. `bind = "127.0.0.1:0"` asks for
        an ephemeral port and the report is the only way a program learns
        which; held with the other one-shots for a queue the program has
        not declared yet. A forward whose dial inside the tunnel fails is
        a `wireguard_error` naming the entry, in words that tell "no peer
        is allowed it, or its tunnel is down" from "a peer answered, and
        nothing listens there".
      - |
        **The `tunnel` block: `drt --config device.json tunnel`.** One key
        per flag the verb takes, under the block's names -- the URL is
        `claim`, because that is what the relay already calls the act;
        `--local` is `bind`, as every other block spells the address it
        listens on; `park`, `to`, `listen` and `extra_roots` as they are.
        The `.host.lua` loader maps the same keys. The `?k=` in a park or
        claim URL is a credential, and on a command line it is in `ps`,
        in shell history, and in every "run this" someone pastes; in a
        0600 file it is in none of them, and a device's tunnel becomes
        one file a setup script writes and a unit runs.

        Flags win per key, and the merged set is judged as one: a flag
        naming a different mode than the file is the conflict two flags
        naming two modes would be, refused by name and by source. A key
        from another mode is refused rather than ignored, since in a file
        a silently ignored key is exactly the failure a loader exists to
        catch. Both halves of a real SSH session run from two files and
        no flags in `crates/drt/tests/tunnel.rs`; example 19 runs both
        halves from files, and 11 and 14 show the form.
    changed:
      - |
        **`drt tunnel`'s flag constraints moved off the flags.** clap's
        `requires` and `conflicts_with` judged the command line alone, and
        a `--local` typed beside a `claim` the file supplies would have
        been refused for lacking the URL it had. `tunnel::resolve` judges
        the file and the flags together, so the refusals are one list in
        one vocabulary; the bare `drt tunnel` sentence now names the file
        as well as the three flag shapes.
      - |
        **The kernel-mode route warning is silent in userspace mode.** The
        stack carries a default route, so "add the route yourself" would
        be wrong advice there; what can go unreached in that mode is a
        `forward.to`, and that is what is named instead.

  - version: 0.5.0rc8
    tag: v0.5.0rc8
    date: 2026-09-10
    status: released
    stable: false
    mirror: false
    dv_abi: 1
    diluvium: 850e00d73220427be68ae8f909f83b06cb2095bd
    diluvium_build: 13
    connectors:
      full: [time, fs, crypto, sql, ssh, rest, ssmtp, exec, data, listen]
      slim: [time, fs, crypto, listen]
      wasi: [time, fs, crypto, sql, listen]
      web: [time, fs, crypto]
    features:
      full: [regex]
      slim: [regex]
      wasi: [regex]
      web: [regex]
    summary: |
      **The gap release.** The gate rc7 should have had and the client
      change that makes such a gate testable at all, plus the small,
      no-adoption changes discofetch and vera asked for during the
      architecture sprint -- `doc/Gap-Release.md` is the scoping record,
      including the test that decided what rode and what waited.

      First tagged at `f9e5dfc` while this entry still said `unreleased`,
      and preflight refused it in two seconds -- `still status:
      unreleased`, `has no date` -- publishing nothing, which is the gate
      doing exactly what `doc/Release.md` says it is for. This is that
      tree with the entry saying what it is; the rehearsal (run 39 on
      `f9e5dfc`) was green on every platform, including the musl static
      build, both darwin targets, and the examples gate on a real Windows
      runner.

      **Cut from `main` after the numeric round's first half merged**
      (#23), so this candidate also carries what the `0.6.0` entry beneath
      it describes -- the `data` connector, the numeric config block, the
      blob lane in the hostcall reply, and the `features` fact -- and its
      compatibility facts above say so: `data` is in `full`, and
      `features` and `diluvium_build` are recorded because `buildinfo`
      reports them. The gap release was scoped as rc7 plus small,
      no-adoption changes; as cut, it is that plus #23, and the connector
      set is the field that keeps a version number honest about it.

      rc7 fixed `wss://` and admitted the reason nobody caught it: every
      test and example reaches its relay on loopback over plain `ws://`.
      A fix with no test is the same bug with a shorter fuse, so this is
      the test -- a real SSH session, modern kex and pinned host key and
      pubkey auth, through a TLS terminator standing in for the nginx a
      deployment puts in front of the relay. Every byte through rustls.

      Testing it needed something real rather than a mock: no public CA
      will sign a loopback gate, and the client trusted only Mozilla's
      roots. So `drt tunnel` grows `--extra-root`, which is the same
      thing an operator behind an internal CA has needed all along and
      could not have.

      One unplanned result, better than the test: with `--extra-root` in
      place, a build with the TLS feature removed **no longer compiles**.
      `connect_async_tls_with_config` and `Connector::Rustls` are gated
      behind it, so rc7's bug is now a build error rather than a runtime
      surprise, caught before any test runs.

      Beside that, the same lesson from the other end of the stack. Every
      way of failing to create a WireGuard interface was reported as a
      missing privilege, so a container with no `/dev/net/tun` and a
      process that already held `CAP_NET_ADMIN` were both sent to go and
      get the capability. `drt wg check` said `ok` on both. Four errnos
      now get four answers and an unmeasured one gets none, and `check`
      names what it can establish about the machine it is on without
      creating anything.
    added:
      - |
        **`drt tunnel --extra-root <PEM>`**, repeatable, on both halves of
        the bridge. Certificates named there are trusted **in addition
        to** the public roots and never instead of them -- the rule
        `connectors.rest`'s `extra_roots` already states, kept word for
        word because a client that could narrow its trust to a single
        certificate is a footgun and the case that exists in the field is
        a CA that must be trusted beside the public ones. Read and parsed
        before anything is dialed, so a wrong path or a key file handed
        over by mistake is a refusal by name rather than a TLS error on
        the first connection.
      - |
        **`drt netcheck --extra-root <PEM>`**, the same flag, the same
        rule, on the verb that needs it most. `netcheck` is what a person
        is told to run when they do not know their own network, and a
        corporate network -- where an egress proxy re-signs every TLS
        connection with a CA no public root vouches for -- is exactly
        where that question is hardest to answer and where the answer was
        `address    not measured`. Honest, and useless.

        It needed none of the scope machinery `doc/Ask-Discofetch-Reply.md`
        expected it to wait for: the reflect fetch builds its own trust
        store, so a flag was enough. `crates/drt/tests/reflect.rs` stands
        a TLS terminator in front of the test edge and asserts both halves
        in one run -- unreachable without the flag, measured with it --
        because only the pair proves the flag did the work.
      - |
        **`drt netcheck --reflect <url>` is the whole invocation** against
        an edge that describes itself. The run asks the first edge, before
        anything is measured, how to measure against it -- the STUN pair
        and the vantage addresses -- and configures itself from a
        `measure` block in the answer; `--stun` and `--reflect-at` become
        overrides that win when typed. Six flags, two of them edge
        addresses copied out of a document, were the shape that goes stale
        the day a third edge exists (issue #25). Nothing is compiled in: a
        bare run says it has nothing to measure against rather than
        inventing somebody's infrastructure, and anyone's own reflect
        endpoint gets the same one-flag behaviour.

        Its own request, not a reordering. The UDP half runs before the
        reflect fetches on purpose, so an edge that disagrees with STUN's
        address is recorded as a disagreement; taking the STUN pair from a
        measurement fetch would invert that, so the configuration fetch is
        a separate unpinned one and its answer is not kept as a view. The
        rules the flags live under bind the answer too -- one server is
        still "1 given", and an answer's vantages still may not host the
        probe -- because the values are merged before either rule looks.
        The evidence block's first line says where each came from.
      - |
        **Two vantages are pinned and compared by default.**
        `--pin-source-port` used to be what turned two reflect fetches into
        a TCP mapping comparison, and a caller who did not know the flag
        got two unrelated observations from a run that could plainly have
        compared them. Pinning happens whenever more than one fetch is
        planned, which is the only time it measures anything; the flag is
        kept and changes nothing. Not "measure both": that doubles the
        requests against edges that rate-limit, and a 429 renders as "not
        measured" -- a correct cheap outcome traded for a possibly-empty
        expensive one.

        Two things pinning by default made visible. A pinned port can be
        lost between the two sequential fetches -- released by the first,
        taken by any other process as its own ephemeral port before the
        second binds it -- which is a fact about the machine and not the
        network, so the run measures again from a fresh port, once, with
        the loss recorded; CI found it, running twenty of these at once.
        And an edge that failed beside one that answered was recorded and
        never shown, rendered only when no edge answered at all; it is
        named on the `tcp map` line now, so a comparison that became one
        vantage says why.
      - |
        **`wireguard_mapping` carries `local`**, this machine's own
        addresses, one per family. The mapped address is one candidate --
        server-reflexive -- and two machines behind one router publishing
        only that have to hairpin through it, which plenty of routers
        refuse: two machines on one LAN could not punch to each other from
        the report alone (issue #25). A guest cannot learn its own
        addresses -- no sockets, no `net`, an `fs` scope of one directory
        -- so the report is the only place a roaming laptop can get them,
        and `remap` refreshes them with the rest. The address the routing
        table picks toward the internet, per family, not an interface
        enumeration: no new dependency, and a multi-homed machine gets its
        primary until there is evidence it needs more. Raw, and always a
        list; publishing a LAN address is the program's decision, since it
        discloses topology.
    changed:
      - |
        **One loader and one trust store for every verb that dials TLS.**
        `--extra-root`'s loader moved out of `tunnel` into `roots`, which
        `tunnel` and `netcheck` now share, so "added, never substituted"
        is a property of one function rather than of every caller
        remembering it. Moved rather than duplicated while it is still
        unreleased, which is the only cheap moment to move a `pub` item.

        The shared loader also took `rest`'s stricter check, which the
        tunnel's own copy did not have: a certificate that parses but
        cannot serve as a trust anchor is refused at load, by name,
        instead of being accepted there and rejected at dial. That is the
        promise the flag's first sentence already made.
      - |
        **One WebSocket client, not two.** The caller half went through
        ego-transport's `WebSocketNative` while the device half used
        tokio-tungstenite directly: two error vocabularies, two sets of
        frame handling, and -- the reason this changed --
        `WebSocketNative::connect` calls `connect_async` with no
        connector hook, so only one of the two could ever be handed a
        trust store. Both are tokio-tungstenite now, which `tunnel.rs`
        had already named as the migration it was waiting for.

        It is a smaller file for it, and two things that were broken are
        not. The splice is a real split rather than a `select!` over a
        `&mut self` transport, which the old code's own comment called
        out as the constraint it wanted removed. And the caller half
        **answers pings**: a gate pinging an idle `ProxyCommand` session
        -- an hour into an ssh session with nothing typed -- used to be
        answered with silence.
    fixed:
      - |
        **Every way of failing to create the tunnel interface was
        reported as a missing privilege.** The `CAP_NET_ADMIN` paragraph
        was attached to every error `create_as_async` can return, not to
        the one it describes, and the errno it followed could not be read
        past it. Two failures it is false for arrived dressed as
        privilege problems while integrating rc7 into discofetch (issue
        #21): a container with no `/dev/net/tun`, **already uid 0**, told
        to go and get a capability it held; and `/dev/net/tun` at mode
        `0600` with `cap_net_admin=ep` on the binary, where a file mode
        does not care what capabilities you hold. The second cost about
        an hour and produced the conclusion "the capability isn't taking
        effect", which nearly got a working design abandoned.

        It is a lookup table now, and an errno outside it gets **no**
        sentence rather than a guess -- an errno printed bare is a thing
        to look up, an errno printed under a confident wrong cause is an
        hour lost. Four entries, each measured by making it happen:
        `ENOENT` (no device node -- and it says so, including that root
        fails here identically), `EACCES` (the node will not open, which
        is a file mode and not a capability), `EPERM` (the node opened
        and the kernel refused -- the one case the old paragraph was
        right about), and `EBUSY` (the interface name is taken, which
        nothing named before).
      - |
        **`drt wg check` said `ok` where the tunnel could not come up.**
        It called `validate`, which reads the config and nothing else, so
        on both machines above it printed `ok: drt0 on port 51821` and
        `drt start` then failed on the interface. `check` is the verb
        whose job is "will this work", and the two cheapest environment
        facts were exactly the ones it did not look at.

        It now prints them, as `here:` lines beside the config's `ok:`,
        covering the two errnos that can be established without creating
        anything: whether `/dev/net/tun` opens, and whether `CapEff`
        carries `CAP_NET_ADMIN`. The `TUNSETIFF` that returns `EPERM` is
        also the call that would create an interface, which is the one
        thing `check` promises not to do, so the capability is read from
        the mask rather than tried.

        **The exit code still follows the config alone**, deliberately:
        `check` exists so a config can be written on a laptop and
        deployed where the privilege is, and a laptop with no tun node is
        not a bad config. Failing over one would break the workflow the
        verb is for; the finding is printed loudly instead, and the line
        under it says which half the exit code answers.
      - |
        **`doc/Release.md` said the thing that works cannot work.** It
        recorded, in the strongest terms on the page, that a publishing
        `workflow_dispatch` could not create a tag, and called it the one
        operational rule. Both rc6 and rc7 were published exactly that
        way: run 37 created `v0.5.0rc6` at `105d895`, run 38 created
        `v0.5.0rc7` at `780071d`, artifacts and rendered body attached.
        The restriction was lifted upstream sometime between 2026-09-01
        and 2026-09-06 and nothing here noticed.

        It cost a version number the night it was found -- `v0.5.0rc5`
        was tagged at `main` before the branch merged, preflight
        correctly refused it, and the recovery chosen was a fresh rc6
        rather than a dispatch, because the page said a dispatch could
        not work. The correction is at the top with today's evidence and
        the old diagnosis kept underneath, the way that page already
        keeps v0.3.1's: a rule nobody can reproduce is worse than a rule
        with its history attached.

  - version: 0.6.0
    tag: v0.6.0
    date: null
    status: unreleased
    stable: false
    mirror: false
    dv_abi: 1
    diluvium: 850e00d73220427be68ae8f909f83b06cb2095bd
    diluvium_build: 13
    connectors:
      full: [time, fs, crypto, sql, ssh, rest, ssmtp, exec, data, listen]
      slim: [time, fs, crypto, listen]
      wasi: [time, fs, crypto, sql, listen]
      web: [time, fs, crypto]
    features:
      full: [regex]
      slim: [regex]
      wasi: [regex]
      web: [regex]
    summary: |
      **In progress, not cut.** The numeric round (`doc/Plan-2026-09.md`):
      DRT's half is a `features` compatibility fact, a raw-buffer lane in
      the hostcall reply, a `data` connector for parquet and CSV, and the
      config surface that bounds numeric work per instance.

      Minor rather than patch, by the rule this file's header states: the
      feature set is a new compatibility fact and `full`'s connector list
      changes. Both are checked by name, so neither can move under a
      version number that says nothing moved.

      `dv_abi` stays 1 until the pin that raises it lands. `diluvium` and
      `diluvium_build` name the same core v0.5.0rc8 carries, because this
      entry has not moved the pin yet.
    added:
      - |
        **A corpus of every config shape that is deployed or shipped**, in
        `crates/drt-config/tests/corpus/`, loaded through the real loader
        and diffed against what it parsed to before.

        `drt-config` is shared by everything, and this round adds fields to
        it. Every shipped install runs a config this loader wrote, and a
        regression there is caught by no other gate -- so the rule is that
        any loader change failing a corpus file is wrong regardless of what
        it enables. A refusal is snapshotted like any other outcome: three
        of the shapes in there are refused on purpose, and "it still
        refuses, for the same reason" is as much a fact about the loader as
        "it still parses to this".
      - |
        **`drt buildinfo` says which core is inside, not just which
        revision**: `features` (what the embedded diluvium carries --
        `regex` today, `numeric` when it lands) and `diluvium_build` (the N
        in `5.5.1_buildN`, which is the ordered half of a fact the revision
        states exactly). Both travel in `BUILDINFO.txt` and in this file,
        which is `doc/Release.md`'s rule: the compatibility fact travels
        with the bytes.
      - |
        **A `data` connector**: `read_parquet`, `write_parquet`, `read_csv`
        and `write_csv`, scoped to a granted directory exactly as `fs` is,
        and using `fs`'s own path jail rather than a second one.

        What it does not build is the point. A column crosses as raw bytes
        on the reply's blob lane, so a million rows is a million bytes and
        not a million Lua values; text crosses dictionary-encoded, `i64`
        codes plus each distinct string once. Nulls follow the numeric
        spec's Stage 4: an `f64` column says null with NaN, everything else
        carries a `u8` validity mask, and a column with no null carries
        nothing. Decoding runs on `spawn_blocking`, so the call parks the
        way `rest` parks -- a synchronous decode is `exec`'s shape, and it
        would stop every other instance in the deployment.

        `full` only. Four codecs -- snappy, gzip, lz4, zstd -- and not
        brotli, which this build does not carry, so a file using it is
        refused by name at read rather than mis-decoded.
      - |
        **A `numeric` block in the config**: `max_elements` and `max_tier`,
        per instance, attenuating at spawn under the same rule as budgets.
        A child may narrow either and raise neither, an unstated bound
        inherits the parent's rather than becoming unlimited, and the
        refusal names which of the two moved.

        Beside `budget`, not inside it, because they bound different
        things: instructions the guest executed, and elements a kernel
        processed on its behalf. Added beside the existing config fields,
        never through them -- the loader corpus is the proof, and it shows
        52 added lines and no changed ones across all thirteen shapes.

        `numeric_touched_fast` rides beside the fate on a stop event and is
        a roster question next to `budget`. It is `false` everywhere today,
        and that is a fact rather than a stub: no fast-tier backend exists
        in this workspace or in the pinned core, so no fast kernel can have
        run.
      - |
        **`needs_features` in an example's `meta.json`**, beside
        `needs_build`. A profile name says which connectors a binary has;
        it does not say which core is inside it, and an example that needs
        `numeric` is skipped by name on a build without it rather than
        producing a diff whose real content is "this build does not carry
        that". A core feature gets its own skip bucket and its own advice:
        no cargo flag adds one, so "rebuild with `--all-features`" would be
        a command that cannot help.
      - |
        **`doc/Numeric.md`**, which states what the three determinism tiers
        promise, the three different bounds on numeric work and which
        failure each has, and how a column crosses the hostcall boundary.
        Written for someone operating DRT rather than building the core.
      - "`examples/23-reading-parquet`, and the size ledger the plan asks for: `full` at `release-small` grows 1,349,408 bytes (+20.1%) for the `data` connector."
      - |
        **The root formats, and the resolution that reads them, in
        `drt-config`**: `project.json` with the declared ceiling,
        `consent.json`, grant signing requests and the decisions about them,
        canonical JSON, ed25519 signing, and `resolve` -- what `start` would
        do, as a pure function over inputs.

        In `drt-config` rather than in `drt` because `dollup` depends on this
        crate and `drt` never depends on anything of dollup's: drt has to
        work where dollup is not installed. That direction is what makes
        "audit reports what the runtime would do" a fact rather than an
        intention -- `dollup audit`, `drt start` and `stdlib:preflight` call
        one `resolve`, so they cannot drift within a release. Resolution
        opens no path: the caller has already read the files, which is also
        how a page reads them through `drt-platform` and a CLI reads the
        host's.

        Two shapes are load-bearing and worth stating. Every resolved field
        carries the rule that chose it (`debug (default_profile)` is a value
        and its provenance), because a setup report whose content is "which
        rule fired" cannot be built on bare values. And failures are typed
        values that accumulate rather than one error: `start` acts on the
        first blocking one, audit renders all of them, and both get the same
        wording because the wording is on the enum.

        Nothing is wired into the runtime yet -- no verb reads any of it.
        This is the shared crate landing first so the two repositories can
        proceed in parallel.
      - |
        **Consent, as the operator acknowledging a ceiling** -- not a grant,
        and it never creates one. The ceiling is `caps` in `project.json`,
        declared there and nowhere else, and every profile attenuates under
        it.

        The relation that decides whether a ceiling change prompts is
        `check_attenuation` and nothing else. An additive set difference
        would have been the obvious implementation and is wrong: attenuation
        treats the two effects asymmetrically -- allows may only shrink,
        denies may only grow -- so a ceiling that *drops a deny* adds
        nothing to the allow set and would be classified as a narrowing
        while actually widening what the root may do, silently. One relation,
        and the delta an operator reads is the objection itself rather than a
        second computation that can disagree with the first.

        `realm` is the consent noun and is deliberately not
        `drt_caps::Scope`, which is what a grant applies to. Realm coverage
        is `a == b || b.starts_with(a + ".")`, written once, and must not
        reuse `drt_caps::implies`: that is byte-prefix matching with no
        separator awareness, and pointed at dotted paths it makes
        `operator.net` cover `operator.network` -- a widening carrying a
        valid signature. That exact pair is a test.
      - |
        **Grant signing requests are content-addressed**: the identity is
        `{root_id, node, realm, ask, valid_from, valid_until}` hashed, and
        the pending file is named by it. `created_uuid7` and `reason` ride
        outside the hash.

        Three things fall out of that, and each is the answer to a bug
        somebody would otherwise write. A restart finds its standing
        approval, because the hash is recomputable from what the node asks
        again -- an identity including the moment of asking would lose the
        grant on every restart, and deleting the pending file would destroy
        the only preimage. Idempotency is one `stat` rather than comparison
        logic. And a node that rewords its plea keeps its grant.

        Verification is four steps, each a named failure, and `not_after` is
        checked **last** on purpose: never interpret unauthenticated data,
        and an expired-but-valid approval should say "expired" rather than
        "unknown key". The invariant is that an approval can only act within
        the consented ceiling and can never widen beyond it; without it the
        portal is an escalation path.
      - |
        **Canonical JSON that sorts structurally**, and does not trust
        `serde_json::Map`'s iteration order.

        `preserve_order` is a cargo feature and cargo unifies features across
        a workspace. dollup's workspace enables it and drt's does not, so the
        same helper shared by both would see two key orders and each
        repository's suite would pass in isolation while signatures failed
        between them -- the "signature failures nobody can debug" class,
        arriving by a route neither test suite can see. Keys are therefore
        collected and ordered by this crate, and CI runs the suite under both
        feature settings. Two further traps get explicit detection rather
        than hope: a non-finite float serializes as `null` without error, and
        a duplicate key is last-wins silently, so a guest's `ask` is checked
        at the msgpack boundary where both are still visible.
      - |
        **Golden fixtures in `crates/drt-config/tests/fixtures/`**: one
        canonical-JSON input with its exact bytes and digest, a valid
        `project.json`, a `consent.json` in each mode, and a signed request
        and decision pair. Both repositories assert against the same bytes
        instead of each writing their own and diverging, which is what makes
        a disagreement between `dollup audit` and `drt start` a diff rather
        than an investigation.
      - |
        **Node paths, derived at spawn.** An instance's place in the tree --
        `root`, `root/intake`, `root/intake/worker` -- composed from its
        parent's path and refused a reserved segment, which is what "`drt` is a
        privileged name" means in code: `root/drt` does not exist, and neither
        does `root/state`.

        The spawn request may name the last segment and nothing else. That
        presence is the whole stateful-versus-ephemeral distinction: a node
        that wants a stable name asks for one, and a node that does not gets
        its instance id, which is unique for the life of the swarm because
        handles are never reused. Neither is declared as a kind anywhere,
        which keeps it from becoming a third thing to configure.
      - |
        **`CapSet` records who holds it.** `Principal`'s doc has always said
        "who a capability set belongs to *or* was granted by"; provenance
        recorded the granter and this is the other half.

        It exists so a hostcall answered by the dispatcher knows which node is
        asking without a second identity channel threaded through every
        connector. `Connector::call` receives its wiring's scope and nothing
        about the instance -- deliberately, because a scope is a place and not
        an identity -- so the alternative was a parameter on nine connectors
        that eight of them would ignore. A holder is carried, never checked: a
        name is not an authority, and the attenuation refusals are identical
        either way.
      - |
        **Both hostcalls from consent.md §10.** `capabilities/list` gains
        `held` (which grants this instance actually holds under a family, with
        their effects) and `within_ceiling` (whether the root's declared
        ceiling could ever permit it). Added as fields on each entry rather
        than by reshaping the reply, so a program written against the C host
        reads the same `{name, kind, owner, granted, visibility}` and ignores
        the rest.

        `within_ceiling` is the one that earns its place: "not granted, ask"
        and "not granted, and this root will never allow it, reconfigure" are
        different messages, and only the second is worth failing early on.

        `capabilities/request_grant` is the other, under the same family so
        that `host:capabilities/list` alone reports without being able to ask
        -- an auditor and a petitioner are different grants. It answers
        `pending`, `granted` or `denied` as the reply **value** under
        `Status::Ok`: `doc/Hostcall.md` has no pending status on purpose, and a
        realm outside the ceiling comes back `ok` plus `denied` rather than
        `Status::Denied`, which means "you do not hold `host:...`" and would
        send a node looking for the wrong fix.
      - |
        **The grants desk**: `state/gsr/pending/` written, `state/gsr/decided/`
        read and verified, files only, no knowledge of HTTP or portals.

        The lookup order is stated rather than implied, because getting it
        wrong is invisible until a restart: compute the identity hash, check
        `decided/` for a *verified* decision, then check `pending/`, then and
        only then write. A restart recomputes the same hash and finds the
        standing decision with no second pending file, which is the property
        content-addressing bought and an identity carrying the moment of asking
        would have lost.

        Nothing is trusted because it is in `state/`: the four-step chain runs
        on every read, and `project.json` and `consent.json` are re-read per
        request rather than cached -- a ceiling the operator has since narrowed
        must bind, and a signer they have since added should not need a
        restart. A decision that fails verification is reported to the node
        with the step that failed and the file is left alone; deleting the
        evidence of a failed verification is the last thing this should do.
      - |
        **`drt start` serves the `tunnel` block.** The arrangement `relay`,
        `stun`, `turn` and `wg` already had: a `park` leg on a fetchpoint
        belongs in the deployment that fetchpoint *is*, not in a second process
        somebody has to remember to launch beside it. `tunnel::resolve` is the
        verb's own, so a block that starts under `drt start` is exactly a block
        that starts under `drt tunnel` -- a rename, not a second
        implementation. It reports nothing, deliberately: a tunnel's
        interesting events are the relay's and are already on that bridge.
      - |
        **Start-time consent**, and the asymmetry that is the point of it:
        `-y` accepts a **first** acceptance and nothing else. A `-y` that also
        accepted a widening would mean every systemd unit and CI job carried
        permanent pre-consent to every future ceiling the root might declare --
        the approval chain's invariant still true on paper and defeated in
        practice. Widening takes `--accept-changes`, typed by somebody who read
        the delta. No TTY and no applicable flag is a named failure: never
        hang, never assume yes.

        The delta goes to stderr and the objection is repeated on the refusal
        line. Under a supervisor those get read separately -- a scraper, a
        paged alert, a `systemctl status` tail -- so the line that killed the
        unit says what changed rather than only which flag would have allowed
        it.
      - |
        **Root discovery, with two walks that must not be merged.** Discovery
        does **not** walk up: `.drt_root/` is looked for in the working
        directory and nowhere else, so `cd build && drt start` inside a root is
        the no-root path rather than silently somebody else's deployment. The
        nesting check **does** walk up, and the inner root's `allow_nested`
        governs it, because the outer root's config cannot be relied on to be
        readable by whoever is running here. `--root` is what a systemd unit
        should use: systemd's default working directory is `/`, so a unit
        relying on discovery would find no root and not say so.
      - |
        **`drt start` reads a root.** `--root`, a profile name
        (`drt start debug`), `-y` and `--accept-changes`, and the order the
        three layers go in: resolve, gate on consent, then wire. The ceiling is
        checked before a connector exists, so a root whose consent has lapsed
        never reaches the point of binding a port.

        Two rules that were found by running it rather than by writing it. A
        **native stdlib entry reports instead of gating**: `drt start preflight`
        on a root nobody has consented to still prints, because telling an
        operator whether consent matches is the whole job, and the first shape
        of this gated first and so could not answer its own question. And start
        **says nothing about findings that do not stop it** -- they are in the
        resolution for `drt start preflight` and `dollup audit` to print, since
        "no drt version is pinned" is worth reporting and is not worth saying on
        every single start of an unpinned root.

        `--config` inside a root still runs, and attenuates under the root's
        ceiling: it is never a consent bypass, and the refusal is the same
        attenuation check a spawn makes.
      - |
        **`stdlib:<name>`, and `stdlib:preflight`.** A spelling that cannot
        collide with a filename, so it needs no place in `drt run`'s bare-token
        rules, and programs that run with no root, no cache and no dollup --
        which is what a verb that used to be a subcommand needs in order to stay
        reachable on a box holding one static binary.

        `preflight` is the one program here, and it is the report the design
        doc asks for: the profile that would run and the rule that chose it, the
        pin against the binary present, the ceiling and whether consent matches
        it, the entry, the merged args. It is the same `Resolution` that `start`
        acts on and `dollup audit` reports, so the three cannot disagree about
        what would happen.

        What is absent is absent rather than advertised: `tunnel` needs raw
        stdin as a guest-reachable byte stream and `netcheck` needs a config
        block whose verdict lands on a queue, so neither is listed. One
        registry, filtered, after a first version kept two lists that disagreed
        immediately and refused `preflight` with "it carries preflight".
      - |
        **`drt run` takes a file, a profile, code, stdin or a stdlib program**,
        decided in one fixed order: an explicit `-f`/`-c`/`-p`, then `-`, then a
        `stdlib:` prefix, then a leading `/` or `./`, then evidence of code,
        then a declared profile name, and a file otherwise.

        `drt run "print('hello!')"` works, which is what this was for.
        `drt run - <<'EOF'` works, so a heredoc needs no flag. Extensions are
        never consulted, so `drt run dlua-code.txt` runs. And the fallthrough is
        a **file**, not a refusal, so the error can name the way out: `no file
        'foo'; use -c to run it as code, -p for a profile, or -f to insist it is
        a file`.

        Evidence of code is a closed set — newline, parens, quotes, `=`, `;` —
        and whitespace is deliberately not in it, because a Windows path has
        spaces in it and `drt run "C:/my programs/app.dlua"` has to reach a
        file. Parens are path-legal too, which is exactly why `-f` exists: the
        set is evidence, not impossibility. A declared profile beats a file of
        the same name, and `-f` is the way past that as well.

        The rules are `drt_config::resolve::classify`, so they are stated once
        and the browser tier classifies identically — a page declares no
        profiles, so its bare tokens fall through to files, and stdin, profiles
        and stdlib names are refused there by name rather than silently read as
        paths.
      - |
        **`drt key new` and `drt key sign`.** The cryptography without dollup,
        and `key sign` is what turns consent.md §8's "a human with a text
        editor" from a claim into a path: the runtime cannot tell a portal from
        a person, but only if a person can actually produce a valid signature.

        `drt key new <path>` writes the private seed `0600` and prints the
        public half on **stdout** and nothing else, so `drt key new k > k.pub`
        leaves a file with one key in it. A key file is never overwritten —
        doing so loses the ability to re-make every signature it ever made.
        `drt key sign <key> <request> --key-id <id>` reads a request out of
        `state/gsr/pending/`, signs a decision, and writes it to
        `state/gsr/decided/`, with `--deny` for the other verdict and
        `--not-after` defaulting to an hour because revocation is out of scope
        and a forgotten approval is the failure mode. A decision that is already
        expired is refused at signing time rather than verifying and then
        failing step 4, which reads as a mystery.

        The key **file format** lives in `drt-config`, not here: dollup reads
        the same key out of `~/.dollup/keys/`, and two implementations of one
        format are two formats that agree until they do not.
      - |
        **`drt deploy`, `drt rm`, `drt commit`, and `start`'s deploy step.**

        ```text
          dlua_dir ──deploy──▶ live/<name> ──commit──▶ init/
             init/ ──deploy──▶
        ```

        **What runs is `live/`**, and only `live/`. Nothing loads out of
        `dlua_dir` or `init/` — they are where a deploy reads *from* — which is
        what makes `drt deploy` a step an operator can see rather than something
        `start` does invisibly, and what makes an edit not take effect until it
        is deployed. The first version of this resolved the entry straight out
        of `dlua_dir`, which worked and skipped the model entirely.

        `drt start` deploys and runs. On an already-deployed root it says so and
        stops, listing the three things the operator might have meant, because a
        deploy replaces rather than merges and `live/` is where a stateful node's
        directory survives restarts — overwriting it is destructive enough to be
        asked for, which is `--rm`. `drt run` is the verb that does *not* deploy:
        it runs `live/` as it stands, and says what to run when nothing is there.

        `commit` takes from `live/` and never from `dlua_dir`, so nothing reaches
        `init/` without having been visible in what runs and a supervisor can
        review a commit by looking at the deployment. `rm` deliberately does not
        go through resolution: it is how an operator gets out of a root that will
        not start, so it must not need the root to resolve.

        Bounded at 10,000 files and 256 MiB per copy, each a named refusal. The
        alternative to a bound is filling a disk and hearing about it from the
        kernel with a half-written `live/`.
      - |
        **The envelope**, in `drt-config` so dollup's audit reads the same type.
        `commit` is its single writer, so there is one current record to check,
        and `push` signs its hash rather than a file list it assembled itself.

        Both hashing regimes meet in that one file and the boundary is commented
        where it happens: a **file's** hash is over its bytes as they are, which
        is dollup's artifact regime — canonicalizing a `.dlua` would be absurd —
        while the **envelope object** is authored into a type and re-serialized
        before signing, so hashing it goes through canonical JSON like every
        other signed object. `files` is a `BTreeMap` for a reason that is not
        tidiness: an insertion-ordered map would hash differently on two
        filesystems that list a directory differently, so one tree would have two
        envelopes.

        `differences` answers with *what* differs rather than a boolean, because
        "your root does not match its envelope" is not something anyone can act
        on.
      - |
        **`RootInputs` gained an `init` listing**, beside `dlua_dir`. Which
        directory an entry must exist in is the profile's choice — one that sets
        `dlua_dir` deploys from there, one that does not deploys from `init/` —
        and checking `dlua_dir` either way reported every released root's entry
        as missing. Two listings, and the profile picks.
      - |
        **A profile's `args` reach the root program**, as a message on a queue —
        the one way anything reaches a program here. The merged table lands on
        `drt_config::resolve::ARGS_QUEUE`, held until the program declares it by
        the same reasoning the listener's requests are held: a program that does
        real work before its first park has declared nothing yet, and refusing a
        delivery for arriving early would be refusing it for the program's shape.

        Everything after the profile name on the command line belongs to the
        entry: `drt start --rm debug --verbose --port 9000 --stun a --stun b
        --label=gate`. drt's own flags come *before* the profile, which is what
        lets a profile declare its own command line without drt reserving names
        against it. The declared default's type does the parsing, so `--verbose`
        is a flag, `--port` takes an integer, a key whose default is `[]`
        accumulates, an undeclared key is a named failure listing what *is*
        declared, and a bare token with no key before it is refused rather than
        silently dropped.

        The delivery lives on `DeployDriver` and not in the two native loops,
        which is where a test caught it: the browser tier and any test drive the
        driver directly, so a page would never have received its arguments. One
        place, and every host gets it.

        A profile with no `args` delivers nothing and expects no queue — a
        program that takes no arguments must not have to declare one — and a
        profile that declares arguments nothing ever read says so once at drain,
        because that profile is describing a command line it does not have.
      - |
        **A `netcheck` block, and `stdlib:netcheck` to read it.** The verb's flags
        as config keys, measured beside the drive loop on its own runtime, with
        the verdict on the root program's queue — the arrangement `stun` and
        `turn` already have.

        A diagnostic a program can read is worth more than one a human reads
        once. A rendezvous program deciding whether to offer a direct path or a
        relay is asking exactly what `netcheck` answers, and asking it from inside
        the deployment asks it about the deployment's own network rather than
        about whatever shell ran the verb.

        The measurement order moved out of `cli.rs` into `netcheck::run`, because
        the verb and the block must not each have a copy of it: the configuration
        fetch before the measurements, UDP before reflect so STUN's address wins,
        the inbound probe last because it needs the reflect views. Not obvious, so
        having it twice would mean having it wrong once.

        The verdict crosses as a **table**, not a line of JSON text — a queue
        carries msgpack, and a program should index `answer.verdict` rather than
        parse. It is `render_json`'s own object, so a program reading the queue
        and an operator reading `drt netcheck --json` see one answer. A verdict
        whose queue the program has not declared is **dropped** rather than held,
        which is the opposite of the listener's choice and deliberate: a request
        is somebody waiting on an answer, a verdict is a snapshot the next one
        supersedes.

        `stdlib:netcheck` is nine lines and reimplements nothing. The measurement
        needs UDP sockets and a TLS stack, which no connector offers a guest, so
        it stays the host's and the stdlib program reads its answer. It is listed
        only on builds that carry the measurement, because a name resolving to a
        reader with nothing to read is worse than an absent name.

        A block naming nothing to measure against is refused at start rather than
        answered with an empty verdict: a deployment that asked for a diagnostic
        and got "unknown" would read the "unknown" as the answer.
      - |
        **`canon::to_msgpack`**, the inverse of `from_msgpack`. It cannot fail —
        every JSON value has a msgpack form, and the asymmetry runs the other way
        — and it lives in `canon` because the reason it exists is the boundary
        that module owns: a queue carries values, so anything the host renders as
        JSON and a program is meant to read has to cross as a value.
      - |
        **`--features turn` builds its own tests.** It did not, on any tree:
        `tests/turn.rs` was gated on the `turn` feature while importing the
        `turn` and `webrtc-util` *crates*, which only `wireguard` pulled in — so
        the TURN test needed a TURN client its own feature did not carry, and the
        combination failed to compile for anyone who tried it.

        `turn-client` names the client, `wireguard` names `turn-client` (its TURN
        fallback uses the same crates at runtime), and the test is gated on it. A
        feature rather than a dev-dependency because dev-dependencies cannot be
        optional and making these unconditional would build two crates on every
        `cargo test` of the slim profile for a test that compiles to nothing
        there; and not folded into `turn`, because a shipping feature must not
        carry crates only its tests use. The slim tree still carries neither.
    changed:
      - |
        **`drt-connector-fs` publishes its path jail.** `FsScope` and
        `FsScopeType` are public so the `data` connector can grant a
        directory through the same code rather than a second copy of it. A
        path jail that exists twice is a path jail that is wrong once. No
        behaviour of the `fs` connector changes.
      - |
        **The hostcall reply's encode goes through `to_wire`**, by value,
        rather than `to_bytes` by reference. A reply carrying no column
        encodes identically; one carrying a column has its bytes moved
        rather than copied.
      - |
        **The platform filesystem gains `create_dir_all` and `remove_dir_all`**,
        and its header stops promising six operations. A root has to be
        written, not only read, and a comment saying six while the list grows
        is the kind of lie this codebase's style exists to prevent.

        `remove_dir_all` is component-wise, because `Path::starts_with` is:
        removing `/work` must not take `/workshop`, and the byte-prefix version
        is the obvious one to reach for and is wrong. Both are idempotent, so a
        root's layout is created and a deployment removed without every caller
        carrying an "unless it is already there" branch.
      - |
        **`Signature` carries raw bytes like `PublicKey` does**
        (`from_bytes`/`as_bytes`), so a consumer holding a detached signature
        that never passed through this crate's JSON does not have to base64 it
        on the way in. Asked for by dollup; the two types were asymmetric for
        no reason.
    known_issues:
      - |
        **A connector decode is work the instruction budget does not
        bound** -- it is host work, not the guest's instructions, and not a
        kernel either. The only bound is `max_bytes` on the `data` scope,
        which is therefore the memory bound as well as the file bound.
        Measured at roughly 4 ms per megabyte of parquet; the decode parks
        on `spawn_blocking` so the deployment keeps running, and there is
        no per-call timeout and no cancellation. `doc/Failure-Modes.md`
        FM-5 has the numbers and how to size a scope.
      - |
        **The numeric half of this entry is plumbed, not live.** The pin
        does not carry a core with `numeric`, so: `features` and
        `diluvium_build` in `buildinfo` are hard-coded from the profile
        rather than read from the core, the blob lane delivers bytes inline
        as a Lua string rather than through `dv_reply_blob`, the instance's
        numeric bounds reach the instance but the core has nowhere to put
        them, and `numeric_touched_fast` is `false` because no fast-tier
        backend exists anywhere to set it. Each is marked `TODO(A0)` or
        `TODO(A2)` at the one place it changes, and each has a test that
        fails if the pin moves and the code does not.

