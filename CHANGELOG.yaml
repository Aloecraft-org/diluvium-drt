    summary: |
      One fix, and it is the one that matters most: **`drt tunnel` could
      not reach a `wss://` URL, in any release there has ever been.** The
      WebSocket client was compiled with no TLS backend, so every secure
      relay -- which is every relay outside a lab -- was answered with
      `TLS support not compiled in`. Found in the field, the evening rc6
      shipped, by the first person to point `ssh -o ProxyCommand` at a
      real gate.

      Nobody noticed for six candidates because nothing gated it: every
      test and every example reaches its relay on loopback over plain
      `ws://`, which is the one shape that does not need TLS. The same
      lesson `doc/Release.md` already records about release-only build
      paths, one layer down: a documented use case with no test is a use
      case that does not work.

      Otherwise rc6, unchanged: the WireGuard block, its measurements and
      its caveats are all as that entry describes them. Not mirrored, not
      `latest`; `install.sh` keeps resolving to v0.4.2.
    fixed:
      - |
        **`drt tunnel wss://…` failed with `TLS support not compiled
        in`.** `tokio-tungstenite` was a bare dependency, and tungstenite
        with no TLS feature compiles a client that can only speak `ws://`.
        It now carries `rustls-tls-webpki-roots`: rustls with Mozilla's
        bundled roots rather than native-tls, because the linux artifact
        is a static musl binary with no OpenSSL to link and no system
        trust store to find, and because it is the stack `netcheck`
        already ships. The relay and tunnel tests pass unchanged, since
        they never left loopback -- which is exactly why they never caught
        this -- and a handshake against a real gate now fails on the
        certificate rather than before it, which is the difference between
        "cannot" and "will not trust that", and is the whole fix.

  - version: 0.5.0rc6
    tag: v0.5.0rc6
    date: 2026-09-06
    status: released
    stable: false
    mirror: false
    dv_abi: 1
    diluvium: 850e00d73220427be68ae8f909f83b06cb2095bd
    connectors:
      full: [time, fs, crypto, sql, ssh, rest, ssmtp, exec, listen]
      slim: [time, fs, crypto, listen]
      wasi: [time, fs, crypto, sql, listen]
      web: [time, fs, crypto]
    summary: |
      The sixth candidate, and it is one feature: the last rung of the
      traversal ladder.
      `netcheck` says what a network can do, `stun` measures the mapping
      that decides it, the relay carries what cannot be reached directly,
      and `turn` carries what a browser needs -- every rung answering
      *can these two hosts exchange packets*, and none of them answering
      *and then what*. **WireGuard is the answer to that**, in the
      process, on Mullvad's gotatun: once two hosts can exchange UDP
      datagrams, carrying arbitrary traffic between them is a solved
      problem, and a fetchpoint becomes an IP address that `ssh/exec`,
      `rest` and `listen` reach with no new plumbing.

      **The punch is measured now, and not by this repository.** Every
      test here runs on loopback, where there is no NAT to punch. What
      settles it is a lab run outside DRT: discofetch drove its own
      rendezvous program against this block with two hosts in network
      namespaces behind two netfilter NATs, and got direct handshakes
      through both of them with no relay in the path (247 ms and
      1747 ms), then a relayed one past a symmetric NAT through
      `drt turn` (739 ms), packets across in every case. Recorded in
      issue #15, scoped in issue #17. A second run against this candidate
      drove the whole feature unattended -- direct through two NATs,
      a `remap` after one end moved, and the symmetric-NAT fallback --
      and is in issue #17's comments. It does not settle NAT hardware DRT
      has not seen -- netfilter on one machine is not a consumer router
      and not a carrier-grade NAT -- and `doc/WireGuard.md` §2 keeps that
      line where a reader will find it.

      **It raises the toolchain floor to Rust 1.95**, which gotatun
      requires. That is the one thing in here that can break a build
      unrelated to WireGuard, so it is said in the summary rather than a
      bullet.

      **What it does not have**, all sized in issue #17 and none of it
      started: no re-authentication of a TURN allocation whose credential
      expires (§3), no Windows profile carrying the verbs a workflow uses
      (§4), no signed darwin binaries (§5), no no-root userspace mode
      (§7), and no rate limiting on either the relay or `drt turn` (§8).
      The last two are the ones that need a design decision rather than
      an afternoon.

      **Still a candidate**, and the thing to test is a tunnel rather
      than a surface: two boxes that could not reach each other before
      this, and a deployment reaching one of them by address.

      Not mirrored, and not `latest`: `install.sh` keeps resolving to the
      newest stable release, which is v0.4.2.

      **There is no rc5, and nothing is missing.** Its tag was pushed at
      `main`, which did not yet carry any of this, so the release
      workflow's preflight refused it in two seconds -- `no entry in
      CHANGELOG.yaml for tag 'v0.5.0rc5'` -- and published nothing. The
      gate worked exactly as `doc/Release.md` says it should. Rather than
      move a tag that had already been pushed, the same tree is cut as
      rc6. rc5 is a tag with no release behind it and no content that is
      not here.
    added:
      - |
        **WireGuard in the process: a `wireguard` block and `drt wg`.**
        gotatun 0.9.2 -- Mullvad's maintained fork of Cloudflare's
        boringtun, MPL-2.0, audited, and a library first. Its `Device` is
        generic over **both** of its transports, which is what makes it
        embeddable here rather than merely linkable: `drt start` gives the
        IP side a kernel interface, and the tests give it a pair of
        channels, so the same device that carries a deployment's traffic
        is proven in CI with no privilege at all -- two devices, two
        loopback sockets, a real handshake, a real packet in one end and
        the same bytes out the other. `+382 KB` on `full`, no new C
        toolchain (`ring`, not aws-lc-rs). Needs Rust 1.95.

        The block brings the interface up itself -- name, address, MTU --
        so the common case needs no `ip` commands, and it measures its own
        NAT mapping on `listen_port` microseconds before binding it,
        because `netcheck --udp-port` cannot do that job once the device
        holds the port. The measurement is the probe's socket on that
        port and not the device's own; `doc/WireGuard.md` §2 says so
        rather than implying otherwise.
      - |
        **A peer's endpoint is settable at run time**, which is the half
        of a punch that has to come from a program. A rendezvous
        *discovers* peers, so a device that could only talk to peers
        already in its config could not serve one. `endpoint`, `add`,
        `remove`, `keepalive`, `relay` and `remap` are read off
        `reply_queue`, and everything the device knows -- peers, roams,
        the mapping, refusals -- goes out on `queue`. A command the device
        refuses comes back as `wireguard_error` to the program that wrote
        it rather than to a log nobody is reading, and clearing an
        endpoint is said out loud (`clear = true`), because reading an
        absent field as "forget this peer" made one mistyped field name
        tear down a working tunnel in silence.
      - |
        **The fallback for a NAT that cannot be punched: WireGuard over a
        TURN allocation.** `punchable: false` is a fork in the road rather
        than the end of it. A device with `turn_fallback = true` can be
        handed a credential and take an allocation, and what comes back is
        the address to publish to the rendezvous *instead of* the measured
        one; the far side never learns the difference. Both paths stay
        live, which is ICE's own shape -- a peer that later becomes
        reachable directly is still heard. Off by default, because a
        device that may relay gives up gotatun's batched `recvmmsg` read,
        and one that never will should not pay for the option.

        A relay that fails does not take the tunnel with it. gotatun's
        buffered receive loop ends its task for good on one error, so a
        transport that propagated a lapsed allocation would kill a device
        whose direct socket was fine all along. It drops the allocation,
        keeps reading the socket, and the drive loop tells the deployment
        it is sending direct again.

        The allocation also survives a `remap`, which is not obvious and is
        therefore measured: it lives on the transport factory rather than
        on the socket pair `suspend` drops, so `resume` hands the rebuilt
        pair the same one. Remeasuring while relaying is how a program
        learns the relay is no longer needed, so losing it there would have
        defeated the point.
      - |
        **`remap`, for the machine that moves.** The mapping was measured
        once, before the bind, and nothing measured it again -- so a
        laptop that went from home Wi-Fi to a phone hotspot had an
        endpoint published to its rendezvous that was wrong and no event
        saying so. `wireguard_endpoint` reports a *peer* roaming; this is
        the half that reports us. It costs a rehandshake and cannot not: a
        mapping belongs to a port, measuring one means binding the port
        the running device holds, so the sequence is suspend, measure,
        resume. Free in the case it exists for, since a device whose
        network just changed has dead sessions already (issue #17 §2).

        One measured detail, pinned by a test rather than left as
        folklore: gotatun's `suspend` returns **before** its I/O tasks
        drop their sockets -- about 6 ms -- so the first version measured
        into "address already in use" every time.
      - |
        **`drt wg keygen`, `drt wg pubkey` and `drt wg check`.** Creating
        a tunnel interface needs a privilege; none of these do. `keygen`
        and `pubkey` are the key pair, so setting a peer up never needs
        wireguard-tools installed, and `check` says whether a config can
        work without touching an interface -- including the two cases
        that otherwise mislead. A peer whose `allowed_ips` no route will
        reach is **named at startup**, with the `ip route add` that fixes
        it, because that one comes up, reports a handshake, and silently
        carries nothing. And a block naming no peers at all is read as
        the config a rendezvous writes rather than an oversight: `check`
        says what startup will do, and warns when such a block has no
        `reply_queue`, since then nothing can ever tell it about a peer
        (issue #17 §6).
      - |
        **Two examples, and a way for the gate to skip what it cannot
        run.** `21-wireguard` is the block without a privilege -- the key
        pair, the refusals a config earns before anything binds, and the
        no-peer rendezvous config -- and `22-wireguard-interface` is the
        half that creates the interface and asks the *kernel* what it
        made, through `/sys`, rather than taking DRT's word for it. The
        examples gate grew `needs_privilege` for the second, alongside
        `needs_network`: a skip is still never a pass, and it says which
        it was.
    fixed:
      - |
        **Giving up a TURN allocation on purpose was reported as the relay
        having failed.** `{command = "relay", clear = true}` was answered
        correctly -- and then, on the very next tick, with
        `wireguard_error` saying "the turn allocation failed and was
        dropped". The relay branch of the drive loop returns early without
        taking the new state as its baseline, so the pass after it found
        the allocation gone, nothing marking that pass as asked, and
        reported a loss nobody had suffered. A rendezvous acting on it
        would go looking for a fault that never happened, or re-allocate a
        relay its deployment had deliberately stopped paying for.

        Found while closing the one case issue #17's lab did not drive --
        `remap` on a device that is currently relaying, which works and is
        now held by a test. The false alarm turned up because that test
        panics on any refusal rather than skipping what it is not looking
        for, which the older assertions did.
      - |
        **The block dropped the one report a rendezvous cannot start
        without, and a device with no peers never spoke at all.** Three
        fixes from issue #15, all found by running the block against the
        program it was built for -- which is the same run that measured
        the punch, and the argument for doing that before shipping rather
        than after.

        The bridge pushed every report and ignored a refusal. Right for
        the peer snapshot, whose next one carries the running totals;
        wrong for everything said once, and worst for the mapping, which
        is queued before the device binds and so goes out before a root
        program has reached the line declaring its queue. The one report a
        rendezvous waits for was the one guaranteed to be lost. One-shot
        reports are held and retried oldest first now, bounded, because a
        queue that stays full is a sizing problem the deployment should
        see rather than one the device should absorb.

        `report_ms` did not tick for a device with no peers: the loop sent
        a snapshot only when the peer list differed, and an empty list
        never differs from an empty list. A program using the interval as
        its clock never got one until a peer existed -- and no peers is
        exactly where a rendezvous starts. The timer is unconditional now.

        `peers = {}` was refused as "must be a list of peers". Lua has one
        table type, so `{}` is both the empty list and the empty map;
        the loader read lists with `as_array` and refused the empty case,
        having resolved that ambiguity for connector scopes and nowhere
        else. Fixed once for `peers`, `stun`, `allowed_ips`, `caps` and
        `headers`.
      - |
        **Not fixed, and not ours: `drt turn` answers 400 to a wrong or
        expired credential where RFC 8489 §9.2.4 says 401 with a fresh
        NONCE.** Confirmed twice -- against the `turn` crate's own client,
        which reports `error 400`, and in its `authenticate_request`,
        which builds one `bad_request_msg` and sends it down both the
        unknown-user and the failed-integrity path. 0.17.2 is the newest
        release and carries it. It matters because 401 means
        *authenticate again* and 400 means *your request is malformed*: a
        browser's ICE agent retries the first and gives up on the second,
        so a credential that lapses mid-session takes the allocation with
        it. DRT cannot reach it from outside the crate.
        `doc/TURN-401-Upstream.md` is the brief for filing it, and
        `a_forged_credential_is_refused_with_the_wrong_code_for_now`
        asserts today's 400 on purpose -- that test failing is the signal
        it was fixed upstream.

  - version: 0.5.0rc4
    tag: v0.5.0rc4
    date: 2026-09-06
    status: released
    stable: false
    mirror: false
    dv_abi: 1
    diluvium: 850e00d73220427be68ae8f909f83b06cb2095bd
    connectors:
      full: [time, fs, crypto, sql, ssh, rest, ssmtp, exec, listen]
      slim: [time, fs, crypto, listen]
      wasi: [time, fs, crypto, sql, listen]
      web: [time, fs, crypto]
    summary: |
      The fourth candidate, and the first whose notes about the pump are
      true: `rest`, `ssh` and `ssmtp` park a slow call instead of
      stalling every instance, which rc1 through rc3 claimed and did
      not do. Measured, and kept as a gate. Beside it, diluvium build13
      -- regular expressions, a backtick literal and a linear-time
      engine, the ask vera filed as §22 -- the asks from discofetch
      that a hole punch needs first: `netcheck --json` carrying its
      evidence, `--udp-port` measuring the flow that matters, and
      `buildinfo` naming the tag a box actually runs -- and five of
      vera's: `capabilities/list`, `journal_mode`, credentials by
      reference, `Date` and `Message-ID`, and `extra_roots`. Each is
      answered by number in `doc/Ask-Discofetch-Reply.md` and
      `doc/Ask-Vera-Reply.md`, open ones included.

      Tagged at the merge of the branch rather than at the rehearsed cut,
      so it also carries what landed in the hours between: the first
      Windows artifact (`drt_slim_windows_x86_64.exe`, slim, run through
      the examples gate on a Windows runner before upload), a `turn`
      block beside `stun` (issue #12), and `drt tunnel --local`, the
      program-shaped caller half (issue #13). Each is under Added below.

      **Still a candidate**, and now with something to test that is
      not the wasm surface: a deployment whose deadlines assumed `rest`
      blocks the process is measuring a different system from here on.

      Not mirrored, and not `latest`: `install.sh` keeps resolving to
      the newest stable release, which is v0.4.2.
    added:
      - |
        **Regular expressions, from diluvium build13.** A backtick literal
        is a compiled regex -- `` `(\d+)-(\d+)` `` -- and `regex` is the
        library under it, with `find`, `match`, `gmatch`, `gsub` and
        `split` shaped like their `string.*` twins and the pattern first
        in every call. The engine is a Thompson NFA with Pike's submatch
        tracking: linear in the subject, nothing backtracks, and
        backreferences and lookaround are refused by name with the
        reason. In every profile, since it is the language and not a
        capability, and a sealed guest keeps it. Vera's `DRT_ASKS.md`
        §22, whose evidence was a leaf that could not be written.
      - |
        **`capabilities/list`.** The menu the C host answers and DRT did
        not: one entry per wired family in the C's shape -- `{name, kind,
        owner, granted, visibility}` -- plus the menu itself, gated on
        `host:capabilities/list` exactly as the C gates it, so an auditor
        granted that and nothing else can report what a swarm reaches
        without reaching any of it. `granted` is asked the way a call
        would ask it, and a family held narrowly (`host:fs/read`) is
        reported reached. Vera §14, and the one thing that turns a typo
        in a JSON root config into something a program can see.
      - |
        **`journal_mode` on the `sql` scope.** Applied on open and read
        back, because SQLite answers the pragma with the mode it is *in*:
        a read-only open cannot convert a database and a filesystem that
        cannot lock refuses WAL by answering `delete`, and either is a
        refusal by name rather than a deployment quietly running a mode
        its config does not say. A property of the place, beside
        `access`, which a guest could not set -- the pragma writes and
        answers a row, so `query` and `exec` both refuse it. WAL is what
        two processes sharing one file want and what a Litestream replica
        needs (vera §15).
      - |
        **Credentials by reference: `pass_env` on `ssmtp`, `{"env":
        NAME}` for an injected `rest` header.** The mechanism `crypto`'s
        `key_env` already is, so a root config carries the shape and
        never the value and can be read over a shoulder or checked in. Read
        once at startup; an unset variable is a refusal by name there,
        not an AUTH failure at 3am (vera §18).
      - |
        **`extra_roots` on the `rest` scope.** PEM files whose
        certificates are trusted *beside* webpki's public roots -- an
        egress proxy's interception CA, typically -- and never instead of
        them: a scope that could narrow the trust store to one certificate
        would be a footgun, and the case that exists is a CA to add.
        Parsed at startup, every certificate checked as a usable anchor,
        so a wrong path or an empty file is refused by name before the
        first call rather than as `tls` on it. Vera §23's first half and
        discofetch §6; the proxy half is open, and named as such in
        `doc/Ask-Vera-Reply.md`.
      - |
        **`netcheck --json` carries its evidence.** It emitted `verdict`,
        `why` and `advice` and nothing else -- less than the person got
        from the same run -- so discofetch's punch tool re-implemented
        STUN to recover a port the text already printed. Every line of the
        text form is now a structured pair under `evidence`: the address
        with its CGNAT flag, the v6, the UDP mapping with each server's
        port, the TCP views with `agrees` and `stable`, the inbound
        results; "not measured" is `null` beside its `why`. Under a
        `schema: 1` a script can refuse (discofetch §1, and the schema it
        tracked for later).
      - |
        **`netcheck --udp-port N`.** A mapping is a fact about one flow,
        and the probe socket bound an ephemeral port, so the mapped port
        it reported was never the one `udp/51820` would get; on a NAT
        that is not port-preserving the verdict was right about the
        network and wrong about the flow that matters. The flag binds the
        probe to a chosen port; one that cannot be bound is refused by
        name under `udp map`, never quietly replaced (discofetch §2).
      - |
        **`buildinfo` names the tag.** Every candidate under 0.5.0
        printed `version: 0.5.0`, so a box could not be asked which one
        it ran, and discofetch pinned the installed tag in a sidecar file
        because the binary would not say. `build.rs` stamps
        `DRT_RELEASE_TAG` from the release workflow's environment;
        `buildinfo` prints `tag: v0.5.0rc4` and `"tag":"v0.5.0rc4"`, or
        no line and `null` for a local build, and the native smoke step
        checks the binary says it back (discofetch §3).
      - |
        **`drt` on `wasm32-wasip2`, released as `drt_wasip2.wasm`.** The
        binary itself, built with the `wasi` profile -- `time`, `fs`,
        `crypto`, `sql`, `listen` -- and run under wasmtime with
        `script/drt-wasip2.sh`, which carries the flags the C core's
        `setjmp`/`longjmp` lowering needs. It proves itself the way the
        native legs do and then harder: the examples gate runs through
        the wrapper before the artifact is uploaded.
      - |
        **`drt` in a browser, released as `drt_web.tar.gz`.** The `web`
        profile with the C core and wasi-libc linked into one module, so
        it imports nothing but wasm-bindgen's glue -- wasi-libc's
        seventeen syscalls are defined inside it, and `fd_write` reaches
        the same sink the runtime's own output does. The tarball carries
        the module, its glue, and `drt-term.js`/`shell.js`: a host
        constructs its own xterm.js `Terminal`, calls `attach`, and has a
        `$ ` prompt running `drt run`, `drt repl` and `drt buildinfo`.
        The gate is the examples in Chromium, a REPL transcript diffed
        against the native binary's, and a real xterm.js typed into.
      - |
        **`drt start` serves from wasmtime.** wasip2 has sockets and no
        threads, so the listener gained a second acceptor: non-blocking
        `std::net`, one state machine per connection, stepped from the
        drive loop. The bridge's contract is unchanged -- one request per
        connection as a message on a queue, headers by allowlist only --
        and `examples/17-serving-http` is the deployment, curl'd both
        natively and under wasmtime.
      - |
        **Line editing in `drt repl`, behind the `cli` feature.** History,
        word motions, undo, and Tab whose candidates are the names the
        running instance answers with rather than a list the host
        hard-coded. One editor (`ego-cli`) rather than one per host --
        the same `Session` and the same completer on a tty and in a
        page, where `attach` drives the host's own xterm.js object.
        In `slim` as well as `full`, costing +150 KB and no async
        runtime, because the backend under it blocks on the terminal
        instead of driving an executor; +129 KB in the browser. `drt
        repl` reading a pipe is unedited as before, prompts on stderr,
        and so is `drt repl` under wasmtime, which has no way to ask
        for raw mode.
      - |
        **`drt repl --unsafe`, and the swarm exports.** Two things a
        browser host asked for. The flag evaluates with `os`, `io` and
        `require` in scope, which a *language* REPL needs and a sealed
        guest is not given: it lifts the stdlib seal and nothing else,
        so the capability grants and the budget still decide what a
        hostcall reaches, and the banner names what is off rather than
        looking like a sealed REPL. It costs replayability and makes the
        budget approximate. And `DrtSwarm` puts the instances table --
        root, step, the roster, the capability questions, hibernate and
        wake -- beside `DrtTerm`, over the deployment `drt start`
        drives, so a panel driving the C swarm's sixteen entry points
        has twins for them here.
      - |
        **`crates/drt-platform`.** The four places DRT touches a platform
        -- clock, entropy, the filesystem, stdio -- behind one seam, so
        nothing above them is target-aware. In a page the clock is
        `web-time`, the filesystem is a `MemFs` the page seeds, and stdio
        is a sink the page installs.
      - |
        **A `turn` block beside `stun`, and `drt turn`.** The relay for the
        peers `stun` says cannot punch: ego-transport's TURN server on the
        maintained `turn` crate, verifying coturn's `use-auth-secret`
        scheme byte for byte -- `<expiry>:<principal>` and an HMAC-SHA1
        under a shared secret -- which is what `crypto/turn_credential`
        already minted, so the same secret in both blocks is the whole
        deployment and a credential minted here verifies against coturn
        too. The secret by the same three knobs as `connectors.crypto.turn`
        (`key_file`, `key_env`, `key`); a block with none refuses to bind,
        because a relay with nothing to verify is an open one. Inside
        `drt start` the server reports its counters on a timer and every
        allocation's closing byte count with its principal as it happens,
        which is what makes relay bytes attributable to a name. Proven
        against webrtc-rs's client rather than our own, and the
        connector's credential against the deployment's relay
        (`crates/drt/tests/turn.rs`). discofetch's DRT_ASKS §4, decided
        in issue #12.
      - |
        **`drt tunnel <url> --local HOST:PORT`.** The program-shaped
        caller half: a local listener where each accepted connection
        claims one fresh leg through the relay -- N connections are N
        legs, nothing multiplexed over one -- so `ssh/exec` scoped to that
        address, `rest` dialing it, or a desktop client with no
        ProxyCommand support, reach a parked device from inside a
        program, which the stdio half could not give them. A claim the
        relay refuses (the 403 a wrong key or an unknown label gets, or a
        relay that is not there) closes the local connection at once
        rather than leaving a client on a half-open socket; both
        measured. discofetch's DRT_ASKS §11, filed as issue #13, landed
        as filed.
      - |
        **A Windows artifact: `drt_slim_windows_x86_64.exe`.** `slim`, for
        x86_64-pc-windows-gnu, cross-built from a Linux runner with
        mingw-w64 the way `doc/Platforms.md` said to rehearse it, and run
        for real on a Windows runner before it is allowed on the release
        page: `--version`, a smoke program, `buildinfo`, then the examples
        gate under Git Bash, byte for byte against the same `expected.txt`
        every other target diffs. The gate found the one difference --
        Windows's C runtime rewrote the C core's `\n` as `\r\n` while
        `println!` did not -- and `stdio::bytes_as_written` fixes it once
        at startup. `full` is not built for Windows: `exec` is unix-only
        and `full` carries aws-lc-sys through russh, the linux aarch64
        problem again.
    changed:
      - |
        **`ssmtp/send` answers `message_id`**, minted by the host under
        the sender's domain -- `<secs.nanos.seq.rand@domain>` -- and
        written on the wire, so a reply can thread onto its own message
        and a duplicate on the wire is self-diagnosing: one id twice is
        one send retried, two ids is two sends. Generated rather than
        accepted, for the reason `From` is the scope's: the domain in an
        id should be the deployment's, and an id the host assigns is one
        the guest cannot forge (vera §20, second half). `scope.from`
        must name an `@domain` now, checked at startup.
      - |
        **`netcheck`'s help stops describing a deployment** (discofetch
        §7): `--reflect-at` is necessary because one `--reflect` is one
        vantage whatever its name resolves to, not "until a DNS record
        lands"; `--port` is no longer "experimental" with a server "not
        deployed yet", and says why a deployment fact does not belong in
        it; the STUN pair is named by zone.
      - |
        **wasm-bindgen `=0.2.114` -> `=0.2.127`, and a workaround
        deleted.** 0.2.114 refused a module carrying the C core's
        `try_table` unless it exported `__instance_terminated`, so
        `drt-web` defined that global itself; 0.2.127 defines it, and the
        definition is gone. The pin could not move earlier because the
        ego crates pinned 0.2.114 and a workspace holds one version --
        they moved, each tagging `pre-wasm-bindgen-0.2.127` at the commit
        before, and DRT followed. Nothing hard-codes the version twice:
        `script/drt-web.sh` and the `browser` job read the CLI's version
        off the crate's pin, so this was one line and the rest followed.
      - |
        **`sql` is on `rusqlite 0.40`.** A version bump and no source
        change: the connector uses `Connection`, `OpenFlags`, `ToSql`
        and `types::{Value, ValueRef}`, none of which moved. It matters
        because `libsqlite3-sys` carries a `links` key, so a build can
        hold one SQLite and not two -- which is what stood between DRT
        and an aloelite volume as an `fs` backend (doc/Aloelite.md §4).
      - |
        **The drive loop inverted, and the hostcall pump defers.**
        `run`, `repl` and `start` no longer own loops that block:
        `tick()` advances an instance as far as it can and returns what
        the host should do next, and the host owns the sleeping. A
        connector that cannot answer at once is parked in an in-flight
        table and polled on the loop's cadence instead of stalling every
        instance. **From rc4**, and not before it: the pump parks a call
        that can await, and until the drive loops entered a runtime
        (under Fixed, below) no tokio-backed connector could, so the
        three candidates carried this sentence while `rest` went on
        stalling every instance exactly as in v0.4.2.
      - |
        The command surface moved from `main.rs` into `drt::cli`, so a
        page parses the same command line the binary parses, with the
        same `--help` and the same exit statuses.
    removed:
      - |
        **The browser tier's JS host bridge.** `drt-web` was an `Engine`
        over a JS-hosted interpreter, which was SPEC.md §4's fallback for
        the case where the C core could not be linked into the same
        module. It can, so the fallback is gone rather than kept as a
        second engine path.
    fixed:
      - |
        **`ssmtp/send` sent no `Date`.** RFC 5322 §3.6 requires it, and
        its absence is a spam signal to every filter that checks: vera's
        first escalation digest was quarantined for it, then released
        with a `Date` the relay had added -- a repair a strict relay
        refuses and a receiving filter scores. Written from the host
        clock now, in RFC 5322's shape and always `+0000`, without a
        calendar crate (vera §20, first half).
      - |
        **`rest`, `ssh` and `ssmtp` stalled every instance for the length
        of a call, in every 0.5.0 candidate, while the notes said they
        parked.** Each begins its call with `Handle::try_current()` and
        takes `own_runtime().block_on(..)` when there is no runtime to
        await on -- and `run`, `repl` and `start` entered none, so there
        never was one, and every call took the blocking arm on the drive
        thread. The deferred pump was right; the reactor was missing.

        Measured before it was believed: a child's three-second
        `rest/get` held its parent's next hostcall for 3004 ms in rc3,
        1 ms in a control with no call, and 1 ms with a runtime entered
        -- with the child's call still completing. The native drive
        loops now enter one before their first tick
        (`crates/drt/src/runtime.rs`): leaked rather than dropped, for
        FM-1's reason, and a no-op in a build carrying no tokio-backed
        connector, which is what the `runtime` feature the three imply
        is for. `crates/drt/tests/start.rs::parking` is the measurement
        kept as a gate, and it fails at 604 ms with the entry removed.

        What this does and does not change. A slow `rest`, `ssh` or
        `ssmtp` call now stalls only the instance that made it. `exec`
        still stalls the loop, because its body is `std::process` and
        has no future to park; that is the next change, not this one.
        And a deployment whose deadlines were sized on the assumption
        that `rest` blocks the process -- vera's are, by its own
        account -- is measuring a different system from rc4 on, which
        is the reason to say so here rather than let it be found.
      - |
        **A request arriving before the program declared its queue was
        refused rather than held.** A listener accepts from the moment
        the process binds it, which is before the program has run a line,
        so a request naming a queue the program has not declared yet was
        answered `503 the program declares no request queue` on the spot
        — a definitive answer to a question the deployment had not
        finished hearing. Stepping the root before delivering covered a
        program that declares before its first park and nothing else: one
        that reads config or migrates a schema first parks with the queue
        still absent.

        The wait is now `admit_timeout_ms` on the listener, defaulting to
        two seconds: a request waits for its queue to exist, and past the
        grace the old refusal is still what it gets, because a program
        that has declared nothing by then declares nothing. `0` restores
        the immediate refusal exactly. The connection's own
        `conn_deadline_ms` still bounds everything — a held request whose
        caller has already given up is dropped rather than answered — so
        this adds a wait, never a hang.

        The window is tens of milliseconds and it lands on precisely the
        caller that cannot survive it: one that handshakes **once** at
        startup. Reported (issue #11) against prosody's `mod_rest`, which
        probes its component once and settles on JSON or XML for the life
        of the process, so a 503 in that window left two healthy services
        that never exchanged a message, with nothing in either log to say
        why. The failure is silent by construction, which is why this is
        a fix and not a documented sharp edge.
      - |
        **`rest` read past the body it already had, and failed the call
        for how the peer hung up.** A server that closes the TCP
        connection without a TLS `close_notify` -- Amazon Bedrock, and a
        great many others -- made every `rest/get` and `rest/post` against
        it fail with `read: peer closed connection without sending TLS
        close_notify`, with every byte of the body already in hand. The
        read loop ended on EOF rather than on the framing the response
        head declares, so the read that failed was the one *after* the
        last one that mattered: a deployment could not complete one model
        call while `curl` answered 200 to the same request, the same
        token and the same body, seconds apart.

        The loop now stops where `content-length` or the terminating
        chunk says the body ends, and a close without `close_notify` is
        judged rather than raised -- it ends a body the framing says is
        complete, and fails one it says is short, naming what was expected
        and what arrived (`read 5 of 11 bytes, then the peer closed
        without close_notify`) because the error it replaces named neither
        and reads as a broken network. A response framed by the close
        alone is unchanged: the close is its only ending, and telling that
        from a truncation is exactly what `content-length` is for.

        Two things fall out of reading the framing rather than the
        connection. A `content-length` beyond the response-header bound
        still frames the body, where before a long-headed response fell
        back to waiting for EOF; and a server that ignores `connection:
        close` no longer holds the call open until `timeout_ms`.
        Reported as issue #10, which was misdiagnosed twice before it
        landed there -- a TLS-layer error reads as "the connection is
        broken", which sends you to the network and the credentials
        rather than to the client's own read loop.
      - |
        The fs connector's jail tests for a root with `has_root` rather
        than `is_absolute`, which `std` answers differently on
        `wasm32-unknown-unknown` -- an absolute path was refused
        natively and by a different rule in a page.
