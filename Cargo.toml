# The DRT workspace (SPEC.md §3). One codebase; `slim`/`full` are cargo-feature
# profiles of it, and the embedding library is the degenerate profile.
[workspace]
resolver = "2"
members = [
    "crates/drt-config",
    "crates/drt-caps",
    "crates/drt-hostcall",
    "crates/drt-platform",
    "crates/drt-connector",
    "crates/drt-plugin",
    "crates/drt-swarm",
    "crates/drt",
    "connectors/time",
    "connectors/ssh",
    "connectors/fs",
    "connectors/sql",
    "connectors/crypto",
    "connectors/ssmtp",
    "connectors/exec",
    "connectors/data",
    "crates/drt-bench",
    "crates/drt-web",
]

[workspace.package]
version = "0.6.2-rc.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Aloecraft-org/diluvium-drt"

[workspace.dependencies]
drt-config = { path = "crates/drt-config", version = "0.6.2-rc.1" }
drt-caps = { path = "crates/drt-caps", version = "0.6.2-rc.1" }
drt-hostcall = { path = "crates/drt-hostcall", version = "0.6.2-rc.1" }
drt-platform = { path = "crates/drt-platform", version = "0.6.2-rc.1" }
drt-connector = { path = "crates/drt-connector", version = "0.6.2-rc.1" }
drt-swarm = { path = "crates/drt-swarm", version = "0.6.2-rc.1" }
drt-web = { path = "crates/drt-web", version = "0.6.2-rc.1" }
drt-connector-time = { path = "connectors/time", version = "0.6.2-rc.1" }
drt-connector-ssh = { path = "connectors/ssh", version = "0.6.2-rc.1" }
drt-connector-fs = { path = "connectors/fs", version = "0.6.2-rc.1" }
drt-connector-sql = { path = "connectors/sql", version = "0.6.2-rc.1" }
drt-connector-crypto = { path = "connectors/crypto", version = "0.6.2-rc.1" }
drt-connector-rest = { path = "connectors/rest", version = "0.6.2-rc.1" }
drt-connector-ssmtp = { path = "connectors/ssmtp", version = "0.6.2-rc.1" }
drt-connector-exec = { path = "connectors/exec", version = "0.6.2-rc.1" }
drt-connector-data = { path = "connectors/data", version = "0.6.2-rc.1" }
# The line editor, one for every target (doc/Wasm.md D8, M8). From git
# because that is where it lives; the browser half pins wasm-bindgen
# `=0.2.127`, which is this workspace's pin already.
# `default-features = false` turns off ego-cli's `runtime` feature, which is
# what carries `ego_platform`, tokio and crossterm's `EventStream`. Without
# it `term::platform()` returns `BlockingNative`, which blocks on
# `crossterm::event::read` and writes with `std::io` -- so `slim` can have a
# line editor without gaining an async runtime (ego-cli#4, doc/Wasm.md M8).
ego_cli = { git = "https://github.com/Aloecraft-org/ego-cli", branch = "main", default-features = false }

# Field names cross the boundary: the safe diluvium crate serializes with
# rmp-serde's to_vec_named, and everything here does the same.
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

# The language, from its own repo — diluvium/diluvium-sys stay there,
# versioned with the header (SPEC.md §2). The -sys build compiles the
# amalgamated C core from the checkout, so a C toolchain is required.
diluvium = { git = "https://github.com/Aloecraft-org/diluvium" }

# The transport layer: one Transport trait over TCP/WebSocket/WebRTC/SSH,
# schemes gated per platform as typed refusals (SPEC.md §9; `ssh` is
# russh-backed, pubkey-only, modern suite only).
ego_transport = { git = "https://github.com/Aloecraft-org/ego-transport" }

# WireGuard, as a library rather than a kernel module (doc/WireGuard.md).
# Mullvad's maintained fork of Cloudflare's boringtun: the protocol as a
# state machine, and a `Device` generic over BOTH its transports -- the UDP
# socket and the IP side -- which is the property that lets DRT hand it the
# socket `netcheck --udp-port` measured and, in tests, channels instead of a
# kernel interface. MPL-2.0, audited (`audits/` upstream), and released
# monthly.
#
# `default-features = false` drops aws-lc-rs for `ring`, which rustls
# already links here: aws-lc-sys needs cmake and a C toolchain per target,
# which is precisely what keeps `full` off Windows and linux aarch64, and
# taking it on for WireGuard would spread that instead of containing it.
gotatun = { version = "0.9", default-features = false, features = ["ring", "device", "tun"] }
# The allowed-ips type on `gotatun::device::Peer`. Named here rather than
# re-exported upstream, so the version must track gotatun's.
ipnetwork = "0.21"

# Consumed as the remaining parallel work lands (SPEC.md §3): ego-proc
# (ForeignActor — merged upstream; the adapter is the next milestone) and
# ego-platform. Declared the day the first crate here depends on them.

# Size-tuned release for the distribution question (SPEC §3's slim profile
# wants to travel): `cargo build --profile release-small -p drt`.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
