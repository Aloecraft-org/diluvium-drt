# The DRT workspace (SPEC.md §3). One codebase; `slim`/`full` are cargo-feature
# profiles of it, and the embedding library is the degenerate profile.
[workspace]
resolver = "2"
members = [
    "crates/drt-config",
    "crates/drt-caps",
    "crates/drt-hostcall",
    "crates/drt-platform",
    "crates/drt-connector",
    "crates/drt-swarm",
    "crates/drt",
    "connectors/time",
    "connectors/ssh",
    "connectors/fs",
    "connectors/sql",
    "connectors/crypto",
    "connectors/ssmtp",
    "connectors/exec",
    "connectors/data",
    "crates/drt-bench",
    "crates/drt-web",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Aloecraft-org/diluvium-drt"

[workspace.dependencies]
drt-config = { path = "crates/drt-config", version = "0.5.0" }
drt-caps = { path = "crates/drt-caps", version = "0.5.0" }
drt-hostcall = { path = "crates/drt-hostcall", version = "0.5.0" }
drt-platform = { path = "crates/drt-platform", version = "0.5.0" }
drt-connector = { path = "crates/drt-connector", version = "0.5.0" }
drt-swarm = { path = "crates/drt-swarm", version = "0.5.0" }
drt-web = { path = "crates/drt-web", version = "0.5.0" }
drt-connector-time = { path = "connectors/time", version = "0.5.0" }
drt-connector-ssh = { path = "connectors/ssh", version = "0.5.0" }
drt-connector-fs = { path = "connectors/fs", version = "0.5.0" }
drt-connector-sql = { path = "connectors/sql", version = "0.5.0" }
drt-connector-crypto = { path = "connectors/crypto", version = "0.5.0" }
drt-connector-rest = { path = "connectors/rest", version = "0.5.0" }
drt-connector-ssmtp = { path = "connectors/ssmtp", version = "0.5.0" }
drt-connector-exec = { path = "connectors/exec", version = "0.5.0" }
drt-connector-data = { path = "connectors/data", version = "0.5.0" }
# The line editor, one for every target (doc/Wasm.md D8, M8). From git
# because that is where it lives; the browser half pins wasm-bindgen
# `=0.2.127`, which is this workspace's pin already.
# `default-features = false` turns off ego-cli's `runtime` feature, which is
# what carries `ego_platform`, tokio and crossterm's `EventStream`. Without
# it `term::platform()` returns `BlockingNative`, which blocks on
# `crossterm::event::read` and writes with `std::io` -- so `slim` can have a
# line editor without gaining an async runtime (ego-cli#4, doc/Wasm.md M8).
ego_cli = { git = "https://github.com/Aloecraft-org/ego-cli", branch = "main", default-features = false }

# Field names cross the boundary: the safe diluvium crate serializes with
# rmp-serde's to_vec_named, and everything here does the same.
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

# The language, from its own repo — diluvium/diluvium-sys stay there,
# versioned with the header (SPEC.md §2). The -sys build compiles the
# amalgamated C core from the checkout, so a C toolchain is required.
#
# Pinned by revision rather than tracking a branch, because the numeric
# round's core is not on diluvium's `main`: `a9de62f` is session A's
# `numeric-syntax` at A6 plus one fix to the numeric corpus (which pinned
# the FPU's NaN rather than the program's; the kernels are unchanged).
# `doc/Plan-2026-09.md` §3.7 is the protocol -- B moves the pin to the hash
# A records -- and A's `## Status` says "pin this commit or later".
#
# An exact rev, not `branch = "numeric-syntax"`: a branch pin re-resolves
# on every `cargo update` and the compatibility facts BUILDINFO publishes
# would then describe whatever the branch happened to be that day.
diluvium = { git = "https://github.com/Aloecraft-org/diluvium", rev = "a9de62f108646a4f12e27692359480dfd7550100" }

# TEMPORARY, and the only reason this crate is named here: turning on the
# core's `numeric` build.
#
# `numeric` is a feature of `diluvium-sys` (off by default, matching the
# Makefile's NUMERIC), and DRT depends on the safe `diluvium` crate, which
# has no `[features]` section to forward it through. So there is no way to
# ask for it from where DRT sits. Naming `diluvium-sys` directly is how the
# feature gets set: cargo unions features per package, and both paths
# resolve to one `diluvium-sys` from one rev, so the copy `diluvium` links
# is the copy that gets `numeric`.
#
# What that buys is not a Rust API -- DRT calls nothing in this crate. It is
# `-DDV_NUMERIC` and §3.5's flags reaching the C build, which is what puts
# `array` in a guest and makes B4's examples possible at all. `dv_features()`
# reports it either way, so nothing downstream has to know this is here.
#
# TODO: drop this entry the moment the safe crate can forward the feature
# (raised on diluvium#33) and write `diluvium = { ..., features = ["numeric"] }`
# instead. Reaching around a wrapper is a workaround, not a design: it works
# only while both come from one rev, and a `diluvium` that ever vendored its
# own `diluvium-sys` would leave this silently setting a feature on a crate
# nobody links.
diluvium-sys = { git = "https://github.com/Aloecraft-org/diluvium", rev = "a9de62f108646a4f12e27692359480dfd7550100", features = ["numeric"] }

# The transport layer: one Transport trait over TCP/WebSocket/WebRTC/SSH,
# schemes gated per platform as typed refusals (SPEC.md §9; `ssh` is
# russh-backed, pubkey-only, modern suite only).
ego_transport = { git = "https://github.com/Aloecraft-org/ego-transport" }

# WireGuard, as a library rather than a kernel module (doc/WireGuard.md).
# Mullvad's maintained fork of Cloudflare's boringtun: the protocol as a
# state machine, and a `Device` generic over BOTH its transports -- the UDP
# socket and the IP side -- which is the property that lets DRT hand it the
# socket `netcheck --udp-port` measured and, in tests, channels instead of a
# kernel interface. MPL-2.0, audited (`audits/` upstream), and released
# monthly.
#
# `default-features = false` drops aws-lc-rs for `ring`, which rustls
# already links here: aws-lc-sys needs cmake and a C toolchain per target,
# which is precisely what keeps `full` off Windows and linux aarch64, and
# taking it on for WireGuard would spread that instead of containing it.
gotatun = { version = "0.9", default-features = false, features = ["ring", "device", "tun"] }
# The allowed-ips type on `gotatun::device::Peer`. Named here rather than
# re-exported upstream, so the version must track gotatun's.
ipnetwork = "0.21"

# Consumed as the remaining parallel work lands (SPEC.md §3): ego-proc
# (ForeignActor — merged upstream; the adapter is the next milestone) and
# ego-platform. Declared the day the first crate here depends on them.

# Size-tuned release for the distribution question (SPEC §3's slim profile
# wants to travel): `cargo build --profile release-small -p drt`.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
