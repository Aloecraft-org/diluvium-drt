[package]
name = "drt-connector-exec"
description = "The exec connector: host:exec/run, the honest escape hatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
rmpv = { workspace = true }
drt-caps = { workspace = true }
drt-connector = { workspace = true }
# A spawned child and everything it starts, owned as one: the deadline
# sweeps a tree, not a process. `drt-platform` spells it per target -- a
# process group on unix, a Job Object on Windows -- which is what lets this
# connector compile off unix at all.
drt-platform = { workspace = true }

# The errno table that tells "the program could not be started" (127) from
# "the host failed" (an error). Unix-only because errno numbers are: the
# same question is asked of `CreateProcess`'s own failures on Windows, in
# this connector's platform block.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
