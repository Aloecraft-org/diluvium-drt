[package]
name = "drt-connector-ldap"
description = "The ldap connector: host:ldap/bind and host:ldap/search against one directory, with the service credential kept host-side"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
rmpv = { workspace = true }
serde_json = "1"
drt-caps = { workspace = true }
drt-connector = { workspace = true }
drt-config = { workspace = true }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net"] }

[dev-dependencies]
pollster = "0.4"
rcgen = "0.13"
ldap3_proto = "0.9"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
