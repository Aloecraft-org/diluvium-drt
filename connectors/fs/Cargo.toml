[package]
name = "drt-connector-fs"
description = "The fs connector: a granted directory, and the program names files inside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
rmpv = { workspace = true }
drt-caps = { workspace = true }
drt-connector = { workspace = true }
# The backend the jail runs over: the disk, or a page's memory (doc/Wasm.md D5).
drt-platform = { workspace = true }

[dev-dependencies]
drt-hostcall = { workspace = true }
tempfile = "3"
pollster = "0.4"

[features]
# A scope may name an aloelite volume file (`volume_file`), mounted through
# drt-platform's AloeliteFs. Not in a page, which reaches aloelite through
# drt-web's `fs` backing instead.
aloelite = ["drt-platform/aloelite"]
