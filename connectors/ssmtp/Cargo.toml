[package]
name = "drt-connector-ssmtp"
description = "The ssmtp connector: host:ssmtp/send, an outbound relay the guest never holds the credential for"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
rmpv = { workspace = true }
drt-caps = { workspace = true }
drt-connector = { workspace = true }
# Every one of these is already in the tree behind `rest` and `crypto`, so on
# the `full` profile this connector adds no new dependency at all.
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "rt", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
base64 = "0.22"

[dev-dependencies]
pollster = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
