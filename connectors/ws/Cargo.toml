[package]
name = "drt-connector-ws"
description = "The WebSocket client connector: node-owned outbound ws:// and wss:// connections, under rest's origin allowlist"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
rmpv = { workspace = true }
drt-caps = { workspace = true }
drt-connector = { workspace = true }
# The origin allowlist, its injected headers, its private-address rule and
# its extra roots are rest's, parsed by rest's own code: one grant shape for
# every outbound connector, and nothing here to drift from it.
drt-connector-rest = { workspace = true }
# The versions `drt tunnel` already builds, so `full` links no second copy.
# No TLS feature on tungstenite: this crate does TLS itself with rest's
# trust store and hands tungstenite the finished stream.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", default-features = false, features = ["net", "time", "rt", "rt-multi-thread", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tokio-tungstenite = "0.24"
