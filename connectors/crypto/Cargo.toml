[package]
name = "drt-connector-crypto"
description = "The crypto connector: the host holds the key, a guest holds the right to ask for a signature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
rmpv = { workspace = true }
drt-caps = { workspace = true }
drt-connector = { workspace = true }
# The clock and the entropy source, per target (doc/Wasm.md D5).
drt-platform = { workspace = true }
# Every one of these is already in the tree behind `ssh` (russh pulls the
# same versions), so on the `full` profile this connector is close to free.
# `sha1` backs TURN's HMAC (see the warning at `turn_credential`) and
# `crypto/hash`'s interop digest, which signs nothing.
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
# The JWT payload is JSON, and hand-rolling an emitter and a parser for the
# bytes a signature is checked over is exactly the wrong place to save a
# dependency. `drt` already carries serde_json for the root config.
serde_json = "1"
# EdDSA for `jwt_sign` under an EdDSA key, and the JWK `public_key` returns.
# Already in every native build through `drt-config`'s consent signatures,
# with the same features off: no `fast` tables, because slim and web exist
# to not spend that binary size. `pkcs8` and `pem` read a configured key in
# the shape `openssl genpkey -algorithm ed25519` writes; a hand-rolled DER
# reader is the wrong place to save a dependency.
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize", "pkcs8", "pem"] }

[dev-dependencies]
drt-hostcall = { workspace = true }
pollster = "0.4"
# The tests derive the JWT subkey independently, to pin the KDF to the C's,
# and recompute the TURN password to pin coturn's assembly.
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
# Interop: the tokens, the JWKs and the enrolment URIs are checked by
# libraries that share no code with this crate's TOTP or JWT assembly. A
# test that asked the connector to grade its own output would pass a
# connector that is wrong the same way on both sides.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"] }
