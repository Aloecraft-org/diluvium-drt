name: segv-probe

# TEMPORARY. Chasing the unexplained SIGSEGV in the host_lua test binary
# (see doc/Release.md). Locally it will not reproduce in thousands of runs
# on either rustc, under valgrind, or under a 64,800-instance
# concurrent-lifecycle stress — so ask the machine it actually happened
# on, with core dumps armed so a crash yields a backtrace rather than
# another bare "signal: 11". Delete once answered.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'How many times to run the host_lua binary'
        type: string
        default: '500'
      suites:
        description: 'How many full --all-features suites to run'
        type: string
        default: '3'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Arm core dumps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
          echo "cores: $(nproc)"
          free -m
          rustc --version

      - name: Build the test binaries
        run: cargo test --workspace --all-features --no-run

      - name: Hammer host_lua
        run: |
          ulimit -c unlimited
          BIN=$(ls -t target/debug/deps/host_lua-* | grep -v '[.]d$' | head -1)
          echo "binary: $BIN"
          "$BIN" --list | tail -2
          fails=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            if ! "$BIN" > /tmp/out.txt 2>&1; then
              rc=$?
              fails=$((fails + 1))
              echo "=== RUN $i FAILED rc=$rc ==="
              tail -20 /tmp/out.txt
            fi
          done
          echo "RESULT host_lua: $fails failures in ${{ inputs.rounds }} runs"

      - name: Run the full suite a few times
        run: |
          ulimit -c unlimited
          fails=0
          for i in $(seq 1 ${{ inputs.suites }}); do
            if ! cargo test --workspace --all-features > /tmp/suite.txt 2>&1; then
              fails=$((fails + 1))
              echo "=== SUITE $i FAILED ==="
              grep -E "SIGSEGV|test failed|FAILED|panicked" -B3 -A3 /tmp/suite.txt | head -40
            fi
          done
          echo "RESULT full suite: $fails failures in ${{ inputs.suites }} runs"

      - name: Backtrace any core
        if: always()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "RESULT no core dumps — nothing crashed"
            exit 0
          fi
          BIN=$(ls -t target/debug/deps/host_lua-* | grep -v '[.]d$' | head -1)
          for c in "${cores[@]}"; do
            echo "=================== $c ==================="
            gdb -batch -ex "thread apply all bt" "$BIN" "$c" 2>&1 | head -150
          done
