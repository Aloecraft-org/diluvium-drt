name: segv-probe

# Chasing the host_lua SIGSEGV. Round 2, with a real hypothesis.
#
# Round 1 ran the binary 500x on a runner and found nothing — but that job
# got a cache MISS and built clean, while every failure so far has been in
# release.yml's `test` job, which restores a cache with "full match: false"
# and rebuilds on top. diluvium-sys compiles libonelua.a in OUT_DIR from a
# build script, and the diluvium pin changed since that cache was seeded;
# fresh Rust linked against a stale C archive would look exactly like this.
#
# Swatinem/rust-cache keys on the JOB ID, so the job below named `test`
# shares release.yml's cache byte for byte, and `clean` deliberately has
# none. Same command, same runner image, one variable.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'cargo test rounds per job'
        type: string
        default: '6'

jobs:
  # Shares release.yml's `test` cache — the suspect.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: cargo test in a loop, rebuilding first
        run: |
          ulimit -c unlimited
          fails=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            # Every failure so far rebuilt the engine crates and ran the
            # tests in the same invocation; every pass did not. Force it.
            cargo clean -p drt-swarm -p drt -p diluvium-sys -p diluvium 2>/dev/null || true
            if ! cargo test --workspace --all-features > /tmp/s.txt 2>&1; then
              fails=$((fails + 1))
              echo "=== ROUND $i FAILED ==="
              grep -E "SIGSEGV|test failed|panicked" -B2 -A2 /tmp/s.txt | head -20
            fi
          done
          echo "RESULT rebuild-then-run: $fails failures in ${{ inputs.rounds }} rounds"
      - name: Backtrace any core
        if: always()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          [ ${#cores[@]} -eq 0 ] && { echo "RESULT no cores"; exit 0; }
          BIN=$(ls -t target/debug/deps/host_lua-* | grep -v '[.]d$' | head -1)
          for c in "${cores[@]}"; do
            echo "=========== $c ==========="
            gdb -batch -ex "thread apply all bt" "$BIN" "$c" 2>&1 | head -150
          done

  # No cache at all — the control.
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: cargo test in a loop
        run: |
          ulimit -c unlimited
          fails=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            if ! cargo test --workspace --all-features > /tmp/s.txt 2>&1; then
              fails=$((fails + 1))
              echo "=== ROUND $i FAILED ==="
              grep -E "SIGSEGV|test failed|panicked" -B2 -A2 /tmp/s.txt | head -20
            fi
          done
          echo "RESULT clean-build: $fails failures in ${{ inputs.rounds }} rounds"
      - name: Backtrace any core
        if: always()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          [ ${#cores[@]} -eq 0 ] && { echo "RESULT no cores"; exit 0; }
          BIN=$(ls -t target/debug/deps/host_lua-* | grep -v '[.]d$' | head -1)
          for c in "${cores[@]}"; do
            echo "=========== $c ==========="
            gdb -batch -ex "thread apply all bt" "$BIN" "$c" 2>&1 | head -150
          done
