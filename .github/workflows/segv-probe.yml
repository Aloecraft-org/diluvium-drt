name: segv-probe

# Chasing the SIGSEGV. It is not host_lua-specific — it hit tests/stun.rs
# in ci run 10 — so this loops the stun binary, which is small and fast.
#
# Round 1 ran the binary 500x on a runner and found nothing — but that job
# got a cache MISS and built clean, while every failure so far has been in
# release.yml's `test` job, which restores a cache with "full match: false"
# and rebuilds on top. diluvium-sys compiles libonelua.a in OUT_DIR from a
# build script, and the diluvium pin changed since that cache was seeded;
# fresh Rust linked against a stale C archive would look exactly like this.
#
# Swatinem/rust-cache keys on the JOB ID, so the job below named `test`
# shares release.yml's cache byte for byte, and `clean` deliberately has
# none. Same command, same runner image, one variable.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Test binary to loop (host_lua = FM-2, the open one)'
        type: string
        required: false
        default: 'host_lua'
      rounds:
        description: 'cargo test rounds per job'
        type: string
        default: '6'

jobs:
  # Shares release.yml's `test` cache — the suspect.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: loop the test binary
        run: |
          ulimit -c unlimited
          T='${{ inputs.target }}'
          cargo test -p drt --no-default-features --features full --test "$T" --no-run
          BIN=$(find target/debug/deps -maxdepth 1 -type f -executable -name "$T-*" ! -name '*.d' | head -1)
          echo "binary: $BIN"
          # The backtrace step needs the SAME binary this loop ran; handing
          # gdb a different one yields a core full of `?? ()` and no symbols,
          # which is exactly how the first captured core was wasted.
          echo "PROBE_BIN=$BIN" >> "$GITHUB_ENV"
          segv=0; fails=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            "$BIN" > /tmp/s.txt 2>&1 || rc=$?; rc=${rc:-0}
            if [ "$rc" -ge 128 ]; then
              segv=$((segv + 1)); echo "=== RUN $i DIED rc=$rc ==="; tail -5 /tmp/s.txt
            elif [ "$rc" -ne 0 ]; then
              fails=$((fails + 1)); echo "=== RUN $i FAILED ==="; sed -n '/^failures:/,+8p' /tmp/s.txt | head -12
            fi
            rc=0
          done
          echo "RESULT: $segv signal-deaths, $fails failures in ${{ inputs.rounds }} runs"
          # Fail the job when something died by signal. Counting a crash and
          # then exiting 0 makes a green check mean "the loop finished",
          # not "nothing crashed" — and a probe whose green is unreadable
          # is worse than no probe.
          [ "$segv" -eq 0 ] || exit 1
      - name: Backtrace any core
        if: always()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          [ ${#cores[@]} -eq 0 ] && { echo "RESULT no cores"; exit 0; }
          BIN="${PROBE_BIN:?the loop step did not export a binary path}"
          echo "binary: $BIN"
          for c in "${cores[@]}"; do
            echo "=========== $c ==========="
            gdb -batch \
                -ex "set pagination off" \
                -ex "info registers rip rsp rbp" \
                -ex "thread apply all bt full" \
                "$BIN" "$c" 2>&1 | head -400
          done

  # No cache at all — the control.
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: loop the test binary
        run: |
          ulimit -c unlimited
          T='${{ inputs.target }}'
          cargo test -p drt --no-default-features --features full --test "$T" --no-run
          BIN=$(find target/debug/deps -maxdepth 1 -type f -executable -name "$T-*" ! -name '*.d' | head -1)
          echo "binary: $BIN"
          # The backtrace step needs the SAME binary this loop ran; handing
          # gdb a different one yields a core full of `?? ()` and no symbols,
          # which is exactly how the first captured core was wasted.
          echo "PROBE_BIN=$BIN" >> "$GITHUB_ENV"
          segv=0; fails=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            "$BIN" > /tmp/s.txt 2>&1 || rc=$?; rc=${rc:-0}
            if [ "$rc" -ge 128 ]; then
              segv=$((segv + 1)); echo "=== RUN $i DIED rc=$rc ==="; tail -5 /tmp/s.txt
            elif [ "$rc" -ne 0 ]; then
              fails=$((fails + 1)); echo "=== RUN $i FAILED ==="; sed -n '/^failures:/,+8p' /tmp/s.txt | head -12
            fi
            rc=0
          done
          echo "RESULT: $segv signal-deaths, $fails failures in ${{ inputs.rounds }} runs"
          # Fail the job when something died by signal. Counting a crash and
          # then exiting 0 makes a green check mean "the loop finished",
          # not "nothing crashed" — and a probe whose green is unreadable
          # is worse than no probe.
          [ "$segv" -eq 0 ] || exit 1
      - name: Backtrace any core
        if: always()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          [ ${#cores[@]} -eq 0 ] && { echo "RESULT no cores"; exit 0; }
          BIN="${PROBE_BIN:?the loop step did not export a binary path}"
          echo "binary: $BIN"
          for c in "${cores[@]}"; do
            echo "=========== $c ==========="
            gdb -batch \
                -ex "set pagination off" \
                -ex "info registers rip rsp rbp" \
                -ex "thread apply all bt full" \
                "$BIN" "$c" 2>&1 | head -400
          done
