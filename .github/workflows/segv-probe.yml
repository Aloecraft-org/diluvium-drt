name: segv-probe

# TEMPORARY. Chasing the unexplained SIGSEGV in the host_lua test binary
# (doc/Release.md, run 33046156344's successor 33157346043). Locally it
# will not reproduce in thousands of runs; this asks the machine it
# actually happened on, with core dumps armed so a crash yields a
# backtrace instead of another mystery. Delete once answered.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'How many times to run the host_lua binary'
        type: string
        default: '400'
      suites:
        description: 'How many full --all-features suites to run'
        type: string
        default: '3'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
          ulimit -c unlimited
          nproc; free -m; rustc --version
      - name: Build the test binaries
        run: cargo test --workspace --all-features --no-run
      - name: Hammer host_lua
        run: |
          ulimit -c unlimited
          BIN=$(cargo test --workspace --all-features --no-run --message-format=json 2>/dev/null \
                | python3 -c "
import json,sys
for line in sys.stdin:
    try: m = json.loads(line)
    except Exception: continue
    exe = m.get('executable')
    if exe and 'host_lua' in exe: print(exe)
" | head -1)
          echo "binary: $BIN"
          "$BIN" --list | tail -2
          fails=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            if ! "$BIN" > /tmp/out.txt 2>&1; then
              rc=$?
              fails=$((fails + 1))
              echo "=== RUN $i FAILED rc=$rc ==="
              tail -20 /tmp/out.txt
            fi
          done
          echo "host_lua: $fails failures in ${{ inputs.rounds }} runs"
          echo "HOST_LUA_FAILS=$fails" >> "$GITHUB_ENV"
      - name: Run the full suite a few times
        run: |
          ulimit -c unlimited
          fails=0
          for i in $(seq 1 ${{ inputs.suites }}); do
            if ! cargo test --workspace --all-features > /tmp/suite.txt 2>&1; then
              fails=$((fails + 1))
              echo "=== SUITE $i FAILED ==="
              grep -E "SIGSEGV|test failed|FAILED|panicked" -B3 -A3 /tmp/suite.txt | head -40
            fi
          done
          echo "full suite: $fails failures in ${{ inputs.suites }} runs"
      - name: Backtrace any core
        if: always()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core dumps — nothing crashed"
            exit 0
          fi
          for c in "${cores[@]}"; do
            echo "=================== $c ==================="
            exe=$(gdb -batch -ex "core-file $c" 2>/dev/null | grep -oP "Core was generated by \`\K[^' ]+" | head -1)
            echo "exe guess: $exe"
            gdb -batch -ex "thread apply all bt" "$exe" "$c" 2>&1 | head -120
          done
