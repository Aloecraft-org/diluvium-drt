name: Release

# Builds and (optionally) publishes a DRT release for one specific commit.
# The shape is diluvium's release.yml, kept deliberately: tag push publishes;
# a manual run is a full rehearsal by default — tests, every platform,
# artifacts on the run — and touches the Releases page only when publish=true.
#
# DRT versions independently of diluvium. The coupling is RECORDED, not
# required: BUILDINFO.txt in every release names the diluvium git revision
# this binary embeds and the dv ABI version it speaks, so "which diluvium is
# inside" is a fact you read off the release, never a tag-naming convention.
#
# A `v*-dev.*` tag is the fast path (doc/ALIGNMENT.md §7): the suite, the
# Linux build, the web build and the browser access client, no changelog
# entry, always a prerelease.
# The suffix decides, so what was decided travels with the artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to release (blank = the selected branch)'
        type: string
        required: false
        default: ''
      tag:
        description: 'Tag name, e.g. v0.1.0 (required when publishing)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish to the Releases page. Leave off for a rehearsal.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      # The suffix decides (doc/ALIGNMENT.md §7): `v*-dev.*` builds one
      # platform, needs no changelog entry, and is always a prerelease.
      dev: ${{ steps.check.outputs.dev }}
      # Derived, since a tag push carries none and a dispatch may name a
      # commit (doc/ALIGNMENT.md §5); BUILDINFO records what was found.
      branch: ${{ steps.check.outputs.branch }}
      # Derived from the changelog's `stable`, which is the truth; GitHub's
      # flag is downstream of it. A dev build has no entry and is always one.
      prerelease: ${{ steps.changelog.outputs.prerelease || steps.dev.outputs.prerelease }}
      # Which platforms `build` runs: every one, or the Linux leg alone for
      # a dev build. Declared in one place so the two lists cannot drift.
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          IN_REF: ${{ inputs.ref }}
          IN_TAG: ${{ inputs.tag }}
          IN_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUBLISH=true
          else
            TAG="$IN_TAG"
            PUBLISH="${IN_PUBLISH:-false}"
            if [ "$PUBLISH" = true ] && [ -z "$TAG" ]; then
              echo "::error::publish=true requires a tag name."
              exit 1
            fi
            if [ -n "$TAG" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              case "$TAG" in
                # A dev tag arriving by dispatch was allocated by
                # `dev-build.yml`, which allocates by *creating* the tag
                # before dispatching -- that is what stops two merges
                # landing on the same number while a build is in flight.
                # So an existing dev tag is expected here. The tag must
                # still name the commit being built, or this is some
                # other run's number.
                v*-dev.*)
                  AT=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")
                  if [ "$AT" != "$(git rev-parse HEAD)" ]; then
                    echo "::error::dev tag '$TAG' is on $AT, not the commit being built."
                    exit 1
                  fi
                  ;;
                # Anything else is the re-release this guard exists to stop.
                *)
                  echo "::error::tag '$TAG' already exists."
                  exit 1
                  ;;
              esac
            fi
          fi
          SHA=$(git rev-parse HEAD)
          case "$TAG" in
            v*-dev.*) DEV=true ;;
            *)        DEV=false ;;
          esac
          # The branch, recorded as found rather than guessed: a dispatch
          # that names a branch is authoritative; a blank dispatch ran on
          # the selected branch; a tag push, or a dispatch naming a commit,
          # gets a branch containing the commit, the default branch first
          # when more than one does.
          DEFAULT=$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)
          if [ "$EVENT" != push ] && [ -n "$IN_REF" ] && git show-ref -q --verify "refs/remotes/origin/$IN_REF"; then
            BRANCH="$IN_REF"
          elif [ "$EVENT" != push ] && [ -z "$IN_REF" ]; then
            BRANCH="$REF_NAME"
          else
            CONTAINING=$(git branch -r --contains "$SHA" --format='%(refname:lstrip=3)' | grep -vx HEAD || true)
            if [ -n "$DEFAULT" ] && printf '%s\n' "$CONTAINING" | grep -qx "$DEFAULT"; then
              BRANCH="$DEFAULT"
            else
              BRANCH=$(printf '%s\n' "$CONTAINING" | head -1)
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH:-(detached)}" >> "$GITHUB_OUTPUT"
      # The build matrix, declared here so a dev build can be the Linux leg
      # alone: `strategy.matrix` cannot read a job output, but it can be a
      # whole value from one. The setup strings are what the YAML `include`
      # used to hold, comments included.
      - id: matrix
        env:
          DEV: ${{ steps.check.outputs.dev }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          # Static musl: the binary that installs onto any Linux box the way
          # diluvium_linux_static_x86_64 does. `full` is the unprefixed
          # default artifact -- DRT installs as the runtime, and a runtime
          # that cannot serve is the two-binary cliff again; `slim` is the
          # qualified variant for the distribution-size story.
          #
          # CC=musl-gcc matters twice over: diluvium-sys's build script
          # invokes $CC directly (not the cc crate), and without it the C
          # core is compiled by the host glibc gcc -- whose fortify and LFS
          # symbols (__fprintf_chk, fopen64) do not exist in musl, as the
          # first rehearsal proved at link time. The cc-crate users
          # (the bundled sqlite among them) honour the same variable. AR for
          # the same reason as CC, one step later: the build script archives
          # the C core itself, and with no `AR` it asks for
          # `x86_64-unknown-linux-musl-ar`, which `musl-tools` does not ship
          # -- the second rehearsal proved that the way the first proved CC.
          # Binutils `ar` archives musl-gcc's ELF objects; the archiver does
          # not need to be target-specific.
          #
          # Names are doc/ALIGNMENT.md §4's, <os>_<arch>[_<libc>] with the
          # profile last. Releases before v0.6.0-rc.2 spelled them the older
          # way, v0.6.0-rc.2 through v0.7.0-rc.2 carried both spellings for
          # the overlap §4 asks for, and from here only these ship.
          linux = {
              "name": "linux_x86_64_musl",
              "os": "ubuntu-latest",
              "target": "x86_64-unknown-linux-musl",
              "setup": "sudo apt-get update && sudo apt-get install -y musl-tools cmake"
                       " && echo \"CC=musl-gcc\" >> \"$GITHUB_ENV\""
                       " && echo \"AR=ar\" >> \"$GITHUB_ENV\"",
          }
          # Linux arm64, natively on GitHub's arm64 runner rather than
          # cross-compiled from x86_64, so the leg is the x86_64 leg with
          # two fields changed: the binary is built, smoked and gated on
          # the machine that built it, and the C core and the bundled
          # sqlite compile for the host with the host's tools instead of
          # needing a cross C toolchain rehearsed. Static musl like x86_64,
          # so it installs on any 64-bit Linux -- a Raspberry Pi running a
          # 64-bit OS included -- with no glibc version to match.
          arm64 = {
              "name": "linux_arm64_musl",
              "os": "ubuntu-24.04-arm",
              "target": "aarch64-unknown-linux-musl",
              "setup": linux["setup"],
          }
          darwin = [
              {"name": "darwin_arm64", "os": "macos-latest", "target": "aarch64-apple-darwin", "setup": "true"},
              {"name": "darwin_x86_64", "os": "macos-15-intel", "target": "x86_64-apple-darwin", "setup": "true"},
          ]
          # Windows is not in this matrix because its leg is not shaped
          # like these, not because it is short of anything: it is
          # cross-built from Linux with mingw-w64 in `build-windows`
          # below -- `full` and `slim`, the same two every leg here
          # ships -- and then run on a real Windows runner by
          # `smoke-windows`, which is the smoke step these legs do inline.
          # A dev build is the x86_64 leg alone.
          include = [linux] if os.environ["DEV"] == "true" else [linux, arm64] + darwin
          print("matrix=" + json.dumps({"include": include}))
          EOF
      # The changelog is a release gate, not a formality: CHANGELOG.yaml is
      # what the release body and the mirror are generated from, so a tag
      # with no entry -- or an entry still marked unreleased -- would
      # publish an empty description and leave the mirror unable to
      # describe what it is carrying. `--publish` makes the check strict
      # only when something is actually going to the Releases page, so a
      # rehearsal still runs against an `unreleased` entry.
      - name: The changelog describes this tag
        id: changelog
        if: steps.check.outputs.tag != '' && steps.check.outputs.dev != 'true'
        run: |
          pip install --quiet pyyaml
          ./script/changelog.py validate
          ./script/changelog.py check
          ./script/changelog.py release-check --tag '${{ steps.check.outputs.tag }}' \
            ${{ steps.check.outputs.publish == 'true' && '--publish' || '' }} \
            >> "$GITHUB_OUTPUT"
      # A dev build has no entry, by design (doc/ALIGNMENT.md §7): it is one
      # commit in someone's hands, not a release the changelog describes.
      # The file still has to be sound, and the build is always a prerelease.
      - name: A dev build needs no entry
        id: dev
        if: steps.check.outputs.dev == 'true'
        run: |
          pip install --quiet pyyaml
          ./script/changelog.py validate
          ./script/changelog.py check
          echo "prerelease=true" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Core dumps armed in the job that actually fails. A SIGSEGV here has
      # twice cost a release and produced nothing but "signal: 11"; three
      # standalone probes could not reproduce it, so stop probing and
      # instrument the scene. Costs seconds, and turns the next occurrence
      # into a backtrace instead of another round of guessing.
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - run: |
          ulimit -c unlimited
          cargo test --workspace --all-features
      - name: Backtrace any core
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core dump was written (the crash may not have been in a test binary)"
            exit 0
          fi
          for c in "${cores[@]}"; do
            echo "=================== $c ==================="
            exe=$(file "$c" | grep -oP "execfn: '\K[^']+" | head -1)
            echo "execfn: $exe"
            gdb -batch -ex "thread apply all bt" "$exe" "$c" 2>&1 | head -200
          done

  build:
    name: Build (${{ matrix.name }})
    needs: [preflight, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Declared in preflight (its `matrix` step), so a dev build is the
      # Linux leg alone; the platform list and its reasons live there.
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      DRT_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Setup
        run: ${{ matrix.setup }}
      - name: Build full and slim
        run: |
          set -eu
          cargo build --profile release-small -p drt --no-default-features --features full --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release-small/drt drt_${{ matrix.name }}
          cargo build --profile release-small -p drt --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release-small/drt drt_${{ matrix.name }}_slim
      - name: Smoke test
        run: |
          set -eu
          ./drt_${{ matrix.name }} --version
          echo 'local x = 1' > smoke.lua
          ./drt_${{ matrix.name }} run smoke.lua
          ./drt_${{ matrix.name }}_slim run smoke.lua
          # A tagged build names its tag; a rehearsal has none and prints none.
          if [ -n "${DRT_RELEASE_TAG:-}" ]; then
            ./drt_${{ matrix.name }} buildinfo | grep -qx "tag: $DRT_RELEASE_TAG"
          else
            ! ./drt_${{ matrix.name }} buildinfo | grep -q '^tag:'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drt-${{ matrix.name }}
          path: drt_*
          if-no-files-found: error
          retention-days: 30

  build-wasip2:
    # The portable leg (doc/Wasm.md D2): `drt` itself for wasm32-wasip2,
    # the `wasi` profile, run under wasmtime. It proves itself the way the
    # native legs do -- `--version` and `run smoke.lua` -- and then harder:
    # the examples gate runs through `script/drt-wasip2.sh` before the
    # artifact is uploaded, because a wasm artifact nothing ran is the thing
    # this matrix's smoke step exists to prevent (doc/Release.md).
    name: Build (wasip2)
    needs: [preflight, test]
    if: needs.preflight.outputs.dev != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASI_SDK_VERSION: "27.0"
      WASMTIME_VERSION: v48.0.1
      DRT_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      # RUNNER_TEMP is a step-time fact: the `runner` context is not
      # allowed in a job's `env`, and a workflow that reads it there is
      # refused whole, before any job runs -- which is how every push from
      # M1 to M6 reported "failure" with no job to show for it.
      - name: Where the wasi-sdk lives
        run: echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip2
      - name: wasi-sdk, cached
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.WASI_SDK_PATH }}
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
      - name: wasi-sdk, fetched
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          set -eu
          major=${WASI_SDK_VERSION%%.*}
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz"
          mv "$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" "$WASI_SDK_PATH"
      - name: wasmtime
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/wasmtime.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/wasmtime.tar.xz"
          sudo install "$RUNNER_TEMP/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
      - name: Build the wasi profile
        run: |
          set -eu
          cargo build --profile release-small -p drt --no-default-features --features wasi --target wasm32-wasip2
          cp target/wasm32-wasip2/release-small/drt.wasm drt_wasi.wasm
      - name: Smoke test
        run: |
          set -eu
          export DRT_WASM="$PWD/drt_wasi.wasm"
          script/drt-wasip2.sh --version
          echo 'local x = 1' > smoke.lua
          script/drt-wasip2.sh run smoke.lua
          script/drt-wasip2.sh buildinfo | grep -q '^profile: wasi$'
      - name: The examples gate, through wasmtime
        run: |
          set -eu
          export DRT_WASM="$PWD/drt_wasi.wasm"
          cd examples && DRT="$GITHUB_WORKSPACE/script/drt-wasip2.sh" ./run-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drt-wasip2
          path: drt_wasi.wasm
          if-no-files-found: error
          retention-days: 30

  build-web:
    # The browser leg (doc/Wasm.md D3, M4): `drt-web` for
    # wasm32-unknown-unknown, the `web` profile, with the C core and
    # wasi-libc linked in. Proven the way the wasip2 leg is and harder: the
    # browser suite -- the examples gate through the in-page shell, in
    # Chromium, plus the REPL parity check -- runs before the artifact is
    # uploaded. Ships as one tarball, because a page needs all of it: the
    # module, wasm-bindgen's glue, and drt-term.js with shell.js behind it.
    # `buildinfo` is read off the module inside Chromium (run.mjs writes
    # it out) so publish can put the profile in BUILDINFO the same way it
    # does for every other leg: from the bytes, not from YAML.
    name: Build (web)
    needs: [preflight, test]
    # In dev builds too: a browser client is built against a dev build
    # before anything is a candidate, and it needs this tarball to do it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASI_SDK_VERSION: "27.0"
      DRT_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      # RUNNER_TEMP is a step-time fact: the `runner` context is not
      # allowed in a job's `env`, and a workflow that reads it there is
      # refused whole, before any job runs -- which is how every push from
      # M1 to M6 reported "failure" with no job to show for it.
      - name: Where the wasi-sdk lives
        run: echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - name: wasi-sdk, cached
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.WASI_SDK_PATH }}
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
      - name: wasi-sdk, fetched
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          set -eu
          major=${WASI_SDK_VERSION%%.*}
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz"
          mv "$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" "$WASI_SDK_PATH"
      - name: wasm-bindgen-cli, the pinned version
        run: |
          set -eu
          v=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)"/\1/p' crates/drt-web/Cargo.toml)
          curl -fsSL -o "$RUNNER_TEMP/wbg.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wbg.tar.gz"
          sudo install "$RUNNER_TEMP/wasm-bindgen-${v}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/drt-web/browser-test/package-lock.json
      - name: Build the web profile
        run: DRT_WEB_PROFILE=release-small script/drt-web.sh
      - name: The browser suite, in Chromium
        working-directory: crates/drt-web/browser-test
        run: |
          set -eu
          npm ci
          npx playwright install --with-deps chromium
          DRT_WEB_BUILDINFO="$GITHUB_WORKSPACE/drt_web.buildinfo.txt" npm test
          grep -q '^profile: web$' "$GITHUB_WORKSPACE/drt_web.buildinfo.txt"
      - name: Package
        run: |
          set -eu
          mkdir drt_web
          pkg=crates/drt-web/browser-test
          cp "$pkg/pkg/drt_web.js" "$pkg/pkg/drt_web_bg.wasm" "$pkg/pkg/drt_web.d.ts" \
             "$pkg/pkg/drt_web_bg.wasm.d.ts" "$pkg/drt-term.js" "$pkg/shell.js" drt_web/
          tar -czf drt_web.tar.gz drt_web
      - uses: actions/upload-artifact@v4
        with:
          name: drt-web
          path: |
            drt_web.tar.gz
            drt_web.buildinfo.txt
          if-no-files-found: error
          retention-days: 30

  build-client:
    # The browser access client library (crates/drt-rtc/client/): the
    # browser half of doc/BrowserAccess.md, one ES module and its types.
    # In dev builds too, for the same reason as build-web: a browser
    # client is built against a dev build before anything is a candidate.
    # Plain JavaScript with no build step, so "building" it is proving it:
    # the unit tests against the shared vectors, then Chromium driving it
    # against a real host, and only then the files the tests ran.
    name: Build (browser access client)
    needs: [preflight, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser-access-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/drt-web/browser-test/package-lock.json
      - name: Playwright, and its Chromium
        working-directory: crates/drt-web/browser-test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: The client's gate, and the package
        run: script/browser-access-client.sh --package dist
      - uses: actions/upload-artifact@v4
        with:
          name: drt-browser-access
          path: |
            dist/drt_browser_access.js
            dist/drt_browser_access.d.ts
          if-no-files-found: error
          retention-days: 30

  build-windows:
    # The Windows leg, for x86_64-pc-windows-gnu, cross-built from Linux
    # with mingw-w64 the way doc/Platforms.md said to rehearse it. Cross
    # rather than native for two reasons that are the same reason:
    # diluvium-sys drives a GCC-style compiler and refuses MSVC by name,
    # and on a Linux host it derives `x86_64-w64-mingw32-gcc` from the
    # target triple itself, so the build needs nothing told to it that the
    # linux_static leg does not also need.
    #
    # Two binaries, and they are the two every native leg ships: `full`
    # and `slim`. `full` was out of reach here for one connector's sake --
    # `exec` opened with a `compile_error!` naming itself unix-only -- so
    # the unprefixed artifact used to be a `windows` profile, `full` minus
    # that one connector. What the refusal was really about was the kill:
    # a deadline has to sweep everything the child started, and a process
    # group is not a thing Windows has. `drt_platform::process::Tree`
    # spells that per target -- a process group on unix, a Job Object with
    # kill-on-close there -- and with it `exec` cross-builds like
    # everything else. So the profile is gone and Windows builds `full`,
    # and the unprefixed `drt_windows_x86_64.exe` is `full`:
    # doc/ALIGNMENT.md §4 makes the unprefixed name the largest profile a
    # platform gets, and on Windows that is now simply `full`, with
    # nothing left to qualify. `drt_windows_x86_64_slim.exe` is `slim`,
    # the distribution-size profile, as on every other platform.
    #
    # Everything `full` carries cross-builds with mingw-w64 alone, and
    # that has been true since ego-transport 0.1.4 put russh on `ring` and
    # took aws-lc-sys out of the tree: before that `stun`, `netcheck`,
    # `turn` and `ssh` reached it through russh's default backend, and its
    # windows-gnu build wanted NASM on this leg.
    #
    # A cross-built binary cannot be run here, and a binary nothing ran is
    # what the smoke steps exist to prevent -- so both are uploaded and
    # then run for real in `smoke-windows`, on a Windows runner.
    name: Build (windows_x86_64)
    needs: [preflight, test]
    if: needs.preflight.outputs.dev != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRT_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows_x86_64
      - name: mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build full and slim
        run: |
          set -eu
          cargo build --profile release-small -p drt --target x86_64-pc-windows-gnu --no-default-features --features full
          cp target/x86_64-pc-windows-gnu/release-small/drt.exe drt_windows_x86_64.exe
          cargo build --profile release-small -p drt --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release-small/drt.exe drt_windows_x86_64_slim.exe
          file drt_windows_x86_64.exe | grep -q 'PE32+ executable'
          file drt_windows_x86_64_slim.exe | grep -q 'PE32+ executable'
      - uses: actions/upload-artifact@v4
        with:
          name: drt-windows_x86_64
          path: |
            drt_windows_x86_64.exe
            drt_windows_x86_64_slim.exe
          if-no-files-found: error
          retention-days: 30

  smoke-windows:
    # The Windows binaries, run on Windows: the same three checks the
    # native legs make on themselves, and then the examples gate, which is
    # the conformance oracle on every other target and is one here too.
    # Git Bash is the shell because run-all.sh is bash and the examples'
    # own demo.sh files are too; the runner ships it, with the coreutils,
    # sed, diff and curl the gate needs. Every example a binary can run
    # runs on it, and the unprefixed binary is `full` now, so that is
    # every example whose `needs_build` names `full`: the tunnel, relay,
    # STUN, TURN, WireGuard, ssh, sql, rest and mail examples are driven
    # here, on Windows, and so is `00-install-methods`, which snapshots
    # `full`'s own `buildinfo` and was skipped for as long as this binary
    # was a different profile.
    #
    # Two stay behind, and neither for the profile's sake. `16-exec` is
    # marked `needs_unix` in its meta.json: the example is written in
    # unix's own vocabulary (`sh -c`, `cat`, `yes`, `ls`), and no argument
    # to run-all.sh can give a Windows host a /bin/sh, even though the
    # connector it teaches now builds and runs here. The connector is
    # covered on this platform by `cargo test` instead, in ci.yml's
    # `windows` job, which is where a contract both platforms answer
    # belongs -- an example has one transcript to print, and that
    # transcript is unix's. `22-wireguard-interface` needs a privilege,
    # which is what holds it off every runner, and on Windows it needs
    # wintun.dll as well.
    name: Smoke (windows_x86_64)
    needs: [preflight, build-windows]
    if: needs.preflight.outputs.dev != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DRT_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: drt-windows_x86_64
      - name: Smoke test, both binaries
        run: |
          set -eu
          echo 'local x = 1' > smoke.lua
          for exe in drt_windows_x86_64.exe drt_windows_x86_64_slim.exe; do
            ./$exe --version
            ./$exe run smoke.lua
            # A tagged build names its tag; a rehearsal has none and prints none.
            if [ -n "${DRT_RELEASE_TAG:-}" ]; then
              ./$exe buildinfo | grep -qx "tag: $DRT_RELEASE_TAG"
            else
              ! ./$exe buildinfo | grep -q '^tag:'
            fi
          done
          ./drt_windows_x86_64.exe buildinfo | grep -qx 'profile: full'
          ./drt_windows_x86_64_slim.exe buildinfo | grep -qx 'profile: slim'
          # The one thing `wg` can do with no peer, no privilege and no
          # wintun.dll: a key pair, and its public half derived again from
          # the private one over stdin. The examples gate below drives the
          # rest on loopback; the interface half needs wintun.dll, which
          # the runner does not have.
          keys=$(./drt_windows_x86_64.exe wg keygen)
          [ "$(printf '%s\n' "$keys" | wc -l)" -eq 2 ]
          derived=$(printf '%s\n' "$keys" | head -1 | ./drt_windows_x86_64.exe wg pubkey)
          [ "$derived" = "$(printf '%s\n' "$keys" | sed -n 2p)" ]
      - name: What the Windows binary carries, read off the artifact
        # publish runs on Linux and cannot ask a PE32+ binary anything; the
        # answer it gave here, on Windows, travels as a file the way the
        # browser module's does (build-web), and lands in the release
        # beside it as `drt_windows.buildinfo.txt`.
        run: ./drt_windows_x86_64.exe buildinfo > drt_windows.buildinfo.txt
      - uses: actions/upload-artifact@v4
        with:
          name: drt-windows_x86_64-buildinfo
          path: drt_windows.buildinfo.txt
          if-no-files-found: error
          retention-days: 30
      - name: The examples gate, on Windows, both binaries
        run: |
          set -eu
          cd examples
          DRT="$GITHUB_WORKSPACE/drt_windows_x86_64.exe" ./run-all.sh
          DRT="$GITHUB_WORKSPACE/drt_windows_x86_64_slim.exe" ./run-all.sh

  publish:
    name: Publish release
    needs: [preflight, test, build, build-wasip2, build-web, build-client, build-windows, smoke-windows]
    # A dev build skips the three cross-target legs (wasip2 and the two
    # Windows jobs), and a job whose `needs` were skipped is skipped itself
    # unless it says otherwise. So this says otherwise, and checks by hand
    # what the default would have: nothing was cancelled, the suite, the
    # Linux leg, the web leg and the client passed, and either this is a
    # dev build or every other leg passed too.
    if: >-
      !cancelled()
      && needs.preflight.outputs.publish == 'true'
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && needs.build-web.result == 'success'
      && needs.build-client.result == 'success'
      && (needs.preflight.outputs.dev == 'true'
          || (needs.build-wasip2.result == 'success'
              && needs.build-windows.result == 'success'
              && needs.smoke-windows.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: drt-*
          path: release_dist
          merge-multiple: true
      # The wasip2 artifact answers `buildinfo` too, from inside wasmtime,
      # so its connector set is read off the bytes like the native ones'.
      - name: wasmtime, to ask the wasip2 artifact what it carries
        env:
          WASMTIME_VERSION: v48.0.1
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/wasmtime.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/wasmtime.tar.xz"
          sudo install "$RUNNER_TEMP/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
      - name: BUILDINFO and checksums
        run: |
          set -eu
          cd release_dist
          # install.sh ships as a release asset so the curl|sh front door has
          # a URL that exists without any server-side work:
          #   $GITHUB/releases/latest/download/install.sh
          # The mirror stays the preferred front door once it carries the drt
          # namespace; this is the one that works the day a release lands.
          # `..` is the checkout root from here, the same way the Cargo.lock
          # read below reaches it; before the `cd` it was one level ABOVE the
          # workspace, so this cp failed the step under `set -eu`.
          cp ../install.sh install.sh
          # Pin the shipped copy to THIS release. A script served from
          # `<tag>/install.sh` that installs `latest` names one version in
          # its URL and fetches another, which is how someone ends up with
          # v0.4.2 believing they pinned a candidate. The grep is the point
          # of the step: a sed that silently matched nothing would publish
          # exactly the lying script this replaces.
          STAMP_TAG='${{ needs.preflight.outputs.tag }}'
          sed -i "s|^STAMPED_VERSION=.*|STAMPED_VERSION=$STAMP_TAG|" install.sh
          grep -qx "STAMPED_VERSION=$STAMP_TAG" install.sh || {
            echo "::error::install.sh was not stamped with '$STAMP_TAG'" >&2
            exit 1
          }
          # Asked of the artifact rather than guessed in YAML. The linux
          # x86_64 binaries are native here, so they can report the dv ABI
          # they actually speak and the connectors actually compiled in;
          # the darwin and linux arm64 binaries cannot be run on this
          # runner, but every native leg is the same cargo feature set, so
          # the profile lines describe them all.
          chmod +x drt_linux_x86_64_musl drt_linux_x86_64_musl_slim || true
          # Read the plain form, not the JSON: `connectors` is a list, and a
          # sed that stops at the first comma silently reports only its
          # first element — which is exactly what a dry run of the JSON
          # version produced here.
          bi() { ./"$1" buildinfo 2>/dev/null | sed -n "s/^$2: //p" ; }
          # Read off the artifact too, and for the same reason. It used to
          # be grepped out of ../Cargo.lock, which put the fact beside the
          # bytes rather than in them: a binary someone copied off a machine
          # could not say which diluvium was inside it. `drt buildinfo` now
          # answers, stamped at build time (crates/drt/build.rs).
          #
          # This has to sit BELOW the chmod above -- above it the binary is
          # not executable yet, the read fails silently, and the fallback
          # takes every time while looking like it never does.
          DILUVIUM_REV=$(bi drt_linux_x86_64_musl diluvium)
          if [ -z "${DILUVIUM_REV:-}" ] || [ "$DILUVIUM_REV" = unknown ]; then
            DILUVIUM_REV=$( (grep -A2 'name = "diluvium"' ../Cargo.lock || true) | sed -n 's/.*#\([0-9a-f]*\)".*/\1/p' | head -1)
          fi
          DV_ABI=$(bi drt_linux_x86_64_musl dv_abi)
          # The build number beside the revision: the revision is exact but
          # unordered, and a `requires.diluvium_version` range needs one
          # that orders. Read off the artifact for the same reason the
          # revision is.
          # Read off the artifact for the same reason the revision is.
          DILUVIUM_VERSION=$(bi drt_linux_x86_64_musl diluvium_version)
          FULL_CONNECTORS=$(bi drt_linux_x86_64_musl connectors)
          SLIM_CONNECTORS=$(bi drt_linux_x86_64_musl_slim connectors)
          # What the core inside each profile carries. Same question as the
          # connector list, one level down: `dv_abi` says which ABI the core
          # speaks, this says what is reachable through it.
          FULL_FEATURES=$(bi drt_linux_x86_64_musl features)
          SLIM_FEATURES=$(bi drt_linux_x86_64_musl_slim features)
          # The wasip2 component runs under wasmtime; same question, same
          # answer format, read off the artifact (doc/Wasm.md D2).
          WASI_CONNECTORS=$(wasmtime run -W exceptions=y ./drt_wasi.wasm buildinfo 2>/dev/null | sed -n 's/^connectors: //p')
          WASI_FEATURES=$(wasmtime run -W exceptions=y ./drt_wasi.wasm buildinfo 2>/dev/null | sed -n 's/^features: //p')
          # The browser module answered `buildinfo` inside Chromium in the
          # build-web job, which wrote the answer beside the tarball; that
          # is as close to "read off the artifact" as a page gets.
          WEB_CONNECTORS=$(sed -n 's/^connectors: //p' drt_web.buildinfo.txt 2>/dev/null || true)
          WEB_FEATURES=$(sed -n 's/^features: //p' drt_web.buildinfo.txt 2>/dev/null || true)
          # The Windows binaries answered on a Windows runner in
          # smoke-windows, which wrote the answer beside the binary for the
          # same reason: this job runs on Linux and cannot ask a PE32+
          # binary anything.
          WINDOWS_CONNECTORS=$(sed -n 's/^connectors: //p' drt_windows.buildinfo.txt 2>/dev/null || true)
          WINDOWS_FEATURES=$(sed -n 's/^features: //p' drt_windows.buildinfo.txt 2>/dev/null || true)
          # The five lines every Aloecraft release carries (doc/ALIGNMENT.md
          # §5), then this project's own facts. `version` is the tag body:
          # the tag is canonical and this is its one derived spelling.
          TAG='${{ needs.preflight.outputs.tag }}'
          {
            echo "tag: $TAG"
            echo "version: ${TAG#v}"
            echo "commit: ${{ needs.preflight.outputs.sha }}"
            echo "branch: ${{ needs.preflight.outputs.branch }}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "diluvium: ${DILUVIUM_REV:-unknown}"
            # The ABI the embedded core speaks. This is what a package's
            # `requires.dv_abi` is checked against, so it belongs in the
            # release rather than being inferred from the diluvium rev.
            echo "dv_abi: ${DV_ABI:-unknown}"
            echo "diluvium_version: ${DILUVIUM_VERSION:-unknown}"
            # Which binary carries what. `full` and `slim` differ precisely
            # in their connector set, so a package declaring
            # `requires.connectors` can be admitted or refused by name
            # instead of by guessing from the artifact filename.
            echo "profile.full.connectors: ${FULL_CONNECTORS:-unknown}"
            echo "profile.slim.connectors: ${SLIM_CONNECTORS:-unknown}"
            # `drt_windows_x86_64.exe` is `full` (see build-windows):
            # there is no `windows` profile any more, and this key names
            # the platform rather than a profile. It stays because the two
            # lines are two measurements and not one repeated:
            # `profile.full.connectors` above was read off the linux musl
            # binary on this runner, and this was read off the PE32+
            # binary by a Windows runner in smoke-windows, before it was
            # allowed here. They should now say the same thing, and a
            # release where they do not is a release that says so.
            # `drt_windows_x86_64_slim.exe` is the slim feature set, and
            # the line above describes it.
            echo "profile.windows.connectors: ${WINDOWS_CONNECTORS:-unknown}"
            # `drt_wasi.wasm`: run it with
            #   wasmtime run -W exceptions=y --dir . drt_wasi.wasm run app.dlua
            echo "profile.wasi.connectors: ${WASI_CONNECTORS:-unknown}"
            # `drt_web.tar.gz`: drt_web_bg.wasm, drt_web.js, drt-term.js and
            # shell.js -- attach it to a terminal per doc/Browser.md.
            echo "profile.web.connectors: ${WEB_CONNECTORS:-unknown}"
            # And what the core inside each of those carries. A package
            # declaring `requires.features` -- `numeric`, when it lands --
            # is admitted or refused against these by name, the same way
            # `requires.connectors` is against the four lines above.
            echo "profile.full.features: ${FULL_FEATURES:-unknown}"
            echo "profile.slim.features: ${SLIM_FEATURES:-unknown}"
            echo "profile.windows.features: ${WINDOWS_FEATURES:-unknown}"
            echo "profile.wasi.features: ${WASI_FEATURES:-unknown}"
            echo "profile.web.features: ${WEB_FEATURES:-unknown}"
          } > BUILDINFO.txt
          # Every other asset, install.sh and the web buildinfo included
          # (doc/ALIGNMENT.md §6): the mirror verifies each file it carries
          # against this, and a file it cannot find here is one it cannot
          # vouch for. Generated last, so it does not list itself.
          sha256sum -- * > SHA256SUMS.txt
          cat BUILDINFO.txt SHA256SUMS.txt
      # The release body is the changelog's, not GitHub's autogenerated
      # commit list. CHANGELOG.yaml is the source of truth for release
      # notes (doc/Release.md), and a body derived from commit subjects
      # says what changed in the repository rather than what changed for
      # the person installing it.
      - name: Release notes, from the changelog
        if: needs.preflight.outputs.dev != 'true'
        run: |
          set -eu
          pip install --quiet pyyaml
          ./script/changelog.py render md --tag '${{ needs.preflight.outputs.tag }}' \
            > release_notes.md
          cat release_notes.md
      # A dev build's body says what it is and where its facts are; there
      # is no entry to render.
      - name: Release notes for a dev build
        if: needs.preflight.outputs.dev == 'true'
        run: |
          set -eu
          {
            echo "A dev build (doc/ALIGNMENT.md §7): commit \`${{ needs.preflight.outputs.sha }}\` on \`${{ needs.preflight.outputs.branch }}\`, the suite, the Linux build, the web build (\`drt_web.tar.gz\`) and the browser access client (\`drt_browser_access.js\`), no changelog entry."
            echo
            echo "Not a release. \`BUILDINFO.txt\` says what is inside. Pin a candidate or a release for anything that has to keep working; the ten newest dev builds are kept and older ones are pruned."
          } > release_notes.md
          cat release_notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.sha }}
          name: DRT ${{ needs.preflight.outputs.tag }}
          files: release_dist/*
          body_path: release_notes.md
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
      # Dev builds are disposable (doc/ALIGNMENT.md §7): keep the newest
      # DEV_KEEP, delete the rest with their tags. A dev build worth keeping
      # is worth an rc.
      - name: Prune old dev releases
        if: needs.preflight.outputs.dev == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEV_KEEP: 10
        run: |
          set -eu
          gh release list --limit 200 --json tagName,createdAt \
              --jq '.[] | "\(.createdAt)\t\(.tagName)"' \
            | { grep -E $'\tv[^\t]*-dev\\.[0-9]+$' || true; } \
            | sort -r | tail -n "+$((DEV_KEEP + 1))" | cut -f2 \
            | while read -r t; do
                echo "pruning $t"
                gh release delete "$t" --yes --cleanup-tag < /dev/null
              done
