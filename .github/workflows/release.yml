name: Release

# Builds and (optionally) publishes a DRT release for one specific commit.
# The shape is diluvium's release.yml, kept deliberately: tag push publishes;
# a manual run is a full rehearsal by default — tests, every platform,
# artifacts on the run — and touches the Releases page only when publish=true.
#
# DRT versions independently of diluvium. The coupling is RECORDED, not
# required: BUILDINFO.txt in every release names the diluvium git revision
# this binary embeds and the dv ABI version it speaks, so "which diluvium is
# inside" is a fact you read off the release, never a tag-naming convention.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to release (blank = the selected branch)'
        type: string
        required: false
        default: ''
      tag:
        description: 'Tag name, e.g. v0.1.0 (required when publishing)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish to the Releases page. Leave off for a rehearsal.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      # Derived from the changelog's `stable`, which is the truth; GitHub's
      # flag is downstream of it.
      prerelease: ${{ steps.changelog.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUBLISH=true
          else
            TAG="$IN_TAG"
            PUBLISH="${IN_PUBLISH:-false}"
            if [ "$PUBLISH" = true ] && [ -z "$TAG" ]; then
              echo "::error::publish=true requires a tag name."
              exit 1
            fi
            if [ -n "$TAG" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::tag '$TAG' already exists."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The changelog is a release gate, not a formality: CHANGELOG.yaml is
      # what the release body and the mirror are generated from, so a tag
      # with no entry -- or an entry still marked unreleased -- would
      # publish an empty description and leave the mirror unable to
      # describe what it is carrying. `--publish` makes the check strict
      # only when something is actually going to the Releases page, so a
      # rehearsal still runs against an `unreleased` entry.
      - name: The changelog describes this tag
        id: changelog
        if: steps.check.outputs.tag != ''
        run: |
          pip install --quiet pyyaml
          ./script/changelog.py validate
          ./script/changelog.py check
          ./script/changelog.py release-check --tag '${{ steps.check.outputs.tag }}' \
            ${{ steps.check.outputs.publish == 'true' && '--publish' || '' }} \
            >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Core dumps armed in the job that actually fails. A SIGSEGV here has
      # twice cost a release and produced nothing but "signal: 11"; three
      # standalone probes could not reproduce it, so stop probing and
      # instrument the scene. Costs seconds, and turns the next occurrence
      # into a backtrace instead of another round of guessing.
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - run: |
          ulimit -c unlimited
          cargo test --workspace --all-features
      - name: Backtrace any core
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core dump was written (the crash may not have been in a test binary)"
            exit 0
          fi
          for c in "${cores[@]}"; do
            echo "=================== $c ==================="
            exe=$(file "$c" | grep -oP "execfn: '\K[^']+" | head -1)
            echo "execfn: $exe"
            gdb -batch -ex "thread apply all bt" "$exe" "$c" 2>&1 | head -200
          done

  build:
    name: Build (${{ matrix.name }})
    needs: [preflight, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl: the binary that installs onto any Linux box the
          # way diluvium_linux_static_x86_64 does. `full` is the unprefixed
          # default artifact — DRT installs as the runtime, and a runtime
          # that cannot serve is the two-binary cliff again; `slim` is the
          # qualified variant for the distribution-size story.
          - name: linux_static_x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # CC=musl-gcc matters twice over: diluvium-sys's build script
            # invokes $CC directly (not the cc crate), and without it the C
            # core is compiled by the host glibc gcc — whose fortify and
            # LFS symbols (__fprintf_chk, fopen64) do not exist in musl, as
            # the first rehearsal proved at link time. The cc-crate users
            # (aws-lc-sys, bundled sqlite) honour the same variable.
            setup: >-
              sudo apt-get update && sudo apt-get install -y musl-tools cmake
              && echo "CC=musl-gcc" >> "$GITHUB_ENV"
          - name: darwin_arm64
            os: macos-latest
            target: aarch64-apple-darwin
            setup: 'true'
          - name: darwin_x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            setup: 'true'
          # linux aarch64 and windows are next, not promised: the full
          # profile carries aws-lc-sys through russh, and cross-compiling
          # that is a job to rehearse, not to assume.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Setup
        run: ${{ matrix.setup }}
      - name: Build full and slim
        run: |
          set -eu
          cargo build --profile release-small -p drt --no-default-features --features full --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release-small/drt drt_${{ matrix.name }}
          cargo build --profile release-small -p drt --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release-small/drt drt_slim_${{ matrix.name }}
      - name: Smoke test
        run: |
          set -eu
          ./drt_${{ matrix.name }} --version
          echo 'local x = 1' > smoke.lua
          ./drt_${{ matrix.name }} run smoke.lua
          ./drt_slim_${{ matrix.name }} run smoke.lua
      - uses: actions/upload-artifact@v4
        with:
          name: drt-${{ matrix.name }}
          path: drt_*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: [preflight, test, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: drt-*
          path: release_dist
          merge-multiple: true
      - name: BUILDINFO and checksums
        run: |
          set -eu
          cd release_dist
          # install.sh ships as a release asset so the curl|sh front door has
          # a URL that exists without any server-side work:
          #   $GITHUB/releases/latest/download/install.sh
          # The mirror stays the preferred front door once it carries the drt
          # namespace; this is the one that works the day a release lands.
          # `..` is the checkout root from here, the same way the Cargo.lock
          # read below reaches it; before the `cd` it was one level ABOVE the
          # workspace, so this cp failed the step under `set -eu`.
          cp ../install.sh install.sh
          # Asked of the artifact rather than guessed in YAML. The linux
          # binaries are native here, so they can report the dv ABI they
          # actually speak and the connectors actually compiled in; a
          # cross-built darwin binary cannot be run, but both are the same
          # cargo feature set, so the profile lines describe both.
          chmod +x drt_linux_static_x86_64 drt_slim_linux_static_x86_64 || true
          # Read the plain form, not the JSON: `connectors` is a list, and a
          # sed that stops at the first comma silently reports only its
          # first element — which is exactly what a dry run of the JSON
          # version produced here.
          bi() { ./"$1" buildinfo 2>/dev/null | sed -n "s/^$2: //p" ; }
          # Read off the artifact too, and for the same reason. It used to
          # be grepped out of ../Cargo.lock, which put the fact beside the
          # bytes rather than in them: a binary someone copied off a machine
          # could not say which diluvium was inside it. `drt buildinfo` now
          # answers, stamped at build time (crates/drt/build.rs).
          #
          # This has to sit BELOW the chmod above -- above it the binary is
          # not executable yet, the read fails silently, and the fallback
          # takes every time while looking like it never does.
          DILUVIUM_REV=$(bi drt_linux_static_x86_64 diluvium)
          if [ -z "${DILUVIUM_REV:-}" ] || [ "$DILUVIUM_REV" = unknown ]; then
            DILUVIUM_REV=$( (grep -A2 'name = "diluvium"' ../Cargo.lock || true) | sed -n 's/.*#\([0-9a-f]*\)".*/\1/p' | head -1)
          fi
          DV_ABI=$(bi drt_linux_static_x86_64 dv_abi)
          FULL_CONNECTORS=$(bi drt_linux_static_x86_64 connectors)
          SLIM_CONNECTORS=$(bi drt_slim_linux_static_x86_64 connectors)
          {
            echo "tag: ${{ needs.preflight.outputs.tag }}"
            echo "commit: ${{ needs.preflight.outputs.sha }}"
            echo "diluvium: ${DILUVIUM_REV:-unknown}"
            # The ABI the embedded core speaks. This is what a package's
            # `requires.dv_abi` is checked against, so it belongs in the
            # release rather than being inferred from the diluvium rev.
            echo "dv_abi: ${DV_ABI:-unknown}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Which binary carries what. `full` and `slim` differ precisely
            # in their connector set, so a package declaring
            # `requires.connectors` can be admitted or refused by name
            # instead of by guessing from the artifact filename.
            echo "profile.full.connectors: ${FULL_CONNECTORS:-unknown}"
            echo "profile.slim.connectors: ${SLIM_CONNECTORS:-unknown}"
          } > BUILDINFO.txt
          sha256sum drt_* BUILDINFO.txt > SHA256SUMS.txt
          cat BUILDINFO.txt SHA256SUMS.txt
      # The release body is the changelog's, not GitHub's autogenerated
      # commit list. CHANGELOG.yaml is the source of truth for release
      # notes (doc/Release.md), and a body derived from commit subjects
      # says what changed in the repository rather than what changed for
      # the person installing it.
      - name: Release notes, from the changelog
        run: |
          set -eu
          pip install --quiet pyyaml
          ./script/changelog.py render md --tag '${{ needs.preflight.outputs.tag }}' \
            > release_notes.md
          cat release_notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.sha }}
          name: DRT ${{ needs.preflight.outputs.tag }}
          files: release_dist/*
          body_path: release_notes.md
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
