name: ci

on:
  push:
    # `main` for when there is one; the working branch is the trunk in
    # practice today, and a trunk whose pushes are never checked is a CI
    # config that agrees with itself and nothing else.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  guarantees:
    # SPEC.md §11: GUARANTEES.md is maintained from day one, CI-checked for
    # presence. The list only grows deliberately; losing the file is a break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GUARANTEES.md is present and non-empty
        run: test -s GUARANTEES.md

  canonical-json:
    # consent.md acceptance 6, and it cannot be satisfied by one job.
    # `serde_json`'s `preserve_order` feature swaps `Map`'s backing store from
    # `BTreeMap` to `IndexMap`, and cargo unifies features across a workspace:
    # dollup's workspace enables it, drt's does not. So the same canonicalizer,
    # shared by both, sees two key orders, and each repository's suite passes
    # in isolation while signatures fail between them. The canonicalizer sorts
    # structurally for exactly that reason; these two runs are what prove it,
    # and `_preserve-order-test` exists only to put this job in dollup's state.
    #
    # Cheap on purpose: one crate, no C core, so it answers in seconds and
    # fails loudly rather than riding along in a twenty-minute matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Canonical JSON, preserve_order off (drt's workspace)
        run: cargo test -p drt-config
      - name: Canonical JSON, preserve_order on (dollup's workspace)
        run: cargo test -p drt-config --features _preserve-order-test
      # The browser tier builds without the consent feature, because a page is
      # always on the no-root path. Checked here so "slim keeps it, web drops
      # it" stays a fact rather than an intention.
      - name: Builds without the consent feature (the web carve-out)
        run: cargo check -p drt-config --no-default-features

  features:
    # Every shipping feature, alone. The gap this closes had been open the
    # whole time: CI built `default` and `--all-features` and nothing
    # between, so `--features stun` -- a profile Cargo.toml advertises, and
    # the one a deployment running only the STUN server would pick -- did
    # not compile at all and no job was in a position to notice. The same
    # slip had already been found twice by hand (`turn-client`, then this).
    #
    # One feature at a time, not a full power set: the defect is always a
    # gate naming a feature that does not imply what the code behind it
    # needs, and a lone feature is where that shows. Combinations are
    # covered by `--all-features` above.
    #
    # `wireguard` is absent on purpose -- gotatun needs a newer rustc than
    # the rest of this matrix pins, and `--all-features` in the release
    # workflow is where it is built.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - slim
          - cli
          - listen
          - runtime
          - connector-time
          - connector-fs
          - connector-sql
          - connector-crypto
          - connector-rest
          - connector-ssmtp
          - connector-ssh
          - connector-exec
          - connector-data
          - tunnel
          - relay
          - stun
          - netcheck
          - turn
          - turn-client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--no-default-features` so the feature under test is the only thing
      # on beyond what it pulls in itself. With defaults left on, `slim`
      # would satisfy half of these gates and the job would prove nothing.
      - name: cargo check -p drt --features ${{ matrix.feature }}
        run: cargo check -p drt --all-targets --no-default-features --features ${{ matrix.feature }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      # The profile that actually covers the code: `cargo test --workspace`
      # builds `drt` with its DEFAULT feature (slim), so relay, tunnel, ssh
      # and sql — and every test gated on them — were never compiled here,
      # let alone run. The release workflow tests --all-features and so
      # caught a failure this job structurally could not see. Two profiles,
      # because a suite that runs one of them is a suite with a blind spot.
      # Cores armed here too, not just in release.yml. The SIGSEGV that
      # has cost two releases turned up in this job on 2026-08-28, in the
      # `stun` test binary — a binary written that afternoon, which is
      # what proved it is not host_lua-specific. It has never reproduced
      # locally, so the only place a backtrace will ever come from is the
      # job where it happens. Costs seconds.
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: Test (all features)
        run: |
          ulimit -c unlimited
          cargo test --workspace --all-features
      - name: Backtrace any core
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core dump was written (the failure may not have been a crash)"
            exit 0
          fi
          for c in "${cores[@]}"; do
            echo "=================== $c ==================="
            exe=$(file "$c" | grep -oP "execfn: '\K[^']+" | head -1)
            echo "execfn: $exe"
            gdb -batch -ex "thread apply all bt" "$exe" "$c" 2>&1 | head -200
          done
      # The examples gate, on a NATIVE full build. It ran in `browser` and
      # `wasip2` and nowhere else, and neither can run an example marked
      # `needs_build: full` -- so the eleven examples that exercise sql,
      # ssh, rest, ssmtp, exec, netcheck, stun, tunnel and relay were
      # gated on no target at all. Three of them were silently stale on
      # main when this step was added: two from a help-text change and one
      # from a new verb, both of which change output every full build
      # prints and neither of which any job could see. The gate is the
      # conformance oracle on every other target; this is the target it
      # was written for.
      #
      # `--features full` rather than `--all-features`: the same set as far as
      # `enabled_features` can see -- it probes neither `wasi` nor `web` -- and
      # it is what a release ships, so the gate runs the binary a user gets.
      #
      # What actually made this step skip the fifteen examples it exists to
      # run was a missing probe: PROFILE_FULL gained `turn-client` and
      # `enabled_features` did not, so no build could report `profile: full`
      # and `run-all.sh` skipped every `needs_build: full` example. It said
      # `custom` and nothing was red, which is how two examples calling
      # removed verbs survived three CI runs.
      # `every_profile_name_is_a_feature_the_binary_probes` is the guard.
      - name: The examples gate, natively
        run: |
          set -eu
          cargo build --release --features full
          cd examples && DRT="$GITHUB_WORKSPACE/target/release/drt" ./run-all.sh
      - name: Build without default features
        run: cargo build --workspace --no-default-features

  changelog:
    # CHANGELOG.yaml is the source of truth; CHANGELOG.md and changelog.json
    # are generated and COMMITTED, because the release mirror runs on a host
    # with a stdlib-only Python and no build step and reads changelog.json
    # directly. `check` is what stops that committed copy going stale, and
    # `consistency` is what stops the tree's version drifting away from the
    # newest entry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - run: ./script/changelog.py validate
      - run: ./script/changelog.py check
      - run: ./script/changelog.py consistency

  browser:
    # The browser tier (doc/Wasm.md D3, M4): `drt-web` for
    # wasm32-unknown-unknown with the C core and wasi-libc linked in, the
    # glue from the wasm-bindgen CLI the crate pins, and the examples gate
    # run in Chromium through the in-page shell
    # (crates/drt-web/browser-test/run.mjs) -- the same expected.txt that
    # gates the native binary and the wasmtime build. The REPL parity
    # check rides along: the lines in repl-script.txt typed at drt-term.js
    # must produce what the native `drt repl` produced for them.
    #
    # The crate's native half -- tests/term.rs over the rlib -- runs in
    # `test` with the rest of the workspace; this job is the browser.
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "27.0"
    steps:
      - uses: actions/checkout@v4
      # RUNNER_TEMP is a step-time fact: the `runner` context is not
      # allowed in a job's `env`, and a workflow that reads it there is
      # refused whole, before any job runs -- which is how every push from
      # M1 to M6 reported "failure" with no job to show for it.
      - name: Where the wasi-sdk lives
        run: echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - name: wasi-sdk, cached
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.WASI_SDK_PATH }}
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
      - name: wasi-sdk, fetched
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          set -eu
          major=${WASI_SDK_VERSION%%.*}
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz"
          mv "$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" "$WASI_SDK_PATH"
      # The CLI's version is read off the crate's pin, so the two cannot
      # drift apart in this file; script/drt-web.sh checks them against
      # each other again before it runs.
      - name: wasm-bindgen-cli, the pinned version
        run: |
          set -eu
          v=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)"/\1/p' crates/drt-web/Cargo.toml)
          curl -fsSL -o "$RUNNER_TEMP/wbg.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wbg.tar.gz"
          sudo install "$RUNNER_TEMP/wasm-bindgen-${v}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/drt-web/browser-test/package-lock.json
      # The profile the release builds, so this job gates the artifact that
      # ships rather than a near neighbour of it. They diverged once, and a
      # release-only failure (`strip` hiding the externref table from
      # wasm-bindgen) reached a rehearsal because nothing here built what
      # the release does.
      - name: Build the module and its glue
        run: DRT_WEB_PROFILE=release-small script/drt-web.sh
      - name: Playwright, and its Chromium
        working-directory: crates/drt-web/browser-test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: The examples gate, in Chromium
        working-directory: crates/drt-web/browser-test
        run: npm test

  wasip2:
    # The portable build (doc/Wasm.md D2, M1): `drt` itself, for
    # wasm32-wasip2, run under wasmtime. Proven by the examples gate rather
    # than by `--version` alone, because the gate is what exercises the
    # connectors and the C core, and it already exists: every example that
    # needs no `full`-only verb passes here unchanged (doc/Wasm.md §2.2).
    #
    # The wasi-sdk is the C toolchain for the core -- diluvium-sys refuses
    # to build for a wasm target without one, rather than emit a host
    # object that only fails at link. Cached by version, so the 119 MB
    # tarball is fetched once per cache lifetime, not once per push.
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "27.0"
      WASMTIME_VERSION: v48.0.1
    steps:
      - uses: actions/checkout@v4
      # RUNNER_TEMP is a step-time fact: the `runner` context is not
      # allowed in a job's `env`, and a workflow that reads it there is
      # refused whole, before any job runs -- which is how every push from
      # M1 to M6 reported "failure" with no job to show for it.
      - name: Where the wasi-sdk lives
        run: echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip2
      - name: wasi-sdk, cached
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.WASI_SDK_PATH }}
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
      - name: wasi-sdk, fetched
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          set -eu
          major=${WASI_SDK_VERSION%%.*}
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz"
          mv "$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" "$WASI_SDK_PATH"
          "$WASI_SDK_PATH/bin/clang" --version | head -1
      - name: wasmtime
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/wasmtime.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/wasmtime.tar.xz"
          sudo install "$RUNNER_TEMP/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      - name: Build the wasi profile
        run: cargo build --profile release-small -p drt --no-default-features --features wasi --target wasm32-wasip2
      # The artifact says what it is, from inside wasmtime: the same
      # read-it-off-the-bytes rule BUILDINFO follows for the native legs.
      - name: The artifact names its profile
        run: |
          set -eu
          script/drt-wasip2.sh --version
          script/drt-wasip2.sh buildinfo | tee "$RUNNER_TEMP/buildinfo.txt"
          grep -q '^profile: wasi$' "$RUNNER_TEMP/buildinfo.txt"
      - name: The examples gate, through wasmtime
        run: cd examples && DRT="$GITHUB_WORKSPACE/script/drt-wasip2.sh" ./run-all.sh

  fidelity:
    # The benchmark's *deterministic* fields, checked against the committed
    # baseline. Timings deliberately are not: doc/Benchmarks.md's doctrine is
    # that a shared runner varies by more than most regressions worth
    # catching, so a wall-clock assertion fails when the runner is busy
    # rather than when something is wrong. Bytes, counts, the step counts the
    # rate limiter produces, and allocations on the hot path are all
    # reproducible — a difference in those is a fidelity bug in the port.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the benchmark
        run: cargo run --release -p drt-bench -- --json --seed 7 > /tmp/drt-bench.json
      - name: Deterministic fields match the baseline
        run: python3 bench/check-fidelity.py bench/c-swarm_bench-baseline.json /tmp/drt-bench.json
      - name: Keep the run for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drt-bench-run
          path: /tmp/drt-bench.json
