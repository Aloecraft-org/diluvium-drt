name: ci

on:
  push:
    # `main` for when there is one; the working branch is the trunk in
    # practice today, and a trunk whose pushes are never checked is a CI
    # config that agrees with itself and nothing else.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  guarantees:
    # SPEC.md §11: GUARANTEES.md is maintained from day one, CI-checked for
    # presence. The list only grows deliberately; losing the file is a break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GUARANTEES.md is present and non-empty
        run: test -s GUARANTEES.md

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      # The profile that actually covers the code: `cargo test --workspace`
      # builds `drt` with its DEFAULT feature (slim), so relay, tunnel, ssh
      # and sql — and every test gated on them — were never compiled here,
      # let alone run. The release workflow tests --all-features and so
      # caught a failure this job structurally could not see. Two profiles,
      # because a suite that runs one of them is a suite with a blind spot.
      # Cores armed here too, not just in release.yml. The SIGSEGV that
      # has cost two releases turned up in this job on 2026-08-28, in the
      # `stun` test binary — a binary written that afternoon, which is
      # what proved it is not host_lua-specific. It has never reproduced
      # locally, so the only place a backtrace will ever come from is the
      # job where it happens. Costs seconds.
      - name: Arm core dumps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: Test (all features)
        run: |
          ulimit -c unlimited
          cargo test --workspace --all-features
      - name: Backtrace any core
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core dump was written (the failure may not have been a crash)"
            exit 0
          fi
          for c in "${cores[@]}"; do
            echo "=================== $c ==================="
            exe=$(file "$c" | grep -oP "execfn: '\K[^']+" | head -1)
            echo "execfn: $exe"
            gdb -batch -ex "thread apply all bt" "$exe" "$c" 2>&1 | head -200
          done
      - name: Build without default features
        run: cargo build --workspace --no-default-features

  changelog:
    # CHANGELOG.yaml is the source of truth; CHANGELOG.md and changelog.json
    # are generated and COMMITTED, because the release mirror runs on a host
    # with a stdlib-only Python and no build step and reads changelog.json
    # directly. `check` is what stops that committed copy going stale, and
    # `consistency` is what stops the tree's version drifting away from the
    # newest entry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - run: ./script/changelog.py validate
      - run: ./script/changelog.py check
      - run: ./script/changelog.py consistency

  wasm:
    # The browser tier compiles for its actual target, on every push.
    #
    # NOT in the release matrix, deliberately: `drt-web` is a cdylib, so a
    # `.wasm` does get produced, but it currently has exactly one export
    # (`memory`) and no callable functions — there is no wasm-bindgen
    # export layer yet (task #31). Publishing that would put a name in
    # releases.json for a file nobody can call, and the artifact's contents
    # would change completely the day exports land while the name stayed
    # the same. A release artifact is a compatibility surface; an inert one
    # is a promise you cannot keep.
    #
    # What IS worth having now is this: the Lab's Stage 3 depends on
    # drt-web still compiling for wasm32, and without this job the day it
    # stops compiling is the day someone starts that work, not the day it
    # broke. Thirty seconds a push to move that discovery earlier.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build drt-web for wasm32
        run: cargo build -p drt-web --target wasm32-unknown-unknown
      - name: Its tests, natively (the rlib half is why they can run at all)
        run: cargo test -p drt-web

  wasip2:
    # The portable build (doc/Wasm.md D2, M1): `drt` itself, for
    # wasm32-wasip2, run under wasmtime. Proven by the examples gate rather
    # than by `--version` alone, because the gate is what exercises the
    # connectors and the C core, and it already exists: every example that
    # needs no `full`-only verb passes here unchanged (doc/Wasm.md §2.2).
    #
    # The wasi-sdk is the C toolchain for the core -- diluvium-sys refuses
    # to build for a wasm target without one, rather than emit a host
    # object that only fails at link. Cached by version, so the 119 MB
    # tarball is fetched once per cache lifetime, not once per push.
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "27.0"
      WASMTIME_VERSION: v48.0.1
      WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip2
      - name: wasi-sdk, cached
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
      - name: wasi-sdk, fetched
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          set -eu
          major=${WASI_SDK_VERSION%%.*}
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz"
          mv "$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" "$WASI_SDK_PATH"
          "$WASI_SDK_PATH/bin/clang" --version | head -1
      - name: wasmtime
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/wasmtime.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/wasmtime.tar.xz"
          sudo install "$RUNNER_TEMP/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      - name: Build the wasi profile
        run: cargo build --profile release-small -p drt --no-default-features --features wasi --target wasm32-wasip2
      # The artifact says what it is, from inside wasmtime: the same
      # read-it-off-the-bytes rule BUILDINFO follows for the native legs.
      - name: The artifact names its profile
        run: |
          set -eu
          script/drt-wasip2.sh --version
          script/drt-wasip2.sh buildinfo | tee "$RUNNER_TEMP/buildinfo.txt"
          grep -q '^profile: wasi$' "$RUNNER_TEMP/buildinfo.txt"
      - name: The examples gate, through wasmtime
        run: cd examples && DRT="$GITHUB_WORKSPACE/script/drt-wasip2.sh" ./run-all.sh

  fidelity:
    # The benchmark's *deterministic* fields, checked against the committed
    # baseline. Timings deliberately are not: doc/Benchmarks.md's doctrine is
    # that a shared runner varies by more than most regressions worth
    # catching, so a wall-clock assertion fails when the runner is busy
    # rather than when something is wrong. Bytes, counts, the step counts the
    # rate limiter produces, and allocations on the hot path are all
    # reproducible — a difference in those is a fidelity bug in the port.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the benchmark
        run: cargo run --release -p drt-bench -- --json --seed 7 > /tmp/drt-bench.json
      - name: Deterministic fields match the baseline
        run: python3 bench/check-fidelity.py bench/c-swarm_bench-baseline.json /tmp/drt-bench.json
      - name: Keep the run for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drt-bench-run
          path: /tmp/drt-bench.json
